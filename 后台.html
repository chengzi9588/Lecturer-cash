<style>

.rv-subin{padding:10px 18px 14px 40px;border-bottom:1px solid var(--line);box-shadow:inset 3px 0 0 var(--primary)}

.rv-risks{margin-top:4px}

.rv-t td,.rv-t th{padding:9px 8px;font-size:13px}.rv-t tbody tr{cursor:pointer}.rv-t tbody tr:hover td{background:#f8faff}.rv-t tbody tr.rk td:first-child{box-shadow:inset 3px 0 0 var(--orange)}.rv-t tbody tr.on td{background:var(--primary-soft)}.rv-body .table-wrap{overflow-x:auto}

function nameIssue(name,kind){
  name=(name||'').trim();
  if(!name)return '请填写';
  if(/[\/／\\]/.test(name))return '含“/”等分隔符，疑似艺名 / 多个名称';
  if(/真名|不对外|待定|测试|停用|备注/.test(name))return '含备注字样';
  if(/[()（）【】\[\]]/.test(name)&&kind==='person')return '含括号标注';
  if(kind==='org'){
    if(!/(公司|集团|中心|研究院|研究所|事务所|学校|学院|大学|协会|基金会|工作室|合伙企业)$/.test(name))return '须为营业执照上的机构全称（以“公司 / 中心 / 事务所…”等结尾），不能是简称或个人姓名';
    return '';
  }
  if(!/^[\u4e00-\u9fa5·]{2,8}$/.test(name))return '须为 2~8 个汉字的证件姓名（不含英文、数字、符号）';
  return '';
}

function dedRowsAll(){
  return state.applications.filter(isDed).map(a=>{
    const o=state.bills.find(b=>b.id===a.ref);if(!o)return null;
    return Object.assign({},o,{id:a.id,appId:a.id,isDed:true,dedApp:a,ref:o.id,sub:a.created,files:a.files||[],
      status:a.status==='审批中'?'审批中':a.status==='已驳回'?'驳回待修改':'已扣款'});
  }).filter(Boolean);
}
const allBillRows=()=>state.bills.concat(dedRowsAll());

/* 校验并返回按开始日期排序的有效日期段；不通过则提示并返回 null */
function dsCheck(key){
  const raw=(state.ds||{})[key]||[],l=raw.filter(g=>g.s||g.e);
  if(l.some(g=>!g.s)){toast('请完善培训日期','有日期段缺少开始日期','error');return null}
  if(l.some(g=>g.e&&g.e<g.s)){toast('请完善培训日期','有日期段的结束日期早于开始日期','error');return null}
  if(!l.length){toast('请完善培训日期','请至少填写一个培训日期','error');return null}
  const o=l.map(g=>({s:g.s,e:g.e&&g.e!==g.s?g.e:''})).sort((a,b)=>a.s.localeCompare(b.s));
  for(let i=1;i<o.length;i++){if(o[i].s<=(o[i-1].e||o[i-1].s)){toast('请完善培训日期','日期段之间有重叠，请调整','error');return null}}
  return o;
}

function createBill(apply){
  const p=PEOPLE[Number(document.getElementById('newPerson').value)],pr=document.getElementById('newPact').value,price=Number(document.getElementById('newPrice').value),qty=Number(document.getElementById('newQty').value),cat=document.getElementById('newCat').value,unit=document.getElementById('newUnit').value,oth=Number(document.getElementById('newOther').value)||0,othNote=document.getElementById('newOtherNote').value.trim(),amt=Math.round((price*qty+oth)*100)/100;
  const cust=document.getElementById('newCustomer').value.trim(),crs=document.getElementById('newCourse').value.trim();
  if(!pr||!(price>0)||!(qty>0)||!cust||!crs){toast('请完善信息','合同号、最终客户名称、课程名称、单价、数量均为必填','error');return}
  if(oth<0){toast('请完善信息','其他费用不能为负数','error');return}
  if(oth>0&&!othNote){toast('请完善信息','填写了其他费用，须说明费用是什么','error');return}
  const dv=dsCheck('new');if(!dv)return;
  const ct=document.getElementById('newPay').value,ex0=document.getElementById('newExec').value;
  if(apply){
    if(!p.phone){toast('暂不能发起结算申请','该师资手机号缺失，请先补充后再发起','error');return}
    if(needContract({personId:p.personId,role:p.role,category:cat,amount:amt})){
      if(!ct){toast('暂不能发起结算申请','该账单需选择付款合同号，请先在“付款合同号”中选择','error');return}
      const c=payC(ct),left=c?c.total-payUsedAmt(ct):0;
      if(c&&amt>left){toast('已超过可付款金额','付款合同号 '+ct+' 剩余可付款 '+money(left)+'，本单 '+money(amt),'error');return}
    }

  const id='KB202611-'+String(state.bills.length+200).padStart(4,'0');
  state.bills.unshift(mk({files:(state.newFiles||[]).slice(),id,sub:nowStr(),personId:p.personId,name:p.name,phone:p.phone,role:p.role,project:pr,customer:cust,course:crs,exec:ex0,date:dv[0].s,amount:amt,price,qty,other:oth,otherNote:oth>0?othNote:'',unit,category:cat,status:'待提交',contract:ct,issue:p.phone?'':'手机号缺失',source:'手工创建',remark:document.getElementById('newRemark').value.trim()}));
  state.newFiles=[];

    if(ct)nb.confirmed=true;

    go('/bills');openApply([id]);toast('账单已创建',id+' 已进入“待申请”，请选择结算方式并确认发起');
    return;
  }
  toast('账单已创建',id+' 为待提交状态，请在详情页选择付款合同号后发起结算申请'+(ex0?'':'；该账单未关联执行单，不影响申请，但最终必须补关联'));go('/bills/detail?id='+id);
}

/* ================= 发起结算申请（课酬账单页直接发起；没有待结算清单） =================
 * 待申请账单不区分常规 / 紧急，发起时才选择方式；一批账单只能选一种方式，常规与紧急必须分开发起。
 * 发起后每张账单各生成一张结算单（审批单号=账单号），单独审批、单独驳回；同一次发起共用一个“提交批号”，只用于关联查看。
 * 项目经理在“审批中 / 已驳回”标签点击账单，从右侧抽屉查看审批进度。 */
function openApply(ids){
  ids=ids||[...state.selectedBills];
  const list=ids.map(id=>state.bills.find(b=>b.id===id)).filter(b=>b&&canApply(b));
  if(!list.length){toast('请先勾选账单','只能勾选“可申请”的账单','error');return}
  state.ap={ids:list.map(b=>b.id),type:'常规',reason:'',note:''};
  paintApply();
}
function apSet(k,v){state.ap[k]=v}
function apType(t){state.ap.type=t;paintApply()}
function paintApply(){
  const ap=state.ap,list=ap.ids.map(id=>state.bills.find(b=>b.id===id)).filter(Boolean);
  const needEval=evalPending(list),noEx=list.filter(b=>!b.exec),rk=list.filter(b=>billRisks(b).length);
  const tot=list.reduce((n,b)=>n+b.amount,0),projects=[...new Set(list.map(b=>b.project))];
  const opt=(v,t)=>'<option '+(ap.reason===v?'selected':'')+' value="'+v+'">'+t+'</option>';
  const bad1=list.filter(b=>b.issue),bad2=list.filter(b=>!payOk(b)),hardFail=!!(bad1.length||bad2.length||needEval.length);
  const hkRow=(t,rows)=>'<div style="margin:6px 0 2px;color:#b42318"><b>✗ '+t+'</b></div>'+rows.map(r=>'<div style="padding-left:22px;line-height:1.8;color:#7a271a">'+r+'</div>').join('');
  const who=b=>'<b>'+b.name+'</b>（'+b.role+'）· '+b.project+' · '+b.id;
  const hk=hardFail?'<div style="border:1px solid #f5c2c2;background:#fff6f5;border-radius:8px;padding:10px 14px;margin-bottom:12px"><div style="font-weight:700;margin-bottom:2px">以下事项需先处理后方可发起付款</div>'+
    (bad1.length?hkRow('讲师 / 助教信息不完整，或账号未创建',bad1.map(b=>who(b)+'：'+b.issue)):'')+
    (bad2.length?hkRow('付款合同号为空',bad2.map(b=>who(b)+'：'+b.category+'未关联付款合同号')):'')+
    (needEval.length?hkRow('讲师未评价',needEval.map(p=>{const ls=[...new Set(list.filter(b=>b.project===p&&b.role==='讲师').map(b=>b.name))];return '<b>'+p+'</b>'+(ls.length?'（涉及讲师：'+ls.join('、')+'）':'')+'：尚未评价<button class="link" style="color:#b42318;margin-left:8px" onclick="doEval(\''+p+'\');paintApply()">去评价</button>'})):'')+'</div>':'';

  modal('发起结算申请',
   '<div class="sumline">本次发起 <b>'+list.length+'</b> 张账单（生成 '+list.length+' 张结算单），合计 <b style="color:var(--primary);font-size:17px">'+money(tot)+'</b><span class="muted">　'+projects.join('、')+'</span></div>'+
   hk+
   '<div class="chpick"><label class="'+(ap.type==='常规'?'on':'')+'"><input type="radio" name="apType" '+(ap.type==='常规'?'checked':'')+' onchange="apType(\'常规\')"><div><b>常规结算</b><span>审批通过后进入账期，到期转可提现</span></div></label>'+
   '<label class="urg '+(ap.type==='紧急'?'on':'')+'"><input type="radio" name="apType" '+(ap.type==='紧急'?'checked':'')+' onchange="apType(\'紧急\')"><div><b>紧急结算</b><span>审批通过后直接可提现，须填写紧急结算原因</span></div></label></div>'+
   '<div class="muted" style="margin:-4px 0 12px;font-size:12.5px">常规与紧急必须分开发起：本次所选账单统一按所选方式提交。每张账单各生成一张结算单，单独审批、单独驳回。</div>'+
   (ap.type==='紧急'?'<div class="field"><label><em>*</em> 紧急结算原因</label><select class="select" onchange="apSet(\'reason\',this.value)"><option value="">请选择</option>'+opt('客户付款周期要求','客户付款周期要求')+opt('项目提前验收','项目提前验收')+opt('其他业务紧急情况','其他业务紧急情况')+'</select></div><div class="field"><label><em>*</em> 补充说明</label><textarea placeholder="请说明紧急背景与期望时间" oninput="apSet(\'note\',this.value)">'+ap.note+'</textarea></div>':'')+
   (rk.length?'<div class="notice-bar"><b>所选账单含风险提醒</b>（仅提醒，不影响发起；审批人会看到）'+riskList(rk.map(b=>'<b>'+b.id+'</b> '+b.name+'：'+billRisks(b).join('；')))+'</div>':'')+
   (noEx.length?'<div class="notice-bar"><b>'+noEx.length+'</b> 张账单尚未关联执行单：不影响本次申请和后续付款，但最终必须关联；结算单中会标注「未关联执行单」。</div>':''),
   '确认发起',()=>{
    const a=state.ap,cur=a.ids.map(id=>state.bills.find(b=>b.id===id)).filter(Boolean);
    if(evalPending(cur).length){toast('请先完成讲师评价','未完成讲师评价不可发起结算申请','error');return}
    const miss=cur.filter(b=>!payOk(b));
    if(miss.length){toast('发起前校验未通过','付款合同号未选择：'+miss.map(b=>b.id).join('、'),'error');return}
    if(a.type==='紧急'&&(!a.reason||!a.note.trim())){toast('请完善信息','紧急结算原因和补充说明均为必填','error');return}
    closeModal();doApply(cur,a.type,a.type==='紧急'?a.reason+'：'+a.note.trim():'');
  });
  const mo=document.getElementById('modalOk');if(mo&&hardFail){mo.disabled=true;mo.title='还有事项需先处理，处理后方可发起付款'}
}
function doApply(list,type,reason){
  let seq=state.applications.length+9;while(state.applications.some(x=>x.batchNo==='JS202611-'+String(seq).padStart(4,'0')))seq++;
  const batchNo='JS202611-'+String(seq).padStart(4,'0'),at='2026-11-03 19:20';
  /* 每张账单各生成一张结算单：单独审批、单独驳回；紧急结算原因复制到每一张 */
  list.forEach(b=>{
    state.applications=state.applications.filter(x=>x.id!==b.id);
    state.applications.unshift({id:b.id,batchNo,from:'课酬账单页发起',version:1,type,status:'审批中',node:0,owner:PM_NAME,created:at,arrive:at,reason,rejectReason:'',history:[],
      fin:{'胡世超':'wait','周敏':'wait'},log:[{k:'submit',who:PM_NAME,role:'项目经理',at,text:'发起结算申请'+(type==='紧急'?'（紧急结算：'+reason+'）':'')}]});
    b.appId=b.id;b.batchNo=batchNo;b.status='审批中';b.edits=[];
  });
  const noEx=list.filter(b=>!b.exec).length;
  state.selectedBills.clear();state.billView.tab='applied';state.billView.issue='';if(state.pg['bills'])state.pg['bills'].page=1;
  toast('发起成功','共 '+list.length+' 张账单，各生成一张结算单（提交批号 '+batchNo+'），单独审批（'+type+'结算）'+(noEx?'，其中 '+noEx+' 张未关联执行单，已在结算单中标注':'')+'。点击账单可查看审批进度');if(route().startsWith('/bills/'))go('/bills');else render();
}

  if(a.status==='已驳回'){const why=String(a.rejectReason||'').replace(/"/g,'&quot;');return '<span class="tag red">已驳回</span><div class="muted" style="font-size:12px">驳回即终结，订单冻结已解除</div>'+(why?'<div style="font-size:12px;color:#b42318;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="'+why+'">原因：'+why+'</div>':'')}
  return '<b>财务审批中</b><div class="muted" style="font-size:12px">一位财务通过即可</div>';
}
function bdProgress(a){

  if(a.status==='已驳回'){const why=String(a.rejectReason||'').replace(/"/g,'&quot;');return '<span class="tag red">已驳回</span><div class="muted" style="font-size:12px">退回至“'+(a.rejectNode===0?'项目主管':'财务')+'”节点</div>'+(why?'<div style="font-size:12px;color:#b42318;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="'+why+'">原因：'+why+'</div>':'')}
  return a.node?'<b>财务审批中</b><div class="muted" style="font-size:12px">'+FIN_PPL.map(p=>p+(a.fin&&a.fin[p]==='done'?' ✓':' ○')).join('　')+'</div>':'<b>项目主管审批中</b>';

    '<div class="filters-more'+(c.more?' open':'')+'">'+fi('cfPayee',c.payee,'收款人姓名','收款人')+fi('cfPact',c.pact,'支持模糊','合同号')+sel2('cfRole','角色',c.role||'',F_ROLE)+sel2('cfTtype','讲师类型',c.ttype||'',F_TTYPE)+sel2('cfProject','项目',c.project||'',fProjOpts(mrows))+FAMT('cfMin','cfMax',c,'min','max')+FPROXY('cfProxy',c)+'</div></div>';

function cfQuery(){cfRead();cfClearSel();cfPage1();render()}
function cfReset(){Object.assign(state.cf,CF_FIELDS,{multi:[]});cfClearSel();cfPage1();render()}
function cfSetTab(t){cfRead();state.cf.tab=t;Object.assign(state.cf,{reason:'',fail:'',status:''});cfClearSel();cfPage1();render()}
function cfSetMonth(m){cfRead();Object.assign(state.cf,{month:m,batch:'',multi:[]});cfClearSel();cfPage1();render()}
function cfMonths(){return [...new Set(state.withdrawals.map(cfMonthOf))].sort()}
function cfMonthStep(d){const ms=cfMonths(),i=ms.indexOf(state.cf.month)+d;if(i>=0&&i<ms.length)cfSetMonth(ms[i])}
function cfPickBatch(k){cfRead();const c=state.cf;c.batch=c.batch===k?'':k;cfClearSel();cfPage1();render()}
function cfApply(rows){
  const c=state.cf,m=c.multi&&c.multi.length?new Set(c.multi):null;
  return rows.filter(w=>{
    if(c.batch&&cfBatchKey(w)!==c.batch)return false;
    if(m&&!m.has(w.id))return false;
    if(!wfMatch(w,c))return false;
    return true;
  });
}
function cfCurrent(){
  const c=state.cf,rows=cfApply(state.withdrawals.filter(w=>cfMonthOf(w)===c.month));
  return c.tab==='all'?rows:rows.filter(w=>cfGroup(w)===c.tab);
}
function cfSel(){
  const c=state.cf,mrows=cfApply(state.withdrawals.filter(w=>cfMonthOf(w)===c.month)).filter(w=>cfGroup(w)==='pending');
  return c.all?mrows:mrows.filter(w=>state.selectedConfirms.has(w.id));
}
function cfToggle(id,v){
  const c=state.cf;
  if(c.all&&!v){c.all=false;cfApply(state.withdrawals.filter(w=>cfMonthOf(w)===c.month)).filter(w=>cfGroup(w)==='pending').forEach(w=>state.selectedConfirms.add(w.id))}
  v?state.selectedConfirms.add(id):state.selectedConfirms.delete(id);cfRender();
}
function cfTogglePage(v){
  const c=state.cf,page=slicePg('confirm',cfCurrent()).filter(w=>cfGroup(w)==='pending');
  if(!v&&c.all){c.all=false;state.selectedConfirms.clear()}
  page.forEach(w=>v?state.selectedConfirms.add(w.id):state.selectedConfirms.delete(w.id));cfRender();
}
function cfSelAll(){state.cf.all=true;cfRender()}

/* ---- 渲染 ---- */
function cfBanner(mrows){
  const c=state.cf,pend=mrows.filter(w=>cfGroup(w)==='pending');if(!pend.length)return '';
  const [y,m]=c.month.split('-').map(Number),[ty,tm,td]=CF_TODAY.split('-').map(Number);
  const left=Math.round((Date.UTC(y,m,0)-Date.UTC(ty,tm-1,td))/864e5);
  const btn='<button class="btn sm" onclick="cfSetTab(\'pending\')">去处理</button>';
  if(c.month<CF_TODAY.slice(0,7))return '<div class="cf-banner red"><span><b>'+c.month+' 月度付款已超过月底，仍有 '+pend.length+' 笔未确认（'+money(cfSum(pend))+'）</b>。讲师 / 助教端仍显示“提现中”，请尽快核对银行回单并确认。</span>'+btn+'</div>';
  if(left<=c.remind)return '<div class="cf-banner"><span><b>距本月月底仅剩 '+left+' 天，仍有 '+pend.length+' 笔未确认（'+money(cfSum(pend))+'）</b>。请在月底前完成付款确认，避免讲师 / 助教到账状态延迟。</span>'+btn+'</div>';
  return '';
}
function cfStat(b){
  const g={pending:[],done:[],failed:[],paused:[]};b.rows.forEach(w=>g[cfGroup(w)].push(w));
  const eff=b.rows.length-g.paused.length,failing=g.failed.filter(w=>w.status==='失败待审批').length,settled=!g.pending.length&&!failing,total=cfSum(b.rows);
  const st=!g.pending.length?(settled?['已完成','green']:['待处理异常','red']):(!(g.done.length+g.failed.length)?['未开始','']:['确认中','orange']);
  const prog='已到账 '+money(cfSum(g.done))+(g.failed.length?'，付款失败 '+money(cfSum(g.failed)):'');
  const ok='<div class="cf-rec ok">✓ 对账一致：已到账 + 付款失败 + 暂不付款 = 批次总额</div>';
  let rec='';
  if(b.p){
    const expect=cfSum(b.rows.filter(w=>!w.deferred));
    rec=expect!==b.p.amount?'<div class="cf-rec bad">⚠ 与付款单金额不一致：付款单 '+money(b.p.amount)+'，明细 '+money(expect)+'</div>':settled?ok:'<div class="cf-rec">'+prog+' / 付款单 '+money(b.p.amount)+'</div>';
  }else rec=settled?ok:'<div class="cf-rec">'+prog+' / 批次总额 '+money(total)+'</div>';
  return {g,eff,failing,settled,total,st,rec,pct:n=>eff?(n/eff*100).toFixed(1):0};
}
const cfBar=(s)=>'<div class="cf-bar"><i class="d" style="width:'+s.pct(s.g.done.length)+'%"></i><i class="f" style="width:'+s.pct(s.g.failed.length)+'%"></i></div>';
function cfSideItem(m,b){
  const c=state.cf;
  if(!b)return '<div class="cf-si empty"><div class="cf-si-h"><b>'+m+'</b><span class="cf-si-s">无</span></div><div class="cf-si-s">0 笔</div></div>';

  return '<div class="cf-si'+(c.batch===b.key?' on':'')+'" onclick="cfPickBatch2(\''+b.key+'\')"><div class="cf-si-h"><b>'+m+'</b>'+(pn?'<span class="cf-n warn">待确认 '+pn+'</span>':s.settled?'<span class="cf-si-ok">✓ 已完成</span>':'<span class="cf-si-bad">有异常</span>')+'</div><div class="cf-si-s">'+b.rows.length+' 笔 · '+money(s.total)+'</div>'+cfBar(s)+'</div>';
}
function cfSideGroup(type,bks){
  const g=bks.filter(b=>b.type===type);
  return '<div class="cf-side-g"><b>'+type+'付款单</b></div>'+(g.length?CF_METHODS.filter(m=>g.some(x=>x.method===m)).map(m=>cfSideItem(m,g.find(x=>x.method===m))).join(''):'<div class="cf-si-s" style="padding:0 4px">本月无</div>');
}
function cfMiniGroup(type,bks){
  const c=state.cf,g=bks.filter(b=>b.type===type);
  if(!g.length)return '';
  return '<div class="cf-mini-g">'+type+'</div>'+CF_METHODS.filter(m=>g.some(x=>x.method===m)).map(m=>{
    const b=g.find(x=>x.method===m),s=cfStat(b),pn=s.g.pending.length;
    return '<div class="cf-si mini'+(c.batch===b.key?' on':'')+'" title="'+b.title+' · '+b.rows.length+' 笔 · '+money(s.total)+(pn?' · 待确认 '+pn:'')+'" onclick="cfPickBatch2(\''+b.key+'\')"><b>'+m+'</b>'+(pn?'<span class="cf-n warn">'+pn+'</span>':s.settled?'<span class="cf-si-ok">✓</span>':'<span class="cf-si-bad">!</span>')+'</div>';
  }).join('');
}
function cfSide(mrows,months){
  const c=state.cf,doneN=mrows.filter(w=>cfGroup(w)==='done').length,pendN=mrows.filter(w=>cfGroup(w)==='pending').length,cur=CF_TODAY.slice(0,7),bks=cfBatches(mrows);

  }

    '<div class="cf-side-tag">'+mt+'<span>共 '+mrows.length+' 笔 · '+money(cfSum(mrows))+'</span></div>'+
    '<div class="cf-side-sum"><div class="warn"><span>待确认</span><b>'+pendN+'</b></div><div><span>已到账</span><b>'+doneN+'</b></div></div></div>'+
    '<div class="cf-side-t" style="justify-content:flex-end"><button class="link" onclick="cfToggleSide()" title="收起付款单列表，给表格更多空间">收起 ‹</button></div>'+

function cfToggleFocus(){cfRead();state.cf.focus=!state.cf.focus;render()}
function cfHead(b,mrows){

function cfSavedMenu(c){

function cfBatches(mrows){
  const bm=new Map();mrows.forEach(w=>{const k=cfBatchKey(w);if(!bm.has(k))bm.set(k,[]);bm.get(k).push(w)});
  const order={'云账户':0,'开发票':1,'劳务费':2};
  return [...bm.entries()].map(([key,rows])=>{
    const mt=rows[0].method;
    if(key.startsWith('JF-')){
      const ps=[...new Set(rows.map(w=>w.payment))].map(id=>state.monthly.find(x=>x.id===id)).filter(Boolean),un=ps.filter(x=>!x.locked).length;
      return {key,rows,type:'紧急',method:mt,ord:10+(order[mt]??5),title:'紧急付款单 · '+mt,sub:'共 '+ps.length+' 张 · 无账期，随时付款'+(un?' · '+un+' 张未提交易快报':'')};
    }
    const p=state.monthly.find(x=>x.id===key);
    return {key,rows,p,type:'月度',method:mt,ord:order[mt]??5,title:'月度付款单 · '+mt,sub:key+' · '+(p&&p.eak&&p.eak!=='—'?'易快报 '+p.eak:'未提交易快报')};
  }).sort((x,y)=>x.ord-y.ord);
}
const cfStatusTag=w=>{const g=cfGroup(w);return g==='done'?tag('已到账','green'):g==='paused'?tag('暂不付款',''):w.status==='失败待审批'?tag('付款失败 · 待审批','orange'):w.status==='付款失败'?tag('付款失败','red'):tag('待确认','orange')};

/* ---- 确认 / 失败 操作 ---- */
function cfResult(head,html){
  modal(head,html,'知道了',()=>{closeModal();render()});
  const cb=document.querySelector('#modalRoot .modal-foot .btn:not(#modalOk)');if(cb)cb.style.display='none';

function cfDist(list){
  const m={};list.forEach(w=>{(m[w.method]=m[w.method]||{n:0,s:0});m[w.method].n++;m[w.method].s+=w.amount});
  return Object.entries(m).map(([k,v])=>'<tr><td>'+k+'</td><td class="num">'+v.n+' 笔</td><td class="num">'+money(v.s)+'</td></tr>').join('');
}
function cfSummary(list){
  const px=list.filter(cfIsProxy),em=list.filter(w=>w.kind==='紧急');

function cfDoConfirm(list,ctx){
  let ok=[],skip=[];
  list.forEach(w=>{if(cfGroup(w)!=='pending'){skip.push(w);return}w.status='已到账';w.confirmAt=CF_NOW;ok.push(w)});
  cfClearSel();closeModal();
  const names=new Set(ok.map(w=>w.name)).size;
  render();
  cfResult('确认完成','<div class="cf-sumbox"><div><span>确认成功</span><b style="color:var(--green)">'+ok.length+' 笔</b></div><div><span>成功金额</span><b>'+money(cfSum(ok))+'</b></div><div><span>跳过</span><b>'+skip.length+' 笔</b></div></div><p class="modal-note" style="margin:0">'+ctx+'已将 <b>'+ok.length+'</b> 笔冻结金额转入“已到账”，并已通知 <b>'+names+'</b> 位讲师 / 助教。'+(skip.length?'<br>跳过原因：这 '+skip.length+' 笔在确认前已被其他人处理（状态已变更）。':'')+'</p>');
}
function cfBatchOk(){
  const list=cfSel();if(!list.length)return;
  modal('批量确认付款成功','<p class="modal-note">请确认以下提现单已<b>实际付款成功</b>（已核对银行回单 / 云账户回执）。</p>'+cfSummary(list)+cfEakWarn(list)+'<div class="cf-warn" style="background:#fff4f4;border-color:#f5c2c2;color:#b42318"><b>不可撤销：</b>确认后款项转为“已到账”并推送讲师 / 助教，已确认的记录不可再修改。</div><label class="cf-check"><input type="checkbox" class="check" id="cfAck"> 我已核对付款结果，确认这 '+list.length+' 笔均已付款成功</label>','确认成功 '+list.length+' 笔',()=>{
    if(!document.getElementById('cfAck').checked){toast('请先勾选确认','需确认已核对付款结果','error');return}
    cfDoConfirm(list,'');
  });
}
function cfBatchAll(key){
  const mrows=state.withdrawals.filter(w=>cfMonthOf(w)===state.cf.month&&cfBatchKey(w)===key);
  const list=mrows.filter(w=>cfGroup(w)==='pending'),fail=mrows.filter(w=>cfGroup(w)==='failed'),pause=mrows.filter(w=>cfGroup(w)==='paused'),done=mrows.filter(w=>cfGroup(w)==='done');
  if(!list.length)return;
  const b=cfBatches(mrows)[0];
  modal('整单确认 · '+b.title,'<p class="modal-note">将本批次下所有<b>待确认</b>的提现单一次性确认为付款成功。</p>'+cfSummary(list)+cfEakWarn(list)+'<div class="cf-tip">已自动排除：已到账 '+done.length+' 笔、付款失败 '+fail.length+' 笔、暂不付款 '+pause.length+' 笔（不会被整单确认覆盖）。</div><div class="cf-warn" style="background:#fff4f4;border-color:#f5c2c2;color:#b42318"><b>不可撤销：</b>确认后款项转为“已到账”并推送讲师 / 助教。若其中个别笔实际未付成功，请先“取消”并对该笔单独确认付款失败。</div><label class="cf-check"><input type="checkbox" class="check" id="cfAck"> 我已核对本批次付款结果，确认以上 '+list.length+' 笔均已付款成功</label>','整单确认 '+list.length+' 笔',()=>{
    if(!document.getElementById('cfAck').checked){toast('请先勾选确认','需确认已核对付款结果','error');return}
    cfDoConfirm(list,'【'+b.title+'】整单确认：');
  });
}
function cfBatchFail(){
  const list=cfSel();if(!list.length)return;
  modal('批量确认付款失败','<p class="modal-note">这 <b>'+list.length+'</b> 笔将使用<b>同一失败原因</b>发起付款失败审批（合同系统 / 钉钉，财务审批）。本系统仅同步审批结果，通过后金额退回讲师提现余额；个别原因不同的请取消后逐笔处理。</p>'+cfSummary(list)+''+cfFailField('cfFailReason')+'<div class="field"><label>内部备注（讲师不可见）</label><textarea id="cfFailNote" placeholder="可记录银行返回信息、沟通过程等"></textarea></div>','提交付款失败审批（'+list.length+' 笔）',()=>{
    const r=document.getElementById('cfFailReason').value.trim(),n=document.getElementById('cfFailNote').value.trim();
    if(!r){toast('无法提交','请填写或选择失败原因','error');return}
    list.forEach(w=>{if(cfGroup(w)==='pending'){w.status='失败待审批';w.failReason=r;w.internal=n;w.failAt=CF_NOW}});
    cfClearSel();closeModal();render();
    cfResult('已提交付款失败审批','<div class="cf-sumbox"><div><span>已提交</span><b>'+list.length+' 笔</b></div><div><span>金额合计</span><b>'+money(cfSum(list))+'</b></div><div><span>失败原因</span><b>'+r+'</b></div></div><p class="modal-note" style="margin:0">已提交合同系统 / 钉钉财务审批，本系统同步结果；讲师 / 助教仅会看到失败原因“'+r+'”，内部备注不会展示。审批进度可在「付款失败」页签或「付款失败审批」页查看。</p>');
  },'danger');
}
function cfEakWarn(list){
  const ps=[...new Set(list.map(w=>w.payment))].map(id=>state.monthly.find(x=>x.id===id)).filter(x=>x&&!x.locked);
  if(!ps.length)return '';
  const n=list.filter(w=>ps.some(x=>x.id===w.payment)).length;
  return '<div class="cf-warn">提示：其中 <b>'+n+' 笔</b>所属付款单（'+ps.map(x=>x.id).join('、')+'）<b>尚未提交易快报</b>。不影响确认，请核实已按流程线下提交。</div>';
}
function confirmOne(id){
  const w=state.withdrawals.find(x=>x.id===id);if(!w||cfGroup(w)!=='pending')return;
  const kv=(k,v)=>'<div class="info-item"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
  modal('确认付款成功','<p class="modal-note">请确认该笔提现单已<b>实际付款成功</b>（已核对银行回单 / 云账户回执）。</p><div class="info-grid" style="grid-template-columns:repeat(2,1fr)">'+kv('提现单号',w.id)+kv('讲师 / 助教',w.name)+kv('收款人',payeeCell(w))+kv('付款方式',w.method)+kv('金额','<span class="num">'+money(w.amount)+'</span>')+kv('收款账号',cfTail(w))+'</div>'+cfEakWarn([w])+(cfIsProxy(w)?'<div class="cf-warn">该笔为<b>代收</b>：收款人（'+w.payee+'）与讲师（'+w.name+'）不一致，请再次核对回单上的收款人。</div>':'')+'<div class="cf-warn" style="background:#fff4f4;border-color:#f5c2c2;color:#b42318"><b>不可撤销：</b>确认后款项转为“已到账”并通知讲师 / 助教，已确认的记录不可再修改。</div>','确认成功',()=>{
    closeModal();
    if(cfGroup(w)!=='pending'){toast('该笔已被处理',id+' 当前状态为 '+w.status,'error');cfRender();return}
    w.status='已到账';w.confirmAt=CF_NOW;state.selectedConfirms.delete(id);toast('已确认付款成功',id+' 已转为已到账，并通知 '+w.name);cfRender();
  });
}

/* ---- 常用筛选 / 列设置 / 批量单号 / 导出 ---- */
function cfSaveCur(){
  cfRead();
  modal('保存当前筛选','<p class="modal-note">保存后可在“常用筛选”中一键应用（含当前状态页签与筛选条件）。</p><div class="field"><label><em>*</em> 名称</label><input class="input" id="cfSaveName" placeholder="例如：云账户代收待确认"></div>','保存',()=>{
    const n=document.getElementById('cfSaveName').value.trim();if(!n){toast('请输入名称','名称不能为空','error');return}
    const c=state.cf,f={};Object.keys(CF_FIELDS).forEach(k=>{if(k!=='batch'&&k!=='multi')f[k]=c[k]});f.tab=c.tab;
    state.cf.saved.push({name:n,f});closeModal();toast('已保存常用筛选',n);render();
  });
}
function cfApplySaved(i){Object.assign(state.cf,CF_FIELDS,{multi:[]},state.cf.saved[i].f);cfClearSel();cfPage1();render()}
function cfDelSaved(i){state.cf.saved.splice(i,1);render()}
function cfCols(){
  modal('列设置','<p class="modal-note">选择表格中展示的列（提现单号和操作列固定展示）。</p><div class="cf-cols">'+CF_COLS.map(x=>'<label><input type="checkbox" class="check" value="'+x[0]+'" '+(state.cf.cols.includes(x[0])?'checked':'')+'> '+x[1]+'</label>').join('')+'</div>','应用',()=>{
    state.cf.cols=[...document.querySelectorAll('.cf-cols input:checked')].map(i=>i.value);closeModal();render();
  });
}
function cfMultiModal(){
  modal('批量粘贴单号查询','<p class="modal-note">粘贴财务回单中的提现单号，支持换行、空格、逗号分隔，最多 500 个。</p><textarea id="cfMultiTxt" style="width:100%;min-height:150px;border:1px solid var(--line);border-radius:7px;padding:10px" placeholder="TX202610-0218&#10;TX202610-0224&#10;…">'+state.cf.multi.join('\n')+'</textarea>','查询',()=>{
    const ids=[...new Set(document.getElementById('cfMultiTxt').value.split(/[\s,，;；]+/).map(s=>s.trim()).filter(Boolean))].slice(0,500);
    const c=state.cf,all=new Set(state.withdrawals.filter(w=>cfMonthOf(w)===c.month).map(w=>w.id)),hit=ids.filter(i=>all.has(i));
    c.multi=ids;cfClearSel();cfPage1();closeModal();render();
    if(ids.length)toast('批量查询完成','共 '+ids.length+' 个单号，匹配 '+hit.length+' 个'+(ids.length-hit.length?'，'+(ids.length-hit.length)+' 个未在本月找到':''),ids.length-hit.length?'error':'');
  });
}
function cfExport(){
  const rows=cfCurrent(),head=['提现单号','类型','讲师/助教','角色','讲师类型','手机号','收款人','是否代收','合同号','付款方式','金额','付款单号','收款账号','提交时间','状态'];
  const csv=[head].concat(rows.map(w=>[w.id,w.kind,w.name,teacherInfo(w).role,teacherInfo(w).type,teacherInfo(w).phone,w.payee||w.name,cfIsProxy(w)?'是':'否',wPacts(w).join('、'),w.method,w.amount,w.payment,w.bank,w.date,w.deferred?'暂不付款':w.status])).map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='付款确认明细_'+state.cf.month+'.csv';document.body.appendChild(a);a.click();a.remove();
  toast('已导出明细','按当前筛选条件导出 '+rows.length+' 笔（CSV，可用 Excel 打开）');
}

function cfOpen(id){
  const w=state.withdrawals.find(x=>x.id===id),g=cfGroup(w),can=cfCan(),p=state.monthly.find(x=>x.id===w.payment);
  const kv=(k,v)=>'<div class="info-item"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
  const log=[[w.date,'提交提现申请','讲师 / 助教 '+w.name]];
  log.push([w.kind==='紧急'?w.date:cfMonthOf(w)+'-11 00:00','纳入'+(w.kind==='紧急'?'紧急':'月度')+'付款单 '+w.payment,'系统']);
  if(p&&p.eak&&p.eak!=='—')log.push(['—','付款单已提交易快报 '+p.eak,'经办人']);
  if(g==='done')log.push([w.confirmAt||'—','确认付款成功，金额转入已到账',CF_OPERATOR]);
  if(g==='failed')log.push([w.failAt||'—','提交付款失败（'+(w.failReason||'—')+'），提交合同系统 / 钉钉审批',CF_OPERATOR]);
  if(w.status==='付款失败')log.push(['—','付款失败审批通过，金额退回讲师可提现余额','财务']);
  if(g==='paused')log.push([w.pauseAt||'—','暂不付款（'+(w.pauseReason||'—')+'），款项退回讲师提现余额',CF_OPERATOR]);
  const alloc=allocTable(w,'cf-mini');
  document.getElementById('modalRoot').innerHTML='<div class="cf-mask" onclick="if(event.target===this)closeModal()"><aside class="cf-drawer"><div class="cf-dh"><div><h3>'+w.id+'</h3><div style="margin-top:6px">'+cfStatusTag(w)+' '+tag(w.kind,w.kind==='紧急'?'orange':'blue')+'</div></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="cf-db">'+
    '<h4>基本信息</h4><div class="info-grid">'+kv('讲师 / 助教',w.name)+kv('角色',teacherInfo(w).role)+kv('讲师类型',teacherInfo(w).type)+kv('手机号',teacherInfo(w).phone)+kv('提现金额','<span class="num">'+money(w.amount)+'</span>')+kv('所属项目',wProjects(w).join('、'))+kv('合同号',wPacts(w).join('、'))+kv('提交时间',w.date)+'</div>'+
    '<h4>收款信息</h4><div class="info-grid">'+kv('收款人',payeeCell(w))+kv('付款方式',w.method)+kv('收款账号',w.bank)+kv('付款单号',w.payment+(p&&p.eak&&p.eak!=='—'?'<br><span class="muted">易快报 '+p.eak+'</span>':''))+'</div>'+(cfIsProxy(w)?'<div class="cf-warn">收款人（'+w.payee+'）与讲师 / 助教（'+w.name+'）不一致，请核对代收授权后再确认。</div>':'')+
    (g==='failed'?'<h4>付款失败信息</h4><div class="info-grid">'+kv('失败原因',w.failReason||'—')+kv('审批状态',w.status==='付款失败'?'审批通过':'合同系统 / 钉钉审批中')+kv('内部备注',w.internal||'—')+'</div>':'')+
    (g==='paused'?'<h4>暂不付款信息</h4><div class="info-grid">'+kv('原因',w.pauseReason||'—')+kv('处理结果','款项已退回讲师提现余额，下月提现窗口可重新申请')+'</div>':'')+
    '<h4>包含订单（课酬账单）</h4>'+alloc+
    '<h4>操作日志</h4><div class="cf-log">'+log.map(l=>'<div><i></i><b>'+l[1]+'</b><span>'+l[0]+' · '+l[2]+'</span></div>').join('')+'</div>'+
    '</div>'+(can&&g==='pending'?'<div class="cf-df"><button class="btn danger" onclick="closeModal();openRefund(\''+w.id+'\')">确认付款失败</button><button class="btn primary" onclick="closeModal();confirmOne(\''+w.id+'\')">确认付款成功</button></div>':'')+'</aside></div>';
}

function openRefund(id){
  modal('确认付款失败','<p class="modal-note">仅在确定不再支付时确认。需逐笔发起付款失败审批（合同系统 / 钉钉，财务审批），本系统同步结果，通过后金额退回讲师提现余额。</p>'+cfFailField('failReason')+'<div class="field"><label>内部备注（讲师不可见）</label><textarea id="internalNote" placeholder="可记录银行返回信息、沟通过程等"></textarea></div>','提交付款失败审批',()=>{

function refunds(){
  const rows=state.withdrawals.filter(w=>w.status==='失败待审批');
  return title('付款失败审批（同步）','付款失败审批在合同系统 / 钉钉中进行（仅需财务审批），本系统只同步审批结果：通过后冻结金额退回讲师提现余额；驳回则恢复原提现中状态。','')+

}
function refundDecision(id,ok){
  const w=state.withdrawals.find(x=>x.id===id);w.status=ok?'付款失败':(w.kind==='紧急'?'提现中':'已导出');
  toast(ok?'已同步：审批通过':'已同步：审批驳回',ok?'冻结金额已退回可提现余额（常规款下一个提现窗口可再提，紧急款可随时再提），并向讲师展示失败原因':'提现单保持提现中，由经办人继续处理');render();
}

function rvNetRows(list){
  const val=v=>v==='—'?'<span class="muted">—</span>':'<del>'+v+'</del>';
  const row=(k,inner)=>`<div class="rv-nr"><span class="k">${k}</span>${inner}</div>`;
  const m={},order=[],add=[],del=[];
  list.forEach(e=>e.changes.forEach(c=>{

    else if(c.f==='附件（删除）'){const k=add.indexOf(c.from);if(k>=0)add.splice(k,1);else del.push(c.from)}
    else if(!m[c.f]){m[c.f]={f:c.f,from:c.from,to:c.to};order.push(c.f)}else m[c.f].to=c.to;
  }));
  const rows=order.map(f=>m[f]).filter(c=>c.from!==c.to).map(c=>row(c.f,`${val(c.from)}<i>→</i><b>${c.to}</b>`))
    .concat(add.map(x=>row('附件',`<b>＋ ${x}</b>`)),del.map(x=>row('附件',`<del>－ ${x}</del>`)));

function dedPv(id,i){pvFileObj(dedFileOf(id,i))}
function dedDl(id,i){dlFileObj(dedFileOf(id,i))}
function dedFilesModal(id){const a=rvApp(id);if(!a)return;modal('扣款附件 · '+id+'（'+(a.files||[]).length+' 个）','<div class="table-wrap"><table><thead><tr><th>文件名</th><th>大小</th><th>操作</th></tr></thead><tbody>'+(a.files||[]).map((f,i)=>'<tr><td>'+f.name+'</td><td>'+fmtSize(f.size)+'</td><td><button class="link" onclick="dedPv(\''+id+'\','+i+')">预览</button> <button class="link" onclick="dedDl(\''+id+'\','+i+')">下载</button></td></tr>').join('')+'</tbody></table></div>','知道了',closeModal)}
function rvPreview(n){pvFileObj({name:n,size:0})}
function rvDownload(n){dlFileObj({name:n})}
/* ---------- 审批动作 ---------- */
const rvSnap=a=>({id:a.id,s:JSON.parse(JSON.stringify({status:a.status,node:a.node,fin:a.fin,log:a.log,rejectNode:a.rejectNode,rejectReason:a.rejectReason,arrive:a.arrive})),b:appBills(a).map(x=>[x.id,x.status])});
function rvRestore(sn,back){const a=rvApp(sn.id);Object.assign(a,JSON.parse(JSON.stringify(sn.s)));if(isDed(a)&&a.status!=='已通过')dedAcct(a,-1);sn.b.forEach(([bid,st])=>{const b=state.bills.find(x=>x.id===bid);if(b)b.status=st})}
function rvUndo(sns,reopen){sns.forEach(rvRestore);const R=state.rv;R.checked=new Set();if(reopen){R.drawerApp=reopen;R.drawer=rvBill(rvApp(reopen)).id}render();toast('已撤销','已恢复到处理前的状态')}
function rvToast(h,m,undo){
  const el=document.createElement('div');el.className='toast';el.innerHTML='<span class="toast-icon">✓</span><div><b>'+h+'</b><p>'+m+'</p></div>'+(undo?'<button class="btn sm" style="margin-left:10px;align-self:center">撤销</button>':'');
  document.getElementById('toasts').appendChild(el);if(undo)el.querySelector('button').onclick=()=>{el.remove();undo()};setTimeout(()=>el.remove(),6000);
}
function rvApply(a,op){
  const m=rvMe();
  if(m.node===0){a.node=1;a.arrive=RV_NOW;a.log.push({k:'pass',who:m.who,role:m.label,at:RV_NOW,text:op})}
  else{a.fin[m.who]='done';a.log.push({k:'pass',who:m.who,role:m.label,at:RV_NOW,text:op});rvFinish(a)}
}
function rvFinish(a){
  if(isDed(a)){
    if(FIN_PPL.some(p=>a.fin[p]==='done')){a.status='已通过';dedAcct(a,1);a.log.push({k:'sys',who:'系统',role:'合同系统',at:RV_NOW,text:'审批通过：已从讲师账户扣减 '+money(a.deductAmt)+'，订单冻结解除，付款合同额度已释放，已同步师资结算系统'})}
    return;
  }
  if(FIN_PPL.every(p=>a.fin[p]==='done')){
    a.status='已通过';appBills(a).forEach(b=>b.status=a.type==='紧急'?'可提现':'账期中');
    a.log.push({k:'sys',who:'系统',role:'合同系统',at:RV_NOW,text:a.type==='紧急'?'审批全部通过：账单直接进入可提现，已同步师资结算系统':'审批全部通过：账单进入账期中，到期转可提现，已同步师资结算系统'});
  }
}
/* 连续审批：处理完自动进入下一张；没有下一张则回到列表 */
function rvAfter(prevList,a,fromDrawer){
  const R=state.rv;R.checked.delete(a.id);
  if(!fromDrawer){rvRender();return}
  const i=prevList.findIndex(x=>x.id===a.id),nl=rvList(),later=prevList.slice(i+1).map(x=>x.id),n=nl.find(x=>later.includes(x.id))||nl.find(x=>x.id!==a.id);
  if(n){R.drawerApp=n.id;R.drawer=rvBill(n).id;R.page=Math.floor(nl.findIndex(x=>x.id===n.id)/R.size)+1;rvRender();}
  else{R.drawer='';R.drawerApp='';toast('待审批已全部处理完','已关闭详情');rvRender()}
}
function rvPass(id){
  const a=rvApp(id),c=rvCan(a);if(!c.ok){toast('当前不可审批',c.why,'error');return}
  rvDoPass(a,'同意');
}
function rvDoPass(a,op){
  const list=rvList(),sn=rvSnap(a),m=rvMe(),fd=state.rv.drawer&&state.rv.drawerApp===a.id;
  rvApply(a,op);
  rvToast(a.status==='已通过'?'已通过 · 审批完成':'已通过',rvLbl(a)+(isDed(a)?'　已从讲师账户扣减 '+money(a.deductAmt):(m.node===1&&a.status!=='已通过'?'　等待另一位财务审批':'　已进入下一环节')),()=>rvUndo([sn],fd?a.id:''));
  rvAfter(list,a,fd);
}
function rvPartner(id){
  const a=rvApp(id),m=rvMe(),o=FIN_PPL.find(p=>p!==m.who);
  a.fin[o]='done';a.log.push({k:'pass',who:o,role:'财务',at:RV_NOW,text:'同意'});rvFinish(a);toast('演示：'+o+' 已通过',a.status==='已通过'?'审批全部通过':'');render();
}
const rvPhHtml=t=>(RV_PHRASE[t]||[]).map(x=>`<span class="chip" onclick="document.getElementById('rvRj').value='${x}'">${x}</span>`).join('');
/* 驳回（单张 / 批量共用）：只退回所选的结算单，重新提交后从驳回节点继续 */
function rvRejectModal(apps,done){
  const R=state.rv,node=rvMe().node?'财务':'项目主管',many=apps.length>1,allDed=apps.every(isDed);
  modal(many?'批量驳回 '+apps.length+' 张结算单':'驳回 '+rvLbl(apps[0]),`<div class="infobox">${many?'所选结算单将<b>统一使用下面的驳回类型和原因</b>，各自单独退回项目经理，互不影响。':'仅退回这一张，退回项目经理 '+apps[0].owner+'，同批其他结算单不受影响。'}${allDed?'驳回后<b>本扣款申请结束，订单冻结自动解除</b>，讲师端恢复可提现；项目经理如仍需扣款，须重新发起申请。':'修改并重新提交后，将<b>从“'+node+'”节点继续审批</b>，前序已通过的节点不重复审批。'}</div>${many?`<div class="rv-bl" style="margin-bottom:12px">${apps.slice(0,8).map(x=>`<div>${rvLbl(x)}　${appProject(x)}　${money(rvAmt(x))}</div>`).join('')}${apps.length>8?`<div class="muted">… 另有 ${apps.length-8} 张</div>`:''}</div>`:''}<div class="field"><label><em>*</em> 驳回类型</label><div class="rv-types">${RV_TYPES.map(t=>`<span class="chip ${R.rejType===t?'on':''}" onclick="state.rv.rejType='${t}';document.querySelectorAll('.rv-types .chip').forEach(e=>e.classList.toggle('on',e.textContent==='${t}'));document.getElementById('rvPh').innerHTML=rvPhHtml('${t}')">${t}</span>`).join('')}</div></div><div class="field"><label><em>*</em> 驳回原因（项目经理可见）</label><textarea id="rvRj" placeholder="写清楚需要修改什么，至少 5 个字"></textarea><div id="rvPh" class="rv-ph">${rvPhHtml(R.rejType)}</div></div>`,many?'确认批量驳回':'确认驳回',()=>{
    const r=document.getElementById('rvRj').value.trim();if(r.length<5){toast('请填写驳回原因','至少 5 个字，方便项目经理修改','error');return}
    const m=rvMe();apps.forEach(a=>{a.status='已驳回';a.rejectNode=m.node;a.rejectReason=R.rejType+'；'+r;if(!isDed(a))appBills(a).forEach(b=>b.status='驳回待修改');a.log.push({k:'reject',who:m.who,role:m.label,at:RV_NOW,text:r,rtype:R.rejType})});
    closeModal();done();
  },'danger');
}
function rvReject(id){
  const a=rvApp(id),c=rvCan(a);if(!c.ok){toast('当前不可审批',c.why,'error');return}
  const list=rvList(),fd=state.rv.drawer&&state.rv.drawerApp===a.id;
  rvRejectModal([a],()=>{toast('已驳回',rvLbl(a)+' 已退回项目经理');rvAfter(list,a,fd)});
}
/* 批量 */
function rvPicked(){return rvList().filter(x=>state.rv.checked.has(x.id)&&rvCan(x).ok)}
function rvBatchPass(){
  const els=rvPicked(),m=rvMe();if(!els.length)return;
  const hiL=els.filter(x=>rvCnt(x).h);
  modal('批量同意 '+els.length+' 张结算单',`<div class="infobox">增款合计 ${money(els.filter(x=>!isDed(x)).reduce((s,x)=>s+rvAmt(x),0))}，其中紧急单 ${els.filter(x=>x.type==='紧急').length} 张；扣款单 ${els.filter(isDed).length} 张，合计 −${money(els.filter(isDed).reduce((s,x)=>s+rvAmt(x),0))}。${hiL.length?'<br><b style="color:var(--red)">其中 '+hiL.length+' 张含高风险提示（'+hiL.slice(0,3).map(x=>rvLbl(x)).join('、')+(hiL.length>3?' 等':'')+'），仅作提醒，是否通过由你判断。</b>':''}${m.node===1&&els.some(x=>!isDed(x))?'<br>增款结算单的财务节点需两位审批人均通过，你通过后仍需另一位审批。':''}${els.some(isDed)?'<br>扣款单只需一位财务通过，通过即从讲师账户扣减。':''}</div><div class="rv-bl">${els.slice(0,10).map(x=>`<div>${rvLbl(x)}${isDed(x)?' [扣款]':''}${x.type==='紧急'?' [紧急]':''}　${appProject(x)}　${money(rvAmt(x))}</div>`).join('')}${els.length>10?`<div class="muted">… 另有 ${els.length-10} 张</div>`:''}</div><div class="field" style="margin-top:12px"><label>审批意见（可选）</label><textarea id="rvBo" style="width:100%;min-height:56px;border:1px solid #d7ddea;border-radius:8px;padding:8px 10px">同意</textarea></div>`,'确认同意',()=>{
    const op=document.getElementById('rvBo').value.trim()||'同意',sns=els.map(rvSnap);els.forEach(x=>rvApply(x,op));closeModal();state.rv.checked=new Set();
    rvToast('已批量同意','共 '+els.length+' 张结算单',()=>rvUndo(sns));render();
  },'green');
}
function rvBatchReject(){
  const els=rvPicked();if(!els.length)return;
  rvRejectModal(els,()=>{state.rv.checked=new Set();toast('已批量驳回','共 '+els.length+' 张结算单已退回项目经理');render()});
}
document.addEventListener('keydown',e=>{
  if(route()!=='/review'||!hasAccess('/review')||document.getElementById('modalRoot').innerHTML)return;
  if(['INPUT','TEXTAREA','SELECT'].includes((e.target.tagName||'')))return;
  const R=state.rv,k=e.key;if(!R.drawer)return;
  if(k==='ArrowRight'){e.preventDefault();rvDStep(1)}
  else if(k==='ArrowLeft'){e.preventDefault();rvDStep(-1)}
  else if(k==='Escape'){rvCloseDrawer()}
  else if(k==='a'||k==='A'){rvPass(R.drawerApp)}
  else if(k==='r'||k==='R'){e.preventDefault();rvReject(R.drawerApp)}
});
const SUB_PAGES=['/bills/detail','/bills/new','/accounts/detail','/accounts/new','/accounts/org/detail','/accounts/org/new','/payments/monthly/detail'];
function render(){
  renderShell();document.getElementById('sidebar').classList.remove('open');
  const p=route();let html='';
  document.body.classList.toggle('cf-page',p==='/confirm'&&hasAccess(p));document.body.classList.toggle('rv-page',p==='/review'&&hasAccess(p));document.body.classList.toggle('cf-focus',p==='/confirm'&&hasAccess(p)&&!!state.cf.focus);
  if(!hasAccess(p)) html=forbidden();
  else {
    const map={
      '/bills':bills,'/bills/detail':billDetail,'/bills/new':billNew,
      '/accounts/teacher':()=>accounts('teacher'),'/accounts/assistant':()=>accounts('assistant'),'/accounts/detail':accountDetail,'/accounts/new':accountNew,'/accounts/org':orgList,'/accounts/org/new':orgNew,'/accounts/org/detail':orgDetail,'/withdrawals':withdrawals,'/payments/monthly':monthlyPayments,
      '/payments/monthly/detail':monthlyDetail,'/confirm':paymentConfirm,'/refunds':refunds,'/settings':settings,'/review':review
    };
    if(!map[p]){location.hash=landing();return}
    html=map[p]();
  }
  // 二级页面（详情 / 新增）的操作按钮统一悬浮在页面底部居中
  if(SUB_PAGES.includes(p)){
    const m=html.match(/<div class="page-title"><div class="actions">([\s\S]*?)<\/div><\/div>/);
    if(m) html=html.replace(m[0],'')+'<div class="page-foot-space"></div><div class="page-foot">'+m[1]+'</div>';
  }
  {const sy=window.scrollY;document.getElementById('app').innerHTML=html;window.scrollTo(0,window.__keepScroll?sy:0);window.__keepScroll=false}
  {const f=document.getElementById('cartFab');if(f)f.remove()}
  if(p!=='/bills'&&p!=='/bills/detail')state.bd.bill='';
  renderAdoc();
}
window.addEventListener('hashchange',render);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.cf.focus&&!document.getElementById('modalRoot').innerHTML){state.cf.focus=false;render()}});
/* 扣款单演示数据（必须在 rvSeed 之后：rvSplit 会重建结算单列表） */

    state.applications.unshift(a);return a;
  };
  mkd('KK202611-0003','KB202609-0171',3000,'审批中','课程由 3 天缩减为 2 天，多付 1 天课酬',
    '2026-11-03 14:30',[F('课程缩减确认邮件.pdf',286000,'2026-11-03 14:28')]);

    '2026-11-02 11:20',[F('重复结算核对表.xlsx',64000,'2026-11-02 11:18')],{fin:{'胡世超':'done','周敏':'wait'},acctApplied:true});
  ok.log.push({k:'pass',who:'胡世超',role:'财务',at:'2026-11-02 15:10',text:'同意'},{k:'sys',who:'系统',role:'合同系统',at:'2026-11-02 15:10',text:'审批通过：已从讲师账户扣减 '+money(1200)+'，订单冻结解除，付款合同额度已释放，已同步师资结算系统'});
  const rj=mkd('KK202611-0001','KB202610-0190',800,'已驳回','客户反馈培训时长不足，需扣减部分课酬',

  rj.log.push({k:'reject',who:'周敏',role:'财务',at:'2026-11-01 17:40',text:'缺少客户确认的扣款依据，请补充后重新发起',rtype:'材料缺失'});

rvSeed();dedSeed();
if(!location.hash) location.hash=landing(); else render();
