<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>师资结算后台 · 交互原型 V3.0</title>
<style>
:root{
  --primary:#315cec;--primary-2:#2448c7;--primary-soft:#eef2ff;--nav:#111a2e;
  --nav-2:#18233b;--bg:#f5f7fb;--card:#fff;--text:#172033;--sub:#68728a;
  --line:#e5e9f2;--green:#179b70;--green-bg:#e9f8f2;--orange:#d87b16;
  --orange-bg:#fff4e6;--red:#d94b58;--red-bg:#fff0f1;--purple:#7655d6;
  --purple-bg:#f3efff;--shadow:0 8px 30px rgba(26,39,77,.07);--side:238px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.layout{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:linear-gradient(180deg,var(--nav),#0d1526);color:#fff;z-index:20;display:flex;flex-direction:column}
.brand{height:72px;display:flex;align-items:center;gap:11px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6384ff,#315cec);display:grid;place-items:center;box-shadow:0 8px 20px rgba(49,92,236,.36)}
.brand-mark svg{width:20px;height:20px}
.brand-title{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand-sub{font-size:10px;color:#98a4bd;margin-top:3px}
.nav{padding:16px 10px;overflow:auto;flex:1}
.nav-group{font-size:10px;color:#66738f;padding:13px 12px 7px;letter-spacing:1px}
.nav-item{height:42px;display:flex;align-items:center;gap:11px;padding:0 12px;border-radius:8px;color:#aab4c8;margin:2px 0;transition:.18s}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-item.active{color:#fff;background:linear-gradient(90deg,#315cec,#3e68ef);box-shadow:0 6px 15px rgba(49,92,236,.24)}
.nav-item svg{width:17px;height:17px;flex:none}
.side-foot{padding:15px 18px;border-top:1px solid rgba(255,255,255,.08);color:#77849e;font-size:11px;line-height:1.7}
.topbar{position:fixed;left:var(--side);right:0;top:0;height:72px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:15;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.crumb{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px}
.crumb b{color:var(--text)}
.top-actions{display:flex;align-items:center;gap:12px}
.prototype-badge{font-size:12px;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:7px 10px;border-radius:20px}
.role-select{height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:0 34px 0 12px;outline:none}
.avatar{width:34px;height:34px;border-radius:50%;background:#172033;color:#fff;display:grid;place-items:center;font-size:12px}
.main{margin-left:var(--side);padding:96px 28px 48px;min-height:100vh}
.page{max-width:1500px;margin:0 auto}
.page-title{display:flex;justify-content:flex-start;align-items:flex-start;margin-bottom:20px;gap:18px}
.page-title h1{font-size:24px;margin:0 0 7px;letter-spacing:-.3px}
.page-title p{margin:0;color:var(--sub);font-size:13px;line-height:1.7}
.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.btn{height:36px;border-radius:7px;border:1px solid var(--line);background:#fff;color:#354056;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:13px;transition:.15s}
.btn:hover{border-color:#aebcf3;color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 5px 14px rgba(49,92,236,.2)}
.btn.primary:hover{background:var(--primary-2)}
.btn.danger{color:var(--red);border-color:#facbd0;background:#fff}
.btn.warn{color:#b9660c;border-color:#f3c78f;background:#fffaf3}
.btn.green{color:#087e59;border-color:#a8dec9;background:#f6fffb}
.btn:disabled{cursor:not-allowed;opacity:.45}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.link{color:var(--primary);border:0;background:none;padding:0;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;width:72px;height:72px;border-radius:50%;right:-22px;top:-22px;background:var(--primary-soft)}
.stat-label{color:var(--sub);font-size:12px;margin-bottom:10px}
.stat-value{font-size:27px;font-weight:750;letter-spacing:-.6px}
.stat-note{font-size:11px;color:var(--sub);margin-top:8px}
.stat-note.good{color:var(--green)}
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);margin-bottom:16px}
.card-head{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}
.card-head h3{margin:0;font-size:15px}
.card-body{padding:18px}
.filters{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.input,.select{height:34px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 10px;color:var(--text);outline:none;min-width:130px}
.fl{display:flex;align-items:center;gap:8px}.fl>span:first-child{font-size:12px;color:#505a70;white-space:nowrap}
.date-range{display:flex;align-items:center;gap:6px}.date-range i{font-style:normal;color:var(--sub);font-size:12px}.date-range .input{min-width:128px}
.filter-actions{margin-left:auto;display:flex;gap:8px}
.filters-more{display:none;width:100%;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;margin-top:2px;border-top:1px dashed var(--line)}.filters-more.open{display:flex}
.fbtn{height:34px;min-width:68px;padding:0 18px;border:0;border-radius:7px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;transition:.15s}
.fbtn.query{background:var(--primary)}.fbtn.query:hover{background:var(--primary-2)}
.fbtn.reset{background:#8f9ab0}.fbtn.reset:hover{background:#7d889f}
.fbtn.export{background:#fff;color:var(--text);border:1px solid var(--line)}.fbtn.export:hover{background:#f5f7fb;border-color:#c9d2e3}
.input:focus,.select:focus,textarea:focus{border-color:#91a5f6;box-shadow:0 0 0 3px rgba(49,92,236,.08)}
.search{min-width:230px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0;white-space:nowrap}
th{height:42px;background:#fafbfc;color:#68728a;font-size:12px;font-weight:600;text-align:left;padding:0 12px;border-bottom:1px solid var(--line)}
td{height:52px;padding:8px 12px;border-bottom:1px solid #edf0f5;font-size:13px;color:#354056}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fbfcff}
tbody tr.disabled-row td{background:#fcfcfd;color:#9aa2b2}
.table-wrap th:first-child,.table-wrap td:first-child{position:sticky;left:0;z-index:2;background:#fff}
.table-wrap th:last-child,.table-wrap td:last-child{position:sticky;right:0;z-index:2;background:#fff}
.table-wrap th:first-child,.table-wrap th:last-child{background:#fafbfc;z-index:3}
.table-wrap th:first-child::after,.table-wrap td:first-child::after{content:'';position:absolute;top:0;bottom:0;right:-8px;width:8px;background:linear-gradient(to right,rgba(31,45,80,.07),rgba(31,45,80,0));pointer-events:none}
.table-wrap th:last-child::after,.table-wrap td:last-child::after{content:'';position:absolute;top:0;bottom:0;left:-8px;width:8px;background:linear-gradient(to left,rgba(31,45,80,.07),rgba(31,45,80,0));pointer-events:none}
.table-wrap th:first-child,.table-wrap th:last-child{border-right:0}
.table-wrap tbody tr:hover td:first-child,.table-wrap tbody tr:hover td:last-child{background:#fbfcff}
.table-wrap tbody tr.disabled-row td:first-child,.table-wrap tbody tr.disabled-row td:last-child{background:#fcfcfd}
.help{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#e8ecf5;color:#68728a;font-size:12px;font-weight:700;cursor:help}
.help:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);right:-10px;width:280px;white-space:normal;padding:9px 12px;border-radius:8px;background:#1f2a44;color:#fff;font-size:12px;font-weight:400;line-height:1.6;z-index:30;box-shadow:0 8px 20px rgba(20,30,60,.25)}
.table-wrap table.has-check th:first-child,.table-wrap table.has-check td:first-child{width:44px;min-width:44px;max-width:44px}
.table-wrap table.has-check th:first-child::after,.table-wrap table.has-check td:first-child::after{display:none}
.table-wrap table.has-check th:nth-child(2),.table-wrap table.has-check td:nth-child(2){position:sticky;left:44px;z-index:2;background:#fff}
.table-wrap table.has-check th:nth-child(2){background:#fafbfc;z-index:3}
.table-wrap table.has-check th:nth-child(2)::after,.table-wrap table.has-check td:nth-child(2)::after{content:'';position:absolute;top:0;bottom:0;right:-8px;width:8px;background:linear-gradient(to right,rgba(31,45,80,.07),rgba(31,45,80,0));pointer-events:none}
.table-wrap table.has-check tbody tr:hover td:nth-child(2){background:#fbfcff}
.table-wrap table.has-check tbody tr.disabled-row td:nth-child(2){background:#fcfcfd}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);font-size:12px}
.pager-r{display:flex;align-items:center;gap:6px}
.pager-size{height:30px;min-width:96px;font-size:12px}
.pbtn{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#354056;font-size:12px;cursor:pointer}
.pbtn:hover:not(:disabled){border-color:#aebcf3;color:var(--primary)}
.pbtn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.pdots{padding:0 4px;color:#8a94a8}
.pjump{display:flex;align-items:center;gap:6px;margin-left:8px;color:#68728a}
.pinput{width:48px;min-width:48px;height:30px;text-align:center;padding:0 4px}
.page-foot{position:fixed;left:var(--side);right:0;bottom:0;z-index:14;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(27,39,73,.08)}
.page-foot-space{height:72px}
@media(max-width:760px){.page-foot{left:0}}
.num{font-variant-numeric:tabular-nums;font-weight:650;color:#202a41}
.muted{color:var(--sub);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;height:23px;border-radius:5px;padding:0 8px;font-size:11px;font-weight:650;background:#f0f2f6;color:#677087}
.tag.blue{background:var(--primary-soft);color:var(--primary)}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.orange{background:var(--orange-bg);color:var(--orange)}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.purple{background:var(--purple-bg);color:var(--purple)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.modal-note{margin:0 0 14px;color:#596682;font-size:13px;line-height:1.7}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 18px;background:#fff;border-radius:11px 11px 0 0}
.tab{height:48px;padding:0 16px;border:0;background:none;color:var(--sub);position:relative;font-weight:600}
.tab.active{color:var(--primary)}
.tab.active:after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--primary);border-radius:2px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.info-grid.slim{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.ap-bar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:12px 18px;background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:16px}
.ap-bar.rej{border-color:#f5c2c2;background:#fffafa}
.ap-steps{display:flex;align-items:center;flex:1;min-width:360px}
.ap-step{display:flex;align-items:center;gap:8px;white-space:nowrap}
.ap-dot{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#eef0f4;color:#98a1b5;flex:none}
.ap-step.done .ap-dot{background:#e9f7ef;color:#1a7f4b}.ap-step.cur .ap-dot{background:var(--primary);color:#fff}.ap-step.rej .ap-dot{background:#fdecec;color:#b42318}
.ap-txt{display:flex;flex-direction:column;line-height:1.35;font-size:12px;color:#98a1b5}.ap-txt b{font-size:13px;color:var(--text);font-weight:600}
.ap-step.wait .ap-txt b{color:#98a1b5}.ap-step.cur .ap-txt em,.ap-step.rej .ap-txt em{font-style:normal}.ap-step.cur .ap-txt em{color:var(--primary)}.ap-step.rej .ap-txt em{color:#b42318}.ap-step.done .ap-txt em{font-style:normal;color:#1a7f4b}
.ap-line{flex:1;min-width:24px;height:2px;background:#e3e6ed;margin:0 12px}.ap-line.done{background:#9ad5b3}
.ap-rej{flex-basis:100%;font-size:13px;line-height:1.7;color:#b42318;padding-top:8px;border-top:1px dashed #f5c2c2}
.info-item{padding:13px 18px;border-bottom:1px solid #eef1f5}
.info-item .k{font-size:11px;color:var(--sub);margin-bottom:7px}
.info-item .v{font-size:13px;color:#2c364d;min-height:18px}
.money-box{background:linear-gradient(135deg,#263e92,#315cec);color:#fff;border-radius:11px;padding:22px;box-shadow:0 12px 26px rgba(49,92,236,.22)}
.money-box .label{font-size:12px;opacity:.72}
.money-box .amount{font-size:29px;font-weight:750;margin:8px 0 18px}
.money-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid rgba(255,255,255,.18);padding-top:14px}
.money-row b{display:block;margin-top:5px}
.timeline{padding:4px 0 2px}
.time-item{position:relative;padding:0 0 22px 27px;color:#3a445a}
.time-item:before{content:"";position:absolute;left:5px;top:4px;width:8px;height:8px;border-radius:50%;background:#b8c1d6;border:3px solid #fff;box-shadow:0 0 0 1px #c8cede}
.time-item:after{content:"";position:absolute;left:9px;top:17px;bottom:0;width:1px;background:#dfe3eb}
.time-item:last-child:after{display:none}
.time-item.done:before{background:var(--green);box-shadow:0 0 0 1px var(--green)}
.time-item.current:before{background:var(--primary);box-shadow:0 0 0 3px #dce4ff}
.time-item b{font-size:13px}
.time-item p{margin:5px 0 0;color:var(--sub);font-size:11px;line-height:1.6}
.steps{display:flex;align-items:center;margin:10px 0 20px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.step{display:flex;align-items:center;gap:9px;color:var(--sub);font-size:12px;flex:1}
.step:after{content:"";height:1px;background:#dfe3eb;flex:1;margin:0 12px}
.step:last-child{flex:0 0 auto}.step:last-child:after{display:none}
.step i{font-style:normal;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#edf0f5;color:#7e879b;font-weight:700}
.step.done i{background:var(--green-bg);color:var(--green)}
.step.current{color:var(--primary);font-weight:700}.step.current i{background:var(--primary);color:#fff}
.check{width:15px;height:15px;accent-color:var(--primary)}
.selectbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;background:#eef3ff;border:1px solid #dbe4ff;border-radius:8px;margin-bottom:12px;color:#495c8b;font-size:12px}
.empty{padding:60px 20px;text-align:center;color:var(--sub)}
.empty svg{width:54px;height:54px;color:#c6ccda;margin-bottom:12px}
.bar-list{display:flex;flex-direction:column;gap:16px}
.bar-row{display:grid;grid-template-columns:80px 1fr 68px;gap:12px;align-items:center;font-size:12px}
.bar{height:7px;background:#eef1f6;border-radius:6px;overflow:hidden}.bar span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#315cec,#7a94f5)}
.process{display:flex;align-items:center;gap:8px;overflow:auto;padding:4px 0 8px}
.process-node{min-width:125px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.process-node.active{border-color:#7e96f2;background:#f6f8ff}.process-node.done{border-color:#b9e2d3;background:#f6fffb}
.process-node b{font-size:12px}.process-node span{display:block;color:var(--sub);font-size:10px;margin-top:5px}
.arrow{color:#aab2c2}
.lock{display:flex;align-items:center;gap:8px;color:#a46418;font-size:12px}
.modal-mask{position:fixed;inset:0;background:rgba(15,24,43,.46);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal{background:#fff;width:min(520px,100%);border-radius:13px;box-shadow:0 24px 70px rgba(0,0,0,.2);animation:pop .17s}
.modal-head{height:58px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px}.modal-close{border:0;background:none;font-size:22px;color:#7d8698}
.modal-body{padding:20px}.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.form-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 24px}.stack{display:grid;gap:16px}.sel-wrap{position:relative}.sel-list{position:absolute;z-index:30;top:38px;left:0;right:0;max-height:260px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(20,30,60,.12)}.sel-opt{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer}.sel-opt:hover{background:#f3f6ff}.sel-opt.disabled{opacity:.5;cursor:not-allowed}.sel-empty{padding:14px;text-align:center;color:var(--sub);font-size:12px}.input:disabled{background:#f6f7f9;color:#4a5468}
.field{margin-bottom:16px}.field label{display:block;font-size:12px;color:#505a70;margin-bottom:7px;font-weight:600}
.field label em{color:var(--red);font-style:normal}.field .input,.field .select,.field textarea{width:100%}
.field textarea{min-height:88px;resize:vertical;border:1px solid var(--line);border-radius:7px;padding:10px;outline:none}
.toast-wrap{position:fixed;right:24px;top:84px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{min-width:280px;max-width:390px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 12px 32px rgba(27,39,73,.16);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;animation:slide .25s}
.toast-icon{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--green-bg);color:var(--green);font-weight:800}.toast.error .toast-icon{background:var(--red-bg);color:var(--red)}
.toast b{font-size:12px}.toast p{margin:3px 0 0;color:var(--sub);font-size:11px}
.forbidden{display:grid;place-items:center;min-height:430px;background:#fff;border:1px solid var(--line);border-radius:11px;text-align:center}
.forbidden svg{width:60px;height:60px;color:#bbc2d1}.forbidden h2{font-size:18px;margin:13px 0 7px}.forbidden p{color:var(--sub);font-size:12px}
.mobile-toggle{display:none;border:0;background:none;color:#fff}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}@keyframes slide{from{transform:translateX(20px);opacity:0}}
@media(max-width:1050px){.form-3{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.grid-2,.split{grid-template-columns:1fr}.info-grid{grid-template-columns:repeat(2,1fr)}}
.cf-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cf-month{display:flex;align-items:center;gap:6px}.cf-month .select{min-width:150px;font-weight:700}

function confirmPay(id){
  const b=state.bills.find(x=>x.id===id),no=document.getElementById('editPay').value;
  if(!no){toast('请选择付款合同号','请先从该销售合同下选择付款合同号','error');return}

  toast('付款合同号已确认',no+' 已占用额度 '+money(b.amount)+'，剩余可付款 '+money(c.total-usedAmt-b.amount));render();

function submitApp(type,reason='',okNoExec=false){
  const list=state.bills.filter(b=>state.selectedCart.has(b.id)&&state.cart.has(b.id));
  if(!list.length){toast('无法提交','请先在待结算清单勾选账单','error');return}
  const miss=list.filter(b=>!payOk(b));
  if(miss.length){toast('提交前校验未通过','付款合同号未确认：'+miss.map(b=>b.id).join('、')+'（仅助教、出题费豁免付款合同），请处理后再提交','error');return}
  const noEx=list.filter(b=>!b.exec);
  if(noEx.length&&!okNoExec){
    modal('有账单未关联执行单','<div class="notice-bar" style="margin-bottom:12px">以下 <b>'+noEx.length+'</b> 张账单尚未关联执行单。<b>不影响本次申请和后续付款</b>，但最终必须关联执行单；提交后在合同系统 / 钉钉的审批单中会标注「未关联执行单」。</div><div class="table-wrap"><table><thead><tr><th>课酬账单号</th><th>师资</th><th>项目</th><th style="text-align:right">金额</th></tr></thead><tbody>'+noEx.map(b=>'<tr><td>'+b.id+'</td><td>'+b.name+'</td><td>'+b.project+'</td><td class="num">'+money(b.amount)+'</td></tr>').join('')+'</tbody></table></div>','仍然提交',()=>{closeModal();submitApp(type,reason,true)});
    return;
  }
  const id='JS202611-'+String(state.applications.length+9).padStart(4,'0');
  state.applications.unshift({id,version:1,type,status:'审批中',node:0,owner:'纪超',created:'2026-11-03 19:20',reason,rejectReason:'',history:[]});
  list.forEach(b=>{b.appId=id;b.status='审批中';state.cart.delete(b.id);state.selectedCart.delete(b.id)});
  toast('提交成功',id+' 共 '+list.length+' 张账单，已同步至合同系统审批流'+(noEx.length?'（其中 '+noEx.length+' 张未关联执行单，已在审批单中标注）':''));go('/applications/detail?id='+id);
}

function approvalBar(a,canEdit){

function opsStatus(x){

function opsFuzzy(name,q){
  if(!q) return true; name=name.toLowerCase(); q=q.toLowerCase();
  let i=0; for(const c of name){ if(c===q[i]) i++; if(i===q.length) return true }
  return name.includes(q);
}
function opsOptions(q){

  if(!rows.length) return '<div class="sel-empty">讲师运营系统中未找到匹配的讲师</div>';

}

  const bar=can&&sel.length?'<div class="selectbar sticky"><span>'+(c.all?'已选择符合条件的<b> 全部 '+sel.length+' </b>笔待确认':'已选择 <b>'+sel.length+'</b> 笔')+'，合计 <b>'+money(cfSum(sel))+'</b>'+(sel.some(cfIsProxy)?'，其中代收 <b style="color:var(--orange)">'+sel.filter(cfIsProxy).length+'</b> 笔':'')+more+'</span><span class="actions"><button class="btn sm" onclick="cfClearSel(true)">取消选择</button><button class="btn sm danger" onclick="cfBatchFail()">批量确认付款失败</button><button class="btn sm green" onclick="cfBatchOk()">批量确认成功</button></span></div>':'';
  const th=(can?'<th style="width:40px"><input type="checkbox" class="check" '+(pageAllSel?'checked':'')+(pagePend.length?'':' disabled')+' onchange="cfTogglePage(this.checked)" title="选择本页待确认"></th>':'')+'<th>提现单号</th>'+cols.map(x=>'<th>'+x[1]+'</th>').join('')+extra.map(x=>'<th>'+x+'</th>').join('')+'<th>操作</th>';
  const body=pageRows.map(w=>{const g=cfGroup(w);return '<tr'+(state.selectedConfirms.has(w.id)||(c.all&&g==='pending')?' class="cf-sel"':'')+'>'+(can?'<td>'+(g==='pending'?'<input type="checkbox" class="check" '+(c.all||state.selectedConfirms.has(w.id)?'checked':'')+' onchange="cfToggle(\''+w.id+'\',this.checked)">':'')+'</td>':'')+'<td><button class="link" onclick="cfOpen(\''+w.id+'\')"><b>'+w.id+'</b></button></td>'+cols.map(x=>'<td>'+cell(x[0],w)+'</td>').join('')+exCell(w)+'<td style="white-space:nowrap">'+(can&&g==='pending'?'<button class="link" onclick="confirmOne(\''+w.id+'\')">确认成功</button> <button class="link" style="color:var(--red)" onclick="openRefund(\''+w.id+'\')">确认付款失败</button> ':'')+'<button class="link" onclick="cfOpen(\''+w.id+'\')">详情</button></td></tr>'}).join('');
  const hint=!can?'<div class="cf-banner info"><span>当前为<b>财务只读视图</b>：可查看付款确认进度和明细，确认操作由月度账单经办人执行。</span></div>':'';
  const curB=bks.find(x=>x.key===c.batch)||null;
  return '<div class="cf-shell">'+hint+cfBanner(mrows)+'<div class="cf-layout'+(c.sideMini?' mini':'')+'">'+cfSide(mrows,months)+'<div class="cf-main">'+cfHead(curB,mrows)+cfFilterBar(c,fi,sel2,mrows)+bar+
  '<section class="card"><div class="tabs">'+CF_TABS.map(t=>'<button class="tab '+(c.tab===t[0]?'active':'')+'" onclick="cfSetTab(\''+t[0]+'\')">'+t[1]+' <span class="cf-n'+(t[0]==='pending'&&cnt('pending')?' warn':'')+'">'+cnt(t[0])+'</span></button>').join('')+'<span class="cf-tools"><button class="btn sm" onclick="cfExport()">导出</button><button class="btn sm" onclick="cfToggleFocus()" title="隐藏导航，仅保留筛选和表格（Esc 退出）">'+(c.focus?'退出全屏':'全屏')+'</button></span></div>'+
  (rows.length?'<div class="table-wrap cf-wrap"><table class="'+(can?'has-check':'')+'"><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table></div>'+pager('confirm',rows.length):'<div class="empty">'+icon('empty')+'<div>'+(c.tab==='pending'?'当前筛选下没有待确认的提现单':'当前筛选下没有数据')+'</div></div>')+'</section></div></div></div>';
}

/* ---- 确认 / 失败 操作 ---- */
function cfResult(head,html){
  modal(head,html,'知道了',()=>{closeModal();render()});
  const cb=document.querySelector('#modalRoot .modal-foot .btn:not(#modalOk)');if(cb)cb.style.display='none';
}
function cfDist(list){
  const m={};list.forEach(w=>{(m[w.method]=m[w.method]||{n:0,s:0});m[w.method].n++;m[w.method].s+=w.amount});
  return Object.entries(m).map(([k,v])=>'<tr><td>'+k+'</td><td class="num">'+v.n+' 笔</td><td class="num">'+money(v.s)+'</td></tr>').join('');
}
function cfSummary(list){
  const px=list.filter(cfIsProxy),em=list.filter(w=>w.kind==='紧急');
  return '<div class="cf-sumbox"><div><span>笔数</span><b>'+list.length+' 笔</b></div><div><span>金额合计</span><b>'+money(cfSum(list))+'</b></div><div><span>涉及讲师 / 助教</span><b>'+new Set(list.map(w=>w.name)).size+' 位</b></div></div><table class="cf-mini"><thead><tr><th>付款方式</th><th>笔数</th><th>金额</th></tr></thead><tbody>'+cfDist(list)+'</tbody></table>'+(px.length?'<div class="cf-warn">其中 <b>代收 '+px.length+' 笔</b>（收款人与讲师 / 助教不一致，共 '+money(cfSum(px))+'），请确认已核对。</div>':'')+(em.length?'<div class="cf-tip">包含紧急提现 '+em.length+' 笔</div>':'');
}
function cfDoConfirm(list,ctx){
  let ok=[],skip=[];
  list.forEach(w=>{if(cfGroup(w)!=='pending'){skip.push(w);return}w.status='已到账';w.confirmAt=CF_NOW;ok.push(w)});
  cfClearSel();closeModal();
  const names=new Set(ok.map(w=>w.name)).size;
  render();
  cfResult('确认完成','<div class="cf-sumbox"><div><span>确认成功</span><b style="color:var(--green)">'+ok.length+' 笔</b></div><div><span>成功金额</span><b>'+money(cfSum(ok))+'</b></div><div><span>跳过</span><b>'+skip.length+' 笔</b></div></div><p class="modal-note" style="margin:0">'+ctx+'已将 <b>'+ok.length+'</b> 笔冻结金额转入“已到账”，并已通知 <b>'+names+'</b> 位讲师 / 助教。'+(skip.length?'<br>跳过原因：这 '+skip.length+' 笔在确认前已被其他人处理（状态已变更）。':'')+'</p>');
}
function cfBatchOk(){
  const list=cfSel();if(!list.length)return;
  modal('批量确认付款成功','<p class="modal-note">请确认以下提现单已<b>实际付款成功</b>（已核对银行回单 / 云账户回执）。</p>'+cfSummary(list)+cfEakWarn(list)+'<div class="cf-warn" style="background:#fff4f4;border-color:#f5c2c2;color:#b42318"><b>不可撤销：</b>确认后款项转为“已到账”并推送讲师 / 助教，已确认的记录不可再修改。</div><label class="cf-check"><input type="checkbox" class="check" id="cfAck"> 我已核对付款结果，确认这 '+list.length+' 笔均已付款成功</label>','确认成功 '+list.length+' 笔',()=>{
    if(!document.getElementById('cfAck').checked){toast('请先勾选确认','需确认已核对付款结果','error');return}
    cfDoConfirm(list,'');
  });
}
function cfBatchAll(key){
  const mrows=state.withdrawals.filter(w=>cfMonthOf(w)===state.cf.month&&cfBatchKey(w)===key);
  const list=mrows.filter(w=>cfGroup(w)==='pending'),fail=mrows.filter(w=>cfGroup(w)==='failed'),pause=mrows.filter(w=>cfGroup(w)==='paused'),done=mrows.filter(w=>cfGroup(w)==='done');
  if(!list.length)return;
  const b=cfBatches(mrows)[0];
  modal('整单确认 · '+b.title,'<p class="modal-note">将本批次下所有<b>待确认</b>的提现单一次性确认为付款成功。</p>'+cfSummary(list)+cfEakWarn(list)+'<div class="cf-tip">已自动排除：已到账 '+done.length+' 笔、付款失败 '+fail.length+' 笔、暂不付款 '+pause.length+' 笔（不会被整单确认覆盖）。</div><div class="cf-warn" style="background:#fff4f4;border-color:#f5c2c2;color:#b42318"><b>不可撤销：</b>确认后款项转为“已到账”并推送讲师 / 助教。若其中个别笔实际未付成功，请先“取消”并对该笔单独确认付款失败。</div><label class="cf-check"><input type="checkbox" class="check" id="cfAck"> 我已核对本批次付款结果，确认以上 '+list.length+' 笔均已付款成功</label>','整单确认 '+list.length+' 笔',()=>{
    if(!document.getElementById('cfAck').checked){toast('请先勾选确认','需确认已核对付款结果','error');return}
    cfDoConfirm(list,'【'+b.title+'】整单确认：');
  });
}
function cfBatchFail(){
  const list=cfSel();if(!list.length)return;
  modal('批量确认付款失败','<p class="modal-note">这 <b>'+list.length+'</b> 笔将使用<b>同一失败原因</b>发起付款失败审批（合同系统 / 钉钉，两级）。本系统仅同步审批结果，通过后金额退回讲师提现余额；个别原因不同的请取消后逐笔处理。</p>'+cfSummary(list)+''+cfFailField('cfFailReason')+'<div class="field"><label>内部备注（讲师不可见）</label><textarea id="cfFailNote" placeholder="可记录银行返回信息、沟通过程等"></textarea></div>','提交付款失败审批（'+list.length+' 笔）',()=>{
    const r=document.getElementById('cfFailReason').value.trim(),n=document.getElementById('cfFailNote').value.trim();
    if(!r){toast('无法提交','请填写或选择失败原因','error');return}
    list.forEach(w=>{if(cfGroup(w)==='pending'){w.status='失败待审批';w.failReason=r;w.internal=n;w.failAt=CF_NOW}});
    cfClearSel();closeModal();render();
    cfResult('已提交付款失败审批','<div class="cf-sumbox"><div><span>已提交</span><b>'+list.length+' 笔</b></div><div><span>金额合计</span><b>'+money(cfSum(list))+'</b></div><div><span>失败原因</span><b>'+r+'</b></div></div><p class="modal-note" style="margin:0">已提交合同系统 / 钉钉两级审批，本系统同步结果；讲师 / 助教仅会看到失败原因“'+r+'”，内部备注不会展示。审批进度可在「付款失败」页签或「付款失败审批」页查看。</p>');
  },'danger');
}
function cfEakWarn(list){
  const ps=[...new Set(list.map(w=>w.payment))].map(id=>state.monthly.find(x=>x.id===id)).filter(x=>x&&!x.locked);
  if(!ps.length)return '';
  const n=list.filter(w=>ps.some(x=>x.id===w.payment)).length;
  return '<div class="cf-warn">提示：其中 <b>'+n+' 笔</b>所属付款单（'+ps.map(x=>x.id).join('、')+'）<b>尚未提交易快报</b>。不影响确认，请核实已按流程线下提交。</div>';
}
function confirmOne(id){
  const w=state.withdrawals.find(x=>x.id===id);if(!w||cfGroup(w)!=='pending')return;
  const kv=(k,v)=>'<div class="info-item"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
  modal('确认付款成功','<p class="modal-note">请确认该笔提现单已<b>实际付款成功</b>（已核对银行回单 / 云账户回执）。</p><div class="info-grid" style="grid-template-columns:repeat(2,1fr)">'+kv('提现单号',w.id)+kv('讲师 / 助教',w.name)+kv('收款人',payeeCell(w))+kv('付款方式',w.method)+kv('金额','<span class="num">'+money(w.amount)+'</span>')+kv('收款账号',cfTail(w))+'</div>'+cfEakWarn([w])+(cfIsProxy(w)?'<div class="cf-warn">该笔为<b>代收</b>：收款人（'+w.payee+'）与讲师（'+w.name+'）不一致，请再次核对回单上的收款人。</div>':'')+'<div class="cf-warn" style="background:#fff4f4;border-color:#f5c2c2;color:#b42318"><b>不可撤销：</b>确认后款项转为“已到账”并通知讲师 / 助教，已确认的记录不可再修改。</div>','确认成功',()=>{
    closeModal();
    if(cfGroup(w)!=='pending'){toast('该笔已被处理',id+' 当前状态为 '+w.status,'error');cfRender();return}
    w.status='已到账';w.confirmAt=CF_NOW;state.selectedConfirms.delete(id);toast('已确认付款成功',id+' 已转为已到账，并通知 '+w.name);cfRender();
  });
}

/* ---- 常用筛选 / 列设置 / 批量单号 / 导出 ---- */
function cfSaveCur(){
  cfRead();
  modal('保存当前筛选','<p class="modal-note">保存后可在“常用筛选”中一键应用（含当前状态页签与筛选条件）。</p><div class="field"><label><em>*</em> 名称</label><input class="input" id="cfSaveName" placeholder="例如：云账户代收待确认"></div>','保存',()=>{
    const n=document.getElementById('cfSaveName').value.trim();if(!n){toast('请输入名称','名称不能为空','error');return}
    const c=state.cf,f={};Object.keys(CF_FIELDS).forEach(k=>{if(k!=='batch'&&k!=='multi')f[k]=c[k]});f.tab=c.tab;
    state.cf.saved.push({name:n,f});closeModal();toast('已保存常用筛选',n);render();
  });
}
function cfApplySaved(i){Object.assign(state.cf,CF_FIELDS,{multi:[]},state.cf.saved[i].f);cfClearSel();cfPage1();render()}
function cfDelSaved(i){state.cf.saved.splice(i,1);render()}
function cfCols(){
  modal('列设置','<p class="modal-note">选择表格中展示的列（提现单号和操作列固定展示）。</p><div class="cf-cols">'+CF_COLS.map(x=>'<label><input type="checkbox" class="check" value="'+x[0]+'" '+(state.cf.cols.includes(x[0])?'checked':'')+'> '+x[1]+'</label>').join('')+'</div>','应用',()=>{
    state.cf.cols=[...document.querySelectorAll('.cf-cols input:checked')].map(i=>i.value);closeModal();render();
  });
}
function cfMultiModal(){
  modal('批量粘贴单号查询','<p class="modal-note">粘贴财务回单中的提现单号，支持换行、空格、逗号分隔，最多 500 个。</p><textarea id="cfMultiTxt" style="width:100%;min-height:150px;border:1px solid var(--line);border-radius:7px;padding:10px" placeholder="TX202610-0218&#10;TX202610-0224&#10;…">'+state.cf.multi.join('\n')+'</textarea>','查询',()=>{
    const ids=[...new Set(document.getElementById('cfMultiTxt').value.split(/[\s,，;；]+/).map(s=>s.trim()).filter(Boolean))].slice(0,500);
    const c=state.cf,all=new Set(state.withdrawals.filter(w=>cfMonthOf(w)===c.month).map(w=>w.id)),hit=ids.filter(i=>all.has(i));
    c.multi=ids;cfClearSel();cfPage1();closeModal();render();
    if(ids.length)toast('批量查询完成','共 '+ids.length+' 个单号，匹配 '+hit.length+' 个'+(ids.length-hit.length?'，'+(ids.length-hit.length)+' 个未在本月找到':''),ids.length-hit.length?'error':'');
  });
}
function cfExport(){
  const rows=cfCurrent(),head=['提现单号','类型','讲师/助教','角色','讲师类型','手机号','收款人','是否代收','合同号','付款方式','金额','付款单号','收款账号','提交时间','状态'];
  const csv=[head].concat(rows.map(w=>[w.id,w.kind,w.name,teacherInfo(w).role,teacherInfo(w).type,teacherInfo(w).phone,w.payee||w.name,cfIsProxy(w)?'是':'否',wPacts(w).join('、'),w.method,w.amount,w.payment,w.bank,w.date,w.deferred?'暂不付款':w.status])).map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='付款确认明细_'+state.cf.month+'.csv';document.body.appendChild(a);a.click();a.remove();

/* ---- 详情抽屉 ---- */
function cfOpen(id){
  const w=state.withdrawals.find(x=>x.id===id),g=cfGroup(w),can=cfCan(),p=state.monthly.find(x=>x.id===w.payment);
  const kv=(k,v)=>'<div class="info-item"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
  const log=[[w.date,'提交提现申请','讲师 / 助教 '+w.name]];
  log.push([w.kind==='紧急'?w.date:cfMonthOf(w)+'-11 00:00','纳入'+(w.kind==='紧急'?'紧急':'月度')+'付款单 '+w.payment,'系统']);
  if(p&&p.eak&&p.eak!=='—')log.push(['—','付款单已提交易快报 '+p.eak,'经办人']);
  if(g==='done')log.push([w.confirmAt||'—','确认付款成功，金额转入已到账',CF_OPERATOR]);
  if(g==='failed')log.push([w.failAt||'—','提交付款失败（'+(w.failReason||'—')+'），提交合同系统 / 钉钉审批',CF_OPERATOR]);
  if(w.status==='付款失败')log.push(['—','付款失败审批通过，金额退回讲师可提现余额','财务']);
  if(g==='paused')log.push([w.pauseAt||'—','暂不付款（'+(w.pauseReason||'—')+'），款项退回讲师提现余额',CF_OPERATOR]);
  const alloc=allocTable(w,'cf-mini');
  document.getElementById('modalRoot').innerHTML='<div class="cf-mask" onclick="if(event.target===this)closeModal()"><aside class="cf-drawer"><div class="cf-dh"><div><h3>'+w.id+'</h3><div style="margin-top:6px">'+cfStatusTag(w)+' '+tag(w.kind,w.kind==='紧急'?'orange':'blue')+'</div></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="cf-db">'+
    '<h4>基本信息</h4><div class="info-grid">'+kv('讲师 / 助教',w.name)+kv('角色',teacherInfo(w).role)+kv('讲师类型',teacherInfo(w).type)+kv('手机号',teacherInfo(w).phone)+kv('提现金额','<span class="num">'+money(w.amount)+'</span>')+kv('所属项目',wProjects(w).join('、'))+kv('合同号',wPacts(w).join('、'))+kv('提交时间',w.date)+'</div>'+
    '<h4>收款信息</h4><div class="info-grid">'+kv('收款人',payeeCell(w))+kv('付款方式',w.method)+kv('收款账号',w.bank)+kv('付款单号',w.payment+(p&&p.eak&&p.eak!=='—'?'<br><span class="muted">易快报 '+p.eak+'</span>':''))+'</div>'+(cfIsProxy(w)?'<div class="cf-warn">收款人（'+w.payee+'）与讲师 / 助教（'+w.name+'）不一致，请核对代收授权后再确认。</div>':'')+
    (g==='failed'?'<h4>付款失败信息</h4><div class="info-grid">'+kv('失败原因',w.failReason||'—')+kv('审批状态',w.status==='付款失败'?'审批通过':'合同系统 / 钉钉审批中')+kv('内部备注',w.internal||'—')+'</div>':'')+
    (g==='paused'?'<h4>暂不付款信息</h4><div class="info-grid">'+kv('原因',w.pauseReason||'—')+kv('处理结果','款项已退回讲师提现余额，下月提现窗口可重新申请')+'</div>':'')+
    '<h4>提现单构成</h4>'+alloc+
    '<h4>操作日志</h4><div class="cf-log">'+log.map(l=>'<div><i></i><b>'+l[1]+'</b><span>'+l[0]+' · '+l[2]+'</span></div>').join('')+'</div>'+
    '</div>'+(can&&g==='pending'?'<div class="cf-df"><button class="btn danger" onclick="closeModal();openRefund(\''+w.id+'\')">确认付款失败</button><button class="btn primary" onclick="closeModal();confirmOne(\''+w.id+'\')">确认付款成功</button></div>':'')+'</aside></div>';
}
function cfFailField(id){
  return '<div class="field"><label><em>*</em> 失败原因（讲师可见）</label><input class="input" id="'+id+'" maxlength="50" placeholder="可点击下方标准原因快速填入，也可手动输入或修改"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+CF_REASONS.map(r=>'<button type="button" class="ib-chip" onclick="var i=document.getElementById(\''+id+'\');i.value=\''+r+'\';i.focus()">'+r+'</button>').join('')+'</div></div>';
}
function openRefund(id){
  modal('确认付款失败','<p class="modal-note">仅在确定不再支付时确认。需逐笔发起付款失败审批（合同系统 / 钉钉，两级），本系统同步结果，通过后金额退回讲师提现余额。</p>'+cfFailField('failReason')+'<div class="field"><label>内部备注（讲师不可见）</label><textarea id="internalNote" placeholder="可记录银行返回信息、沟通过程等"></textarea></div>','提交付款失败审批',()=>{
    const r=document.getElementById('failReason').value.trim(),n=document.getElementById('internalNote').value.trim();if(!r){toast('无法提交','请填写或选择失败原因','error');return}
    const w=state.withdrawals.find(x=>x.id===id);w.status='失败待审批';w.failReason=r;w.internal=n;w.failAt='2026-11-18 16:30';state.selectedConfirms.delete(id);closeModal();toast('付款失败已提交合同系统 / 钉钉审批','讲师仅会看到失败原因“'+r+'”，内部备注不会展示');cfRender();
  },'danger');
}

function refunds(){
  const rows=state.withdrawals.filter(w=>w.status==='失败待审批');
  return title('付款失败审批（同步）','付款失败审批在合同系统 / 钉钉中进行（部门负责人 → VP → 财务两级），本系统只同步审批结果：通过后冻结金额退回讲师提现余额；驳回则恢复原提现中状态。','')+
  '<section class="card"><div class="card-body muted" style="line-height:1.9;border-bottom:1px solid var(--line)">本页为只读同步页。经办人在付款确认页提交付款失败后，系统同步生成审批；审批在合同系统 / 钉钉完成，结果回传后自动更新提现单状态。<br>退回后：常规提现须等下一个提现窗口（每月 1~10 日）再提，紧急提现可随时再提。</div>'+(rows.length?'<div class="table-wrap"><table><thead><tr><th>提现单号</th><th>类型</th><th>讲师</th><th>收款人</th><th>合同号</th><th>金额</th><th>失败原因</th><th>内部备注</th><th>审批状态</th><th>操作</th></tr></thead><tbody>'+slicePg('refunds',rows).map(w=>'<tr><td><b>'+w.id+'</b></td><td>'+tag(w.kind,w.kind==='紧急'?'orange':'blue')+'</td><td>'+w.name+'</td><td>'+payeeCell(w)+'</td><td>'+wPactCell(w)+'</td><td class="num">'+money(w.amount)+'</td><td>'+w.failReason+'</td><td style="max-width:260px;white-space:normal">'+(w.internal||'—')+'</td><td>'+tag('合同系统 / 钉钉审批中','orange')+'</td><td><button class="link" onclick="refundDecision(\''+w.id+'\',true)">模拟同步：通过</button> <button class="link" style="color:var(--red)" onclick="refundDecision(\''+w.id+'\',false)">模拟同步：驳回</button></td></tr>').join('')+'</tbody></table></div>'+pager('refunds',rows.length)+'':'<div class="empty">'+icon('empty')+'<div>暂无审批中的付款失败</div></div>')+'</section>';
}
function refundDecision(id,ok){
  const w=state.withdrawals.find(x=>x.id===id);w.status=ok?'付款失败':(w.kind==='紧急'?'提现中':'已导出');
  toast(ok?'已同步：审批通过':'已同步：审批驳回',ok?'冻结金额已退回可提现余额（常规款下一个提现窗口可再提，紧急款可随时再提），并向讲师展示失败原因':'提现单保持提现中，由经办人继续处理');render();
}

function settings(){
  return title('系统配置','账期、窗口、出款日与审批角色配置。修改仅影响后续新数据。','<button class="btn primary" onclick="toast(\'配置已保存\',\'新配置将应用于后续新建账单\')">保存配置</button>')+
  '<div class="stack"><section class="card"><div class="card-head"><h3>账期与提现</h3></div><div class="card-body"><div class="form-3"><div class="field"><label>讲师默认账期（天）</label><input class="input" type="number" min="0" value="'+state.cfg.teacher+'" onchange="state.cfg.teacher=Number(this.value)||0"><div class="muted" style="margin-top:5px">最后执行日 + N 天，到期即显示可提现；可在讲师账户中配置特殊账期</div></div><div class="field"><label>助教默认账期（天）</label><input class="input" type="number" min="0" value="'+state.cfg.assistant+'" onchange="state.cfg.assistant=Number(this.value)||0"><div class="muted" style="margin-top:5px">口径同上；账期优先级：紧急 &gt; 讲师特殊 &gt; 角色默认</div></div><div class="field"><label>正常提现窗口（财务可自行配置）</label><div style="display:flex;gap:8px"><input class="input" value="每月 1 日"><span style="line-height:34px">至</span><input class="input" value="每月 10 日"></div></div><div class="field"><label>讲师端到账提示</label><input class="input" value="当月月底前到账"></div></div></div></section>'+
  '<section class="card"><div class="card-head"><h3>月度付款</h3></div><div class="card-body"><div class="form-3"><div class="field"><label>月度付款单生成日</label><input class="input" value="每月 11 日"></div><div class="field"><label>月度账单经办人</label><select class="select"><option>张佳（月度账单经办人）</option></select></div><div class="field"><label>生成方式</label><div class="muted">自动按云账户、开发票、劳务费分别生成三张，不包含紧急提现单。</div></div><div class="field"><label>预计付款日</label><input class="input" value="当月月底前到账（对外不承诺 21 号）" disabled></div><div class="field"><label>未确认提醒（月底前 N 天）</label><input class="input" type="number" min="1" max="15" value="'+state.cf.remind+'" onchange="state.cf.remind=Number(this.value)||5"><div class="muted" style="margin-top:5px">月底前 N 天起，若月度付款单或紧急提现仍有未确认提现单，在付款确认页顶部提醒经办人；超过月底则红色告警</div></div></div></div></section></div>'+
  '<section class="card"><div class="card-head"><h3>审批链路</h3></div><div class="table-wrap"><table><thead><tr><th>业务通道</th><th>审批位置</th><th>审批节点</th><th>说明</th></tr></thead><tbody><tr><td>'+tag('常规账期','blue')+'</td><td>合同系统</td><td>部门负责人 → VP → 财务（两级）</td><td>整单审批，合同系统 / 钉钉均可，本系统仅同步结果</td></tr><tr><td>'+tag('紧急账期','orange')+'</td><td>合同系统</td><td>部门负责人 → VP → 财务（两级）</td><td>与常规同一条链，驳回后重新提交</td></tr><tr><td>'+tag('付款失败','red')+'</td><td>合同系统 / 钉钉</td><td>部门负责人 → VP → 财务（两级）</td><td>经办人在本系统提交失败结果，审批在合同系统 / 钉钉，本系统仅同步；内部备注不对讲师展示</td></tr></tbody></table></div></section>'+
  '<section class="card"><div class="card-head"><h3>数据与账户规则</h3></div><div class="card-body"><div class="info-grid"><div class="info-item"><div class="k">手机号约束</div><div class="v">与讲师 / 助教账户严格一对一</div></div><div class="info-item"><div class="k">首次入账</div><div class="v">发送小程序登录邀请</div></div></div></div></section>'+
  '<section class="card"><div class="card-head"><h3>课酬账单字典与付款合同规则</h3></div><div class="card-body"><div class="info-grid"><div class="info-item"><div class="k">费用类别</div><div class="v">'+CATS.join('、')+'</div></div><div class="info-item"><div class="k">计量单位</div><div class="v">'+UNITS.join('、')+'</div></div><div class="info-item"><div class="k">付款合同豁免</div><div class="v">仅助教、出题费；其余缺付款合同号不可提交 '+tag('豁免清单待财务确认','orange')+'</div></div><div class="info-item"><div class="k">付款合同号关联</div><div class="v">归属销售合同，项目经理在课酬账单页确认，提交前可改；确认即占额度（按课酬账单金额），超过付款总金额直接拦截</div></div><div class="info-item"><div class="k">加入待结算清单前提</div><div class="v">已确认付款合同号（未关联执行单仅提醒，最终须补关联）</div></div><div class="info-item"><div class="k">账期优先级</div><div class="v">紧急 &gt; 讲师特殊 &gt; 角色默认</div></div><div class="info-item"><div class="k">到期口径</div><div class="v">整张执行单按最后执行日 + N 天整体到期，到期即显示可提现</div></div></div></div></section>';
}

const SUB_PAGES=['/bills/detail','/bills/new','/applications/detail','/accounts/detail','/accounts/new','/accounts/org/detail','/accounts/org/new','/payments/monthly/detail'];
function render(){
  renderShell();document.getElementById('sidebar').classList.remove('open');
  const p=route();let html='';
  document.body.classList.toggle('cf-page',p==='/confirm'&&hasAccess(p));document.body.classList.toggle('cf-focus',p==='/confirm'&&hasAccess(p)&&!!state.cf.focus);
  if(!hasAccess(p)) html=forbidden();
  else {
    const map={
      '/bills':bills,'/bills/detail':billDetail,'/bills/new':billNew,'/cart':cartPage,'/applications':applications,'/applications/detail':applicationDetail,
      '/accounts/teacher':()=>accounts('teacher'),'/accounts/assistant':()=>accounts('assistant'),'/accounts/detail':accountDetail,'/accounts/new':accountNew,'/accounts/org':orgList,'/accounts/org/new':orgNew,'/accounts/org/detail':orgDetail,'/withdrawals':withdrawals,'/payments/monthly':monthlyPayments,
      '/payments/monthly/detail':monthlyDetail,'/confirm':paymentConfirm,'/refunds':refunds,'/settings':settings
    };
    if(!map[p]){location.hash=landing();return}
    html=map[p]();
  }
  // 二级页面（详情 / 新增）的操作按钮统一悬浮在页面底部居中
  if(SUB_PAGES.includes(p)){
    const m=html.match(/<div class="page-title"><div class="actions">([\s\S]*?)<\/div><\/div>/);
    if(m) html=html.replace(m[0],'')+'<div class="page-foot-space"></div><div class="page-foot">'+m[1]+'</div>';
  }
  {const sy=window.scrollY;document.getElementById('app').innerHTML=html;window.scrollTo(0,window.__keepScroll?sy:0);window.__keepScroll=false}
  let fab=document.getElementById('cartFab');if(!fab){fab=document.createElement('button');fab.id='cartFab';fab.onclick=()=>go('/cart');document.body.appendChild(fab)}
  const showFab=['pm','admin'].includes(state.role)&&p!=='/cart'&&hasAccess(p);
  fab.style.display=showFab?'flex':'none';fab.style.bottom=SUB_PAGES.includes(p)?'116px':'56px';
  fab.innerHTML=icon('cart')+'<span>待结算清单</span>'+(state.cart.size?'<em>'+state.cart.size+'</em>':'');
}
window.addEventListener('hashchange',render);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.cf.focus&&!document.getElementById('modalRoot').innerHTML){state.cf.focus=false;render()}});
if(!location.hash) location.hash=landing(); else render();
</script>
