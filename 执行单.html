<script>

const FEE_TREE={

const PMS=['张雅淇','承艳军','李明'];
const LECTURERS=[{id:'L001',name:'肖婷',phone:'13611110001'},{id:'L002',name:'马宇峰',phone:'13611110002'},{id:'L003',name:'王磊',phone:'13611110003'},{id:'L004',name:'李娜',phone:'',real:false},{id:'L005',name:'周明',phone:'13611110005',org:'北京云课堂教育科技有限公司',orgOk:false}];

 {id:'P1',cls:'FDE管理者认证（定制）',dates:['2026-11-09','2026-11-10','2026-11-11','2026-11-12'],method:'线下',city:'江西 · 南昌',pm:'张雅淇',lec:['L001','L002'],ast:['A002']},
 {id:'P2',cls:'数字化领导力（定制）',dates:['2026-11-23','2026-11-24','2026-11-25'],method:'线下',city:'江西 · 南昌',pm:'张雅淇',lec:['L002'],ast:['A001']},
 {id:'P3',cls:'项目管理实战（定制）',dates:['2026-12-07','2026-12-08','2026-12-09'],method:'线上',city:'',pm:'张雅淇',lec:['L005'],ast:['A002']}
];

let PAYC_ON=true;

const USERS={pm:{name:'张雅淇',id:'zhangyq',role:'项目经理'},entry:{name:'承艳军',id:'chengyj',role:'执行单录入人'}};

/* ================= 状态 ================= */
const S={mode:'new',hasSched:true,pm:'',cards:[],nid:1,user:'pm',evalDone:false};
const $=id=>document.getElementById(id);
const fm=n=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1600)}
const SL=['上午','下午'];
function pd(x){return new Date(x+'T00:00:00')}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(x,n){const d=pd(x);d.setDate(d.getDate()+n);return fmt(d)}
function isWk(x){const g=pd(x).getDay();return g===0||g===6}
function segmentsOf(dates){
  const segs=[];
  dates.forEach(d=>{
    const last=segs[segs.length-1];
    if(last){
      let x=addDays(last[last.length-1],1),ok=true;
      while(x<d){if(!isWk(x)){ok=false;break}x=addDays(x,1)}
      if(ok){last.push(d);return}
    }
    segs.push([d]);
  });
  return segs;
}
function dlShort(ds){return segmentsOf(ds).map(g=>g.length===1?g[0].slice(5):g[0].slice(5)+'~'+g[g.length-1].slice(5)).join('、')}
function findP(role,id){return (role==='lec'?LECTURERS:ASSISTANTS).find(p=>p.id===id)}
function slotsFor(pid,d){
  return SL.slice();
}
function inRoster(c,pid){return !!c.sched&&(c.schedLec.includes(pid)||c.schedAst.includes(pid))}
function validRange(c){return !!(c.from&&c.to&&c.to>=c.from)}
/* 实际培训日期：来自排期的日期；手工执行单则取执行时段 */
function trainDates(c){return c.sched?c.trainDates:rangeDates(c)}
function usedSched(){return new Set([...EXISTING.map(e=>e.sched),...S.cards.map(c=>c.sched).filter(Boolean)])}
function freeScheds(){const u=usedSched();return SCHEDS.filter(s=>!u.has(s.id))}
function namesOf(role,ids){return ids.map(id=>(findP(role,id)||{}).name).filter(Boolean).join('、')||'—'}

/* ================= 数据构造 ================= */
function newCard(){
  return {id:S.nid++,content:'定制培训',from:'',to:'',daysManual:null,owner:'',course:'',ratio:0,adj:0,adjAmt:0,free:'',mid:false,note:'',
    method:'线下',city:'',sched:'',schedName:'',trainDates:[],schedLec:[],schedAst:[],priceManual:'',lec:[],ast:[],rows:{},open:true,errs:{}};
}
/* 一个排期生成一张执行单：带入培训班名称（课程）、讲师、助教、方式、培训日期；执行时段由项目经理自行选择 */
function cardFromSched(sc){
  const c=newCard();
  c.sched=sc.id;c.schedName=sc.cls;c.trainDates=sc.dates.slice();c.schedLec=sc.lec.slice();c.schedAst=sc.ast.slice();
  c.course=sc.cls;c.method=sc.method;c.city=sc.city;
  /* 排期不含单价：有标准课程单价时作为默认值带入，可编辑；无则由项目经理手填 */
  const std=COURSES.find(x=>x.n===sc.cls);c.priceManual=std?String(std.price):'';
  sc.lec.forEach(id=>addPerson(c,'lec',id,'auto'));sc.ast.forEach(id=>addPerson(c,'ast',id,'auto'));
  return c;
}
function addPerson(c,role,id,src){
  const base=findP(role,id);if(!base)return;
  const list=role==='lec'?c.lec:c.ast;
  if(list.some(x=>x.id===id))return;
  list.push({id,name:base.name,phone:base.phone,src,role});
  c.rows[id]={cat:'',price:'',unit:'天',qty:null,other:'',otherNote:'',status:null,pc:'',pcManual:false,files:[],dates:null};
}

/* ================= 计算 ================= */
function naturalDays(c){if(!validRange(c))return 0;return Math.round((pd(c.to)-pd(c.from))/864e5)+1}
function autoDays(c){return c.sched?c.trainDates.length:naturalDays(c)}
function daysVal(c){if(c.daysManual!==null&&c.daysManual!=='')return +c.daysManual;return autoDays(c)}
function coursePrice(c){if(!c.sched){const k=COURSES.find(x=>x.n===c.course);if(k)return k.price}return (c.priceManual!==''&&c.priceManual!=null&&!isNaN(+c.priceManual))?+c.priceManual:null}
function cardAmount(c){const p=coursePrice(c);if(p===null)return null;return (p+(+c.adj||0))*daysVal(c)+(+c.adjAmt||0)}
/* 每位师资的授课/服务日期：默认取执行单（排期 / 执行时段），可单独修改，支持多个日期段 */
const segDays=g=>{if(!g.s)return 0;if(!g.e||g.e===g.s)return 1;const d=Math.round((pd(g.e)-pd(g.s))/864e5)+1;return d>0?d:0};
const segExpand=l=>{const o=[];l.forEach(g=>{if(!g.s)return;let x=g.s,n=0;const e=g.e&&g.e>=g.s?g.e:g.s;while(x<=e&&n<400){o.push(x);x=addDays(x,1);n++}});return o};
const segText=l=>l.filter(g=>g.s).map(g=>g.e&&g.e!==g.s?g.s.slice(5)+'~'+g.e.slice(5):g.s.slice(5)).join('、');
function rowDateList(c,pid){const r=c.rows[pid];return r&&r.dates?segExpand(r.dates):trainDates(c)}
function personDays(c,pid){const r=c.rows[pid];if(r&&r.dates)return segExpand(r.dates).length;return c.sched?c.trainDates.length:daysVal(c)}
function rowQty(c,pid){const r=c.rows[pid];return r.qty!==null&&r.qty!==''?+r.qty:personDays(c,pid)}
function rowOther(c,pid){const r=c.rows[pid];return r&&r.other!==''&&r.other!=null&&!isNaN(+r.other)?+r.other:0}
/* 总金额 = 单价 × 数量 + 其他费用 */
function rowAmt(c,pid){const r=c.rows[pid];if(r.price===''||r.price===null)return null;return Math.round(((+r.price)*rowQty(c,pid)+rowOther(c,pid))*100)/100}
function cardPersons(c){return [...c.lec,...c.ast]}
function paySum(c){return cardPersons(c).reduce((n,p)=>n+(rowAmt(c,p.id)||0),0)}
/* 已进入审批/账期的课酬账单是独立快照：编辑执行单不影响它，也不会重新生成，所以执行单内不做锁定 */
function isLocked(c,pid){return false}
function isSubmitted(c,pid){const r=c.rows[pid];return !!(r&&r.status&&r.status!=='待提交')}
function lastDate(c,pid){const r=c.rows[pid];if(r&&r.dates){const l=segExpand(r.dates);return l.length?l[l.length-1]:''}return c.to||''}
function rangeDates(c){const o=[];if(!validRange(c))return o;let x=c.from,n=0;while(x<=c.to&&n<400){o.push(x);x=addDays(x,1);n++}return o}
function catGroup(cat,role){for(const g of ROLE_GROUPS[role]||[])if(FEE_TREE[g].includes(cat))return g;return role==='lec'?'企培讲师成本':'企培助教成本'}
/* 付款合同卡控：单次付款金额≤5000 免签；助教 / 兼职无需选择（保留填写入口）；其余须选择并确认 */
/* 付款合同号：由系统按销售合同自动抓取（取剩余额度足够的付款合同），不再手选；抓不到则不允许提交 */
function syncPc(){
  const used={},rows=allRows().filter(x=>!isSubmitted(x.c,x.p.id));
  /* 项目经理手动选择的付款合同号优先保留；其余按剩余额度自动获取 */
  rows.forEach(x=>{if(x.r.pcManual&&x.r.pc)used[x.r.pc]=(used[x.r.pc]||0)+(rowAmt(x.c,x.p.id)||0)});
  rows.forEach(x=>{
    if(x.r.pcManual&&x.r.pc)return;
    const amt=rowAmt(x.c,x.p.id)||0;let hit='';
    if(PAYC_ON){const k=PAY_CONTRACTS.find(k=>k.total-k.used-(used[k.no]||0)>=amt);hit=k?k.no:''}
    x.r.pc=hit;if(hit)used[hit]=(used[hit]||0)+amt;
  });
}
/* 某付款合同号在本页被分配的课酬合计 */
function pcAssigned(no){return allRows().filter(x=>!isSubmitted(x.c,x.p.id)&&x.r.pc===no).reduce((n,x)=>n+(rowAmt(x.c,x.p.id)||0),0)}
function needContract(c,p){const r=c.rows[p.id],amt=rowAmt(c,p.id)||0;return amt>5000&&catGroup(r.cat,p.role)==='企培讲师成本'}
/* 同人同时段重复（强拦截）：合同下已有执行单 + 本页其他执行单 */
function conflictsOf(c,p){
  const out=[],mine=rowDateList(c,p.id);
  EXISTING.forEach(e=>{const ov=mine.filter(d=>(e.pids[p.id]||[]).includes(d));if(ov.length)out.push(`${dlShort(ov)} 已在执行单 ${e.no} 中录入，同人同时段重复`)});
  S.cards.forEach((o,j)=>{if(o===c||!cardPersons(o).some(q=>q.id===p.id))return;const ov=mine.filter(d=>rowDateList(o,p.id).includes(d));if(ov.length)out.push(`${dlShort(ov)} 与本页执行单 ${j+1} 同人同时段重复`)});
  return out;
}
/* 发起付款申请前的逐项校验（s=短名，m=说明） */
function rowIssues(c,p){
  const r=c.rows[p.id],iss=[],add=(k,s,m)=>iss.push({k,s,m});
  if(!r.cat)add('cat','费用类别','未选择费用类别');
  if(!(+r.price>0))add('price','单价','单价未填写');
  if(!(rowQty(c,p.id)>0))add('qty','数量','数量需大于 0');
  if(rowOther(c,p.id)<0)add('other','其他费用','其他费用不能为负数');
  else if(rowOther(c,p.id)>0&&!String(r.otherNote||'').trim())add('otherNote','其他费用说明','已填写其他费用，须说明费用是什么');
  if(lastDate(c,p.id)>TODAY)add('date','执行日期','最后执行日期 '+lastDate(c,p.id)+' 晚于今天，到期前不能发起');
  if(!p.phone)add('phone','手机号','手机号未补充，无法匹配收款账户');
  const bs=findP(p.role,p.id);
  if(bs&&bs.real===false)add('real','讲师实名','讲师未完成实名认证');
  if(bs&&bs.wx===false)add('wx','收款小程序','收款小程序未绑定');
  const base=findP(p.role,p.id);
  if(base&&base.org&&!base.orgOk)add('org','机构账户','所属机构「'+base.org+'」尚未建立机构账户');
  if(!r.pc)add('pc','付款合同号','未选择付款合同号（销售合同下无付款合同或额度不足），不允许提交');
  else{const left=pcLeft(r.pc),asg=pcAssigned(r.pc);if(asg>left)add('pcover','付款合同额度','付款合同 '+r.pc+' 剩余可付款 ¥'+left.toLocaleString()+'，本页已分配 ¥'+asg.toLocaleString()+'，额度不足，请更换付款合同号')}
  conflictsOf(c,p).forEach(m=>add('dup','时段重复',m));
  return iss;
}
/* 提交前强校验（任一不满足即不能提交）：手机号、实名、收款小程序、机构账户、付款合同号 */
const BLOCK_K=['phone','real','wx','org','pc','pcover'];
function blockIssues(c,p){return rowIssues(c,p).filter(x=>BLOCK_K.includes(x.k))}
function allRows(){const a=[];S.cards.forEach((c,i)=>cardPersons(c).forEach(p=>a.push({c,p,i,k:c.id+':'+p.id,r:c.rows[p.id]})));return a}
/* 可发起的行：账单尚未提交（无账单或待提交） */
function applyRows(){return allRows().filter(x=>!isSubmitted(x.c,x.p.id))}
function canInit(){return S.pm===USERS[S.user].name}
function pcLeft(no){const k=PAY_CONTRACTS.find(x=>x.no===no);return k?k.total-k.used:0}
function totalNow(){return S.cards.reduce((n,c)=>n+(cardAmount(c)||0),0)}
function contractLeft(){return CONTRACT.amount-CONTRACT.used}

/* ================= 渲染 ================= */
function renderAdd(){
  const free=freeScheds();
  $('addbar').innerHTML=(S.hasSched?`<a onclick="openGen()">+ 从排期生成执行单</a>${free.length?`<span class="tag o" style="margin-left:8px">该合同还有 ${free.length} 个排期未生成执行单</span>`:'<span class="hint" style="margin-left:8px">该合同下的排期均已生成执行单</span>'}<span style="margin:0 14px;color:#d1d5db">|</span>`:'')+'<a onclick="addCard()">+ 手工新增一份（不关联排期）</a>';
}
function renderAll(){renderInfo();syncPc();renderCards();renderAdd();recalc()}
function renderInfo(){
  const kv=(k,v,req)=>`<div class="kv"><span class="${req?'req':''}">${k}：</span><span style="flex:1">${v}</span></div>`;
  $('info').innerHTML=
   kv('合同编号',`<select><option>${CONTRACT.no}</option></select>`,1)+kv('签约客户名称',CONTRACT.sign)+kv('最终客户名称',CONTRACT.final)+kv('项目名称',CONTRACT.project)
   +kv('合作内容',CONTRACT.content)+kv('合同金额',fm(CONTRACT.amount))+kv('销售人员',CONTRACT.sales)
   +kv('项目经理',`<span class="${S.errPm?'err':''}"><select onchange="S.pm=this.value;S.errPm=false;renderInfo()"><option value="">请选择</option>${PMS.map(x=>`<option ${S.pm===x?'selected':''}>${x}</option>`).join('')}</select>${S.errPm?'<div class="errtxt">请选择项目经理</div>':''}</span>`,1)
   +kv('执行单录入人员',USERS[S.user].name);
}
function fld(label,html,o={}){return `<div class="fl ${o.full?'full':''} ${o.err?'err':''}"><label class="${o.req?'req':''}">${label}</label><div class="c">${html}${o.err?`<div class="errtxt">${o.err}</div>`:''}</div></div>`}
function opt(list,v,ph){return (ph?`<option value="">${ph}</option>`:'')+list.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}
function dateField(c){
  let h=`<div class="rg"><input type="date" value="${c.from}" onchange="setRange(${c.id},'from',this.value)"><span>→</span><input type="date" value="${c.to}" onchange="setRange(${c.id},'to',this.value)"></div>`;
  if(c.from&&c.to&&c.to<c.from)h+='<div class="errtxt">结束日期不能早于开始日期</div>';
  return h;
}
function pbox(c,role){
  const list=role==='lec'?c.lec:c.ast,err=role==='lec'&&c.errs.lec;
  const chips=list.map(p=>{const lk=isLocked(c,p.id);
    return `<span class="chip ${lk?'lock':''}">${p.name} <small>${p.phone||'手机号待补充'}</small>${lk?'<span title="已有课酬账单进入审批或之后状态，不可移除">🔒</span>':`<i onclick="rmP(${c.id},'${role}','${p.id}')">✕</i>`}</span>`}).join('');
  let panel='';
  return `<div class="pbox ${err?'err':''}" onclick="event.stopPropagation()"><div class="chips">${chips}</div>
   <input id="in_${c.id}_${role}" type="text" autocomplete="off" oninput="dd(${c.id},'${role}')" onfocus="dd(${c.id},'${role}')">
   <div class="dd" id="dd_${c.id}_${role}"></div></div>${err?'<div class="errtxt">请选择讲师名称</div>':''}${panel}`;
}
function rowDatesText(c,p){
  const rr=c.rows[p.id];
  if(rr&&rr.dates)return `${segText(rr.dates)}（${personDays(c,p.id)}天）`;
  if(c.sched)return `${dlShort(c.trainDates)}（${c.trainDates.length}天）`+(c.rows[p.id]&&!inRoster(c,p.id)?' <span class="tag k">非排期人员</span>':'');
  if(!validRange(c))return '请先选择执行时段';
  return `${c.from.slice(5)}~${c.to.slice(5)}（${naturalDays(c)}天）`;
}
function checkCell(c,p){
  const r=c.rows[p.id];
  if(isSubmitted(c,p.id))return `<span class="tag k">账单${r.status} · 已锁定</span>`;
  const head=r.status?'<span class="tag b">账单待申请</span>':'';
  const iss=rowIssues(c,p);
  if(!iss.length)return head+'<span class="tag g">可发起付款申请</span>';
  const show=iss.slice(0,3).map(x=>`<span class="tag o" title="${x.m}">${x.s}</span>`).join('');
  return head+show+(iss.length>3?`<span class="tag o" title="${iss.slice(3).map(x=>x.m).join('；')}">+${iss.length-3}</span>`:'');
}
const pcSel=(c,p)=>{
  const r=c.rows[p.id],dis=isSubmitted(c,p.id)?'disabled':'';
  const opts=PAYC_ON?PAY_CONTRACTS.map(k=>`<option value="${k.no}" ${r.pc===k.no?'selected':''}>${k.no}</option>`).join(''):'';
  const over=r.pc&&pcAssigned(r.pc)>pcLeft(r.pc);
  return `<select class="pc ${(!r.pc||over)?'bad':''}" ${dis} title="${r.pc?(r.pcManual?'已手动选择':'系统已按额度自动匹配，可修改'):'未选择付款合同号，不能提交'}" onchange="setPc(${c.id},'${p.id}',this.value)"><option value="">${PAYC_ON?'请选择':'无可选付款合同'}</option>${opts}</select>`;
};
const fileCell=(c,p)=>{
  const r=c.rows[p.id],n=(r.files||[]).length,sub=isSubmitted(c,p.id);
  return `<div class="fa">${sub?'':`<label class="btn sm upl">上传<input type="file" multiple style="display:none" onchange="upFiles(${c.id},'${p.id}',this)"></label>`}${n?`<a onclick="showFiles(${c.id},'${p.id}')" title="${r.files.map(f=>f.name).join('、')}">📎 ${n}</a>`:(sub?'<span class="hint">—</span>':'')}</div>`;
};
/* ---------- 单个师资的授课/服务日期：可修改、可增加多个日期段；单位为“天”时自动按天数填入数量 ---------- */
let DE=null;
function editDates(cid,pid){
  const c=card(cid),r=c.rows[pid];
  let list=r.dates?r.dates.map(g=>({s:g.s,e:g.e||''})):null;
  if(!list){
    const ds=trainDates(c);
    list=ds.length?(c.sched?segmentsOf(ds).map(g=>({s:g[0],e:g.length>1?g[g.length-1]:''})):[{s:c.from,e:c.to&&c.to!==c.from?c.to:''}]):[{s:'',e:''}];
  }
  DE={cid,pid,list};renderDE();
}
function renderDE(){
  const {cid,pid,list}=DE,c=card(cid),p=findRowP(c,pid),r=c.rows[pid];
  const tot=list.reduce((n,g)=>n+segDays(g),0);
  showModal(`<h4>${p.name} · 授课 / 服务日期</h4><div class="lead">可修改日期，也可添加多个日期段（结束日期不填表示单日）。单位为“天”时，保存后数量自动按所有日期段的天数合计填入，之后仍可手动修改。</div>`+
   list.map((g,i)=>{const bad=g.s&&g.e&&g.e<g.s;return `<div class="dsr"><input type="date" value="${g.s}" onchange="deSet(${i},'s',this.value)"><i>至</i><input type="date" value="${g.e}" ${g.s?`min="${g.s}"`:''} onchange="deSet(${i},'e',this.value)"><span class="n ${bad?'bad':''}">${bad?'结束早于开始':segDays(g)?segDays(g)+' 天':'—'}</span>${list.length>1?`<a onclick="deDel(${i})">删除</a>`:''}</div>`}).join('')+
   `<div style="margin:2px 0 4px"><a style="color:var(--blue);cursor:pointer" onclick="deAdd()">+ 添加日期段</a><span class="hint" style="margin-left:12px">共 <b style="color:var(--blue)">${tot}</b> 天</span></div>`+
   `<div class="ops sp"><div class="l">${r.dates?'<button class="btn" onclick="deReset()">恢复为执行单日期</button>':''}</div><div class="l"><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="deSave()">确定</button></div></div>`);
  $('modal').style.width='620px';
}
function deSet(i,f,v){const g=DE.list[i];g[f]=v;if(f==='s'&&g.e&&g.e<v)g.e='';renderDE()}
function deAdd(){DE.list.push({s:'',e:''});renderDE()}
function deDel(i){DE.list.splice(i,1);renderDE()}
function deReset(){const r=card(DE.cid).rows[DE.pid];r.dates=null;r.qty=null;closeModal();renderAll();toast('已恢复为执行单日期')}
function deSave(){
  const raw=DE.list.filter(g=>g.s||g.e);
  if(!raw.length||raw.some(g=>!g.s)){toast('请完整填写日期段的开始日期');return}
  if(raw.some(g=>g.e&&g.e<g.s)){toast('结束日期不能早于开始日期');return}
  const l=raw.map(g=>({s:g.s,e:g.e&&g.e!==g.s?g.e:''})).sort((a,b)=>a.s.localeCompare(b.s));
  for(let i=1;i<l.length;i++){if(l[i].s<=(l[i-1].e||l[i-1].s)){toast('日期段之间有重叠，请调整');return}}
  const r=card(DE.cid).rows[DE.pid];r.dates=l;
  if(r.unit==='天')r.qty=null;
  closeModal();renderAll();toast(r.unit==='天'?'已保存，数量已按 '+personDays(card(DE.cid),DE.pid)+' 天自动填入':'已保存');
}
function setPc(cid,pid,v){const r=card(cid).rows[pid];r.pc=v;r.pcManual=!!v;renderAll()}
function upFiles(cid,pid,input){
  const r=card(cid).rows[pid];r.files=r.files||[];let bad=0,n=0;
  [...input.files].forEach(f=>{if(f.size>100*1048576){bad++;return}r.files.push({name:f.name,size:f.size});n++});
  input.value='';
  const el=$('fl_'+cid+'_'+pid);if(el)el.innerHTML=fileCell(card(cid),findRowP(card(cid),pid));
  toast(bad?bad+' 个文件超过 100MB，未上传':'已上传 '+n+' 个附件');
}
const findRowP=(c,pid)=>cardPersons(c).find(p=>p.id===pid);
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?Math.round(n/1024)+' KB':n+' B';
function showFiles(cid,pid){
  const c=card(cid),p=findRowP(c,pid),r=c.rows[pid],sub=isSubmitted(c,pid);
  showModal(`<h4>${p.name} 的附件（${(r.files||[]).length}）</h4>${(r.files||[]).map((f,i)=>`<div class="frow"><span>📄 ${f.name}</span><span class="hint">${fmtSize(f.size)}</span>${sub?'':`<a onclick="delFile(${cid},'${pid}',${i})">删除</a>`}</div>`).join('')||'<div class="hint">暂无附件</div>'}<div class="ops"><button class="btn pri" onclick="closeModal()">关闭</button></div>`);
}
function delFile(cid,pid,i){
  const c=card(cid),r=c.rows[pid];r.files.splice(i,1);
  const el=$('fl_'+cid+'_'+pid);if(el)el.innerHTML=fileCell(c,findRowP(c,pid));
  if(r.files.length)showFiles(cid,pid);else closeModal();
}

     <td><div class="nm"><b>${p.name}</b><span class="tag ${p.role==='lec'?'b':'g'}">${p.role==='lec'?'讲师':'助教'}</span>${sub?`<span class="tag k">账单${r.status} · 已锁定</span>`:''}</div><div class="hint">${p.phone||'<span class="tag o">手机号待补充</span>'}</div></td>
     <td class="dt"><span class="dtx">${rowDatesText(c,p)}</span>${sub?'':` <a class="dedit" onclick="editDates(${c.id},'${p.id}')">修改</a>`}${r.dates?' <span class="tag b" title="已单独修改，不再跟随执行单日期">已修改</span>':''}</td>
     <td><select class="cat" ${dis} onchange="setRow(${c.id},'${p.id}','cat',this.value)"><option value="">请选择</option>${catOpts(r.cat||'',p.role)}</select></td>
     <td><input type="number" min="0" step="0.01" ${dis} placeholder="元/${r.unit}" value="${r.price}" oninput="setRow(${c.id},'${p.id}','price',this.value,1)"></td>
     <td><div class="ow"><input type="number" class="q" min="0" step="0.5" ${dis} id="rq_${c.id}_${p.id}" value="${rowQty(c,p.id)}" oninput="setRow(${c.id},'${p.id}','qty',this.value,1)"><select ${dis} onchange="setRow(${c.id},'${p.id}','unit',this.value)">${opt(UNITS,r.unit)}</select></div></td>
     <td class="oth"><div class="ow"><input type="number" min="0" step="0.01" ${dis} placeholder="金额" value="${r.other}" oninput="setRow(${c.id},'${p.id}','other',this.value,1)"><input type="text" maxlength="50" ${dis} id="on_${c.id}_${p.id}" class="${rowOther(c,p.id)>0&&!String(r.otherNote||'').trim()?'bad':''}" placeholder="说明，如交通费" value="${(r.otherNote||'').replace(/"/g,'&quot;')}" oninput="setRow(${c.id},'${p.id}','otherNote',this.value,1)"></div></td>
     <td id="ra_${c.id}_${p.id}">—</td>
     <td id="pcv_${c.id}_${p.id}">${pcSel(c,p)}</td>
     <td id="fl_${c.id}_${p.id}">${fileCell(c,p)}</td>
     </tr>`}).join('');
  return `<div style="overflow-x:auto"><table class="pz"><thead><tr><th>人员</th><th>授课 / 服务日期</th><th>费用类别</th><th>单价</th><th>数量 / 单位</th><th>其他费用（元）及说明</th><th title="总金额 = 单价 × 数量 + 其他费用">总金额</th><th>付款合同号</th><th>附件</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

   <span class="del ${lockedAny?'off':''}" ${lockedAny?'title="已有课酬账单进入审批或之后状态，不可删除"':`onclick="delCard(${c.id})"`}>删除</span></div>
  <div class="g2">

   ${fld('执行时段',dateField(c),{req:1,err:e.dates?((c.from&&c.to&&c.to<c.from)?'结束日期不能早于开始日期':'请选择执行时段'):''})}
   ${fld('执行天数',`<input type="number" min="0" step="0.5" placeholder="请输入" value="${daysVal(c)||''}" onchange="setF(${c.id},'daysManual',this.value);renderAll()">`,{req:1,err:e.days?'请填写执行天数':''})}
   ${fld('其中：免费情况',`<input type="text" placeholder="请输入" value="${c.free}" oninput="setF(${c.id},'free',this.value)">`)}
   ${fld('项目归属',`<select onchange="setF(${c.id},'owner',this.value);">${opt(OWNERS,c.owner,'请选择')}</select>`,{req:1,err:e.owner?'请选择项目归属':''})}
   ${fld('课程名称',c.sched?`<div class="ro">${c.course}</div>`:`<select onchange="setF(${c.id},'course',this.value);recalc()">${opt(COURSES.map(x=>x.n),c.course,'请选择')}</select>`,{req:1,err:e.course?'请选择课程名称':''})}
   ${fld('执行单价',c.sched?`<input type="number" min="0" placeholder="请输入执行单价" value="${c.priceManual}" oninput="setF(${c.id},'priceManual',this.value);delete card(${c.id}).errs.price;recalc()">`:`<div class="ro" id="price_${c.id}">—</div>`,{req:1,err:e.price?'请填写执行单价':''})}
   ${fld('拆班比例',`<input type="number" min="0" value="${c.ratio}" oninput="setF(${c.id},'ratio',this.value)">`)}
   ${fld('执行单价调整额',`<input type="number" value="${c.adj}" oninput="setF(${c.id},'adj',this.value);recalc()">`,{req:1})}
   ${fld('讲师名称',pbox(c,'lec'),{req:1})}
   ${fld('助教名称',pbox(c,'ast'))}
   ${fld('培训方式',c.sched?`<div class="ro">${c.method}${c.city&&c.method==='线下'?' · '+c.city:''}</div>`:`<select onchange="setF(${c.id},'method',this.value)">${opt(['线下','线上'],c.method)}</select>`)}
   ${fld('调整执行金额',`<input type="number" value="${c.adjAmt}" oninput="setF(${c.id},'adjAmt',this.value);recalc()">`,{req:1})}
   ${fld('执行金额',`<div class="ro" id="amt_${c.id}">—</div><div class="errtxt" id="over_${c.id}"></div>`,{req:1})}
   ${fld('中台参与',`<input type="checkbox" ${c.mid?'checked':''} onchange="setF(${c.id},'mid',this.checked)">`)}
   ${fld('执行金额说明',`<textarea placeholder="请输入" oninput="setF(${c.id},'note',this.value)">${c.note}</textarea>`,{full:1})}
   ${fld('附件备注',`<button class="btn sm pri" onclick="toast('演示：上传附件')">上传</button>`,{full:1})}
  </div>
  <div class="pay ${c.open?'':'shut'}"><div class="ph" onclick="togglePay(${c.id})"><b>师资课酬明细</b><span class="pb" id="pb_${c.id}"></span><span class="car">${c.open?'收起 ▴':'展开 ▾'}</span></div>
   ${c.open?rowsHtml(c)+`<div class="ptot"><span id="pc_${c.id}"></span><span id="ps_${c.id}"></span></div>`:''}</div>

function renderCards(){$('cards').innerHTML=S.cards.map(cardHtml).join('')}
function recalc(){
  syncPc();
  S.cards.forEach(c=>{
    const p=coursePrice(c),a=cardAmount(c);
    const pe=$('price_'+c.id);if(pe)pe.textContent=p===null?'--':fm(p);
    const ae=$('amt_'+c.id);if(ae)ae.textContent=a===null?'--':fm(a);
    cardPersons(c).forEach(x=>{const on=$('on_'+c.id+'_'+x.id);if(on)on.classList.toggle('bad',rowOther(c,x.id)>0&&!String(c.rows[x.id].otherNote||'').trim())});
    cardPersons(c).forEach(x=>{const el=$('ra_'+c.id+'_'+x.id);if(el){const v=rowAmt(c,x.id);el.textContent=v===null?'—':'¥'+v.toLocaleString()}});
    cardPersons(c).forEach(x=>{const el=$('ck_'+c.id+'_'+x.id);if(el)el.innerHTML=checkCell(c,x);const pv=$('pcv_'+c.id+'_'+x.id);if(pv&&!pv.contains(document.activeElement))pv.innerHTML=pcSel(c,x)});
    const pbEl=$('pb_'+c.id);
    if(pbEl){const ar=applyRows().filter(y=>y.c===c),bad=ar.filter(y=>blockIssues(y.c,y.p).length).length;
      pbEl.className='pb '+(bad?'bad':'ok');pbEl.textContent=ar.length?(bad?`提交前，还有 ${bad} 人需补齐校验项`:'校验项已全部满足'):''}
    const ps=$('ps_'+c.id);
    if(ps){const sum=paySum(c);ps.innerHTML=`课酬合计：<b>¥${sum.toLocaleString()}</b>`;
      const pc=$('pc_'+c.id);if(pc)pc.innerHTML=`共 ${cardPersons(c).length} 人`+((a!==null&&sum>a)?` <span class="w">· 课酬合计超过本执行单金额 ¥${fm(a)}，仅提醒，不拦截</span>`:'')}
  });
  const tot=totalNow(),left=contractLeft(),over=tot>left;
  S.cards.forEach(c=>{const o=$('over_'+c.id);if(o)o.textContent=(over&&cardAmount(c)!==null)?`执行金额合计超出合同剩余可执行金额 ¥${fm(left)}`:''});
  const ar=applyRows(),ready=ar.filter(y=>!blockIssues(y.c,y.p).length).length,pmOk=canInit();
  $('foot').innerHTML=`<div class="s"><span>合同金额</span><b>${fm(CONTRACT.amount)}</b></div><div class="s"><span>已执行</span><b>${fm(CONTRACT.used)}</b></div>
   <div class="s"><span>本次执行</span><b>${fm(tot)}</b></div><div class="s ${over?'bad':''}"><span>合同剩余</span><b>${fm(left-tot)}</b></div>
   ${over?'<span class="e">本次执行金额超过合同剩余可执行金额，不能提交</span>':''}<span class="fx"></span>
   <span class="tip2 ${ready===ar.length?'ok':'bad'}">${ar.length?`提交校验通过 ${ready} / ${ar.length} 人${ready<ar.length?'，未通过不能提交':''}`:''}${pmOk?'':'（仅项目经理本人可发起付款申请）'}</span>
   <button class="btn" onclick="submit('save')" title="手机号、实名、收款小程序、机构账户、付款合同号须全部满足">提交执行单</button>
   <button class="btn pri" ${pmOk?'':'disabled'} onclick="submit('apply')" title="${pmOk?'':'仅执行单上的项目经理本人可发起'}">提交并发起付款申请</button>`;
  renderWarns();
}
let warnsOpen=false;
function warnList(){
  const out=[];
  if(!S.hasSched)return out;
  /* 本页多份执行单之间，同人同时段重复 */
  const map={};
  S.cards.forEach((c,i)=>{const h=trainDates(c);cardPersons(c).forEach(p=>h.forEach(d=>slotsFor(p.id,d).forEach(s=>{const k=p.id+'|'+d+'|'+s;(map[k]=map[k]||{p,d,idx:[]}).idx.push(i+1)})))});
  const g={};
  Object.values(map).filter(x=>x.idx.length>1).forEach(x=>{const k=x.p.id+'|'+x.idx.join('、');(g[k]=g[k]||{p:x.p,idx:x.idx,ds:[]}).ds.push(x.d)});
  Object.values(g).forEach(x=>out.push(`${x.p.name} ${dlShort([...new Set(x.ds)].sort())} 同时出现在执行单 ${x.idx.join('、')}，仅提醒；生成账单时同人同时段会被拦截`));
  S.cards.forEach((c,i)=>{
    const h=trainDates(c);
    cardPersons(c).forEach(p=>{
      const mine=h.filter(d=>slotsFor(p.id,d).length);
      /* 合同下已有执行单 */
      EXISTING.forEach(e=>{const ov=mine.filter(d=>(e.pids[p.id]||[]).includes(d));if(ov.length)out.push(`执行单 ${i+1}：${p.name} ${dlShort(ov)} 已在执行单 ${e.no} 中录入，仅提醒；生成账单时同人同时段会被拦截`)});
      /* 其他项目占用 */
      const occ=OCCUPY[p.id]||[],hit={};
      mine.forEach(d=>occ.filter(o=>o.date===d).forEach(o=>{if(slotsFor(p.id,d).some(s=>(o.slot==='全天'?SL:[o.slot]).includes(s)))(hit[o.project]=hit[o.project]||[]).push(d)}));
      Object.keys(hit).forEach(k=>out.push(`执行单 ${i+1}：${p.name} ${dlShort(hit[k])} 已在「${k}」有排期，仅提醒`));
    });
  });
  return out;
}
function renderWarns(){
  $('warns').innerHTML='';
}

/* ================= 交互 ================= */
function card(id){return S.cards.find(c=>c.id===id)}
function setF(id,k,v){const c=card(id);c[k]=(k==='daysManual'&&v==='')?null:v;if(c.errs[k])delete c.errs[k]}
function setRow(id,pid,k,v,live){const c=card(id),r=c.rows[pid];r[k]=v;if(live)recalc();else renderAll()}
function togglePay(id){const c=card(id);c.open=!c.open;renderCards();recalc()}
function setRange(id,k,v){
  const c=card(id);c[k]=v;delete c.errs.dates;
  if(c.from&&c.to&&c.to<c.from)toast('结束日期不能早于开始日期');
  c.daysManual=null;renderAll();
}
function addCard(){
  S.cards.push(newCard());renderAll();
  setTimeout(()=>{const el=$('card_'+S.cards[S.cards.length-1].id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},50);
}
function delCard(id){
  S.cards=S.cards.filter(c=>c.id!==id);if(!S.cards.length)S.cards=[newCard()];renderAll();toast('已删除，对应排期可重新选择');
}
function togglePick(cid,pid){
  const c=card(cid);
  if(c.lec.some(p=>p.id===pid)){if(isLocked(c,pid))return;rmP(cid,'lec',pid);return}
  addPerson(c,'lec',pid,'pick');delete c.errs.lec;c.daysManual=null;renderAll();
}

/* 人员选择 */
function dd(cid,role){
  closeDd(cid+'_'+role);
  const c=card(cid),input=$('in_'+cid+'_'+role),box=$('dd_'+cid+'_'+role);if(!input||!box)return;
  const q=input.value.trim(),src=role==='lec'?LECTURERS:ASSISTANTS;
  const chosen=(role==='lec'?c.lec:c.ast).map(p=>p.id);
  const list=src.filter(p=>!q||p.name.includes(q));
  let h=list.map(p=>{const off=chosen.includes(p.id);
    return `<div class="it ${off?'off':''}" ${off?'':`onclick="pick(${cid},'${role}','${p.id}')"`}><span>${p.name}${off?'（已选）':''}</span><small>${p.phone||'手机号待补充'}</small></div>`}).join('');
  if(!list.length)h=`<div class="empty">${role==='lec'?'讲师运营系统中未找到该讲师':'未找到该助教'}</div>`;
  if(role==='ast')h+=`<div class="it add" onclick="openAst(${cid})">＋ 新增助教${q?'「'+q+'」':''}</div>`;
  box.innerHTML=h;box.classList.add('on');
}
function closeDd(except){document.querySelectorAll('.dd').forEach(d=>{if(!except||d.id!=='dd_'+except)d.classList.remove('on')})}
function pick(cid,role,id){const c=card(cid);addPerson(c,role,id,'pick');if(role==='lec')delete c.errs.lec;c.daysManual=null;renderAll()}
function rmP(cid,role,id){const c=card(cid);if(role==='lec')c.lec=c.lec.filter(p=>p.id!==id);else c.ast=c.ast.filter(p=>p.id!==id);delete c.rows[id];c.daysManual=null;renderAll()}
document.addEventListener('click',()=>closeDd());

/* 弹窗 */
function showModal(h){$('modal').style.width='';$('modal').className='modal';$('modal').innerHTML=h;$('mask').classList.add('on')}
function closeModal(){$('mask').classList.remove('on');$('modal').className='modal';$('modal').style.width=''}
let astCid=null;
function openAst(cid){
  astCid=cid;closeDd();
  const q=$('in_'+cid+'_ast').value.trim();
  showModal(`<h4>新增助教</h4><div class="f"><label class="req">助教姓名</label><input type="text" id="nName" maxlength="20" value="${q}" placeholder="请输入姓名"></div>
   <div class="f"><label>手机号 <span class="hint">（缺失将无法提交执行单，可稍后在讲师运营系统补充）</span></label><input type="text" id="nPhone" maxlength="11" placeholder="请输入11位手机号"></div>
   <div class="err" id="nErr"></div><div class="ops"><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="saveAst()">确定并选择</button></div>`);
  setTimeout(()=>$('nName').focus(),0);
}
function saveAst(){
  const name=$('nName').value.trim(),phone=$('nPhone').value.trim(),err=$('nErr');
  if(!name){err.textContent='请填写助教姓名';return}
  if(phone){if(!/^1\d{10}$/.test(phone)){err.textContent='手机号格式不正确';return}
    if(ASSISTANTS.some(a=>a.phone===phone)){err.textContent='该手机号已被其他人员占用';return}}
  const a={id:'A'+String(ASSISTANTS.length+1).padStart(3,'0'),name,phone};ASSISTANTS.push(a);
  addPerson(card(astCid),'ast',a.id,'pick');closeModal();renderAll();toast('已新增助教并选择：'+name);
}

/* ================= 提交 ================= */
function validate(){
  let ok=true,first=null;
  S.errPm=!S.pm;if(S.errPm){ok=false;first=first||'info'}
  S.cards.forEach(c=>{
    c.errs={};
    if(!validRange(c))c.errs.dates=1;
    if(!(daysVal(c)>0))c.errs.days=1;
    if(!c.owner)c.errs.owner=1;
    if(!c.course)c.errs.course=1;
    if(c.sched&&coursePrice(c)===null)c.errs.price=1;
    if(!c.lec.length)c.errs.lec=1;
    if(Object.keys(c.errs).length){ok=false;first=first||('card_'+c.id)}
  });
  if(totalNow()>contractLeft()){ok=false;first=first||'foot'}
  renderAll();
  if(first&&first!=='foot'){const el=first==='info'?$('info'):$(first);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
  return ok;
}
function submit(kind){
  if(!validate()){toast(totalNow()>contractLeft()?'执行金额超过合同剩余可执行金额':'请先补全必填项');return}
  const blocked=allRows().filter(x=>!isSubmitted(x.c,x.p.id)).map(x=>({x,iss:blockIssues(x.c,x.p)})).filter(o=>o.iss.length);
  if(blocked.length){openBlock(blocked);return}
  if(kind==='apply'){
    if(!canInit()){toast('仅项目经理本人可发起付款申请');return}
    openApply();return;
  }
  openSaveConfirm();
}
/* 提交前强校验未通过：逐人列出需处理事项，处理完才能提交 */
function openBlock(list){
  $('modal').className='modal w';
  $('modal').innerHTML=`<h4>还有 ${list.length} 人未满足提交条件</h4>
   <div class="lead">以下校验项<b>任一不满足都不能提交</b>（手机号、讲师实名、收款小程序绑定、机构账户、付款合同号），请先处理。</div>
   <table class="atb"><thead><tr><th>人员</th><th>所在执行单</th><th>需处理事项</th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${o.x.p.name}</b> <span class="tag ${o.x.p.role==='lec'?'b':'g'}">${o.x.p.role==='lec'?'讲师':'助教'}</span></td><td>执行单 ${o.x.i+1}${o.x.c.course?' · '+o.x.c.course:''}</td><td>${o.iss.map(t=>`<div class="bad" style="color:#b42318">✗ ${t.m}</div>`).join('')}</td></tr>`).join('')}</tbody></table>
   <div class="ops"><button class="btn pri" onclick="closeModal();backFixBlock()">去处理</button></div>`;
  $('mask').classList.add('on');

/* ---------- 风险提醒（预设规则，仅提醒、不拦截；规则与阈值待后续讨论） ---------- */
const RISK_LONG=31;
/* 该讲师 / 助教同费用类别的历史最高单价（演示数据，真实环境取课酬账单历史） */
const HIST_PRICE={L001:{'授课费':3000},L002:{'授课费':4500},L003:{'授课费':3500},A001:{'线下助教费':300},A002:{'线下助教费':400}};
function spanDays(ds){if(!ds.length)return 0;const s=[...ds].sort();return Math.round((pd(s[s.length-1])-pd(s[0]))/864e5)+1}
/* rows：本次涉及的行；返回风险文案列表 */
function risksOf(rows){
  const out=[],cards=[...new Set(rows.map(x=>x.c))];
  rows.forEach(x=>{const h=(HIST_PRICE[x.p.id]||{})[x.r.cat];
    if(h&&+x.r.price>h)out.push(`${x.p.name}：${x.r.cat}单价 ¥${(+x.r.price).toLocaleString()}，高于历史最高 ¥${h.toLocaleString()}`)});
  cards.forEach((c,i)=>{const tag=S.cards.length>1?`执行单 ${S.cards.indexOf(c)+1}：`:'';
    const td=trainDates(c),sp=spanDays(td);
    if(sp>RISK_LONG)out.push(`${tag}服务日期跨度 ${sp} 天，超过 ${RISK_LONG} 天`);
    if(validRange(c)&&naturalDays(c)>RISK_LONG)out.push(`${tag}执行时段 ${naturalDays(c)} 天，超过 ${RISK_LONG} 天`);
    if(td.length&&daysVal(c)!==td.length)out.push(`${tag}执行天数 ${daysVal(c)} 天与服务天数 ${td.length} 天不一致`);
    rows.filter(x=>x.c===c&&x.r.unit==='天'&&td.length&&rowQty(c,x.p.id)!==td.length).forEach(x=>out.push(`${tag}${x.p.name} 数量 ${rowQty(c,x.p.id)} 天与服务天数 ${td.length} 天不一致`));
    const a=cardAmount(c),sum=rows.filter(x=>x.c===c).reduce((n,x)=>n+(rowAmt(c,x.p.id)||0),0);
    if(a!==null&&sum>a)out.push(`${tag}课酬合计 ¥${sum.toLocaleString()} 超过执行金额 ¥${a.toLocaleString()}`)});
  return out;
}
function riskHtml(list,withNote){
  if(!list.length)return '';
  return `<div class="banner warn"><b>风险提醒</b>（${list.length} 项，请确认信息无误后再提交）<ul>${list.slice(0,8).map(x=>`<li>${x}</li>`).join('')}${list.length>8?`<li>……另有 ${list.length-8} 项</li>`:''}</ul>${withNote?`<div style="margin-top:6px"><input type="text" maxlength="200" placeholder="风险说明（选填，将随结算单展示给审批人）" value="${APPLY.riskNote.replace(/"/g,'&quot;')}" onchange="APPLY.riskNote=this.value" style="width:100%"></div>`:''}</div>`;
}

function applyChecks(){
  const rows=applyRows(),sel=rows.filter(x=>APPLY.sel.has(x.k));

  g.push({ok:canInit(),t:canInit()?`发起人：${USERS[S.user].name}（项目经理本人）`:`仅执行单上的项目经理（${S.pm||'未选择'}）可发起付款申请`});

  const reasonOk=APPLY.ch==='常规'||!!APPLY.reason.trim();
  g.push({ok:reasonOk,t:APPLY.ch==='常规'?'结算方式：常规结算':(reasonOk?'结算方式：紧急结算，已填写原因':'紧急结算须填写原因')});
  g.push({ok:sel.length>0,t:sel.length?`已勾选 ${sel.length} 人`:'请至少勾选 1 人发起'});
  /* 付款合同额度：本次已确认的金额汇总 */
  const use={};sel.forEach(x=>{if(x.r.pc)use[x.r.pc]=(use[x.r.pc]||0)+(rowAmt(x.c,x.p.id)||0)});
  Object.keys(use).forEach(no=>{const left=pcLeft(no),ok=use[no]<=left;g.push({ok,t:ok?`付款合同 ${no} 额度充足（本次占用 ¥${use[no].toLocaleString()}，剩余 ¥${left.toLocaleString()}）`:`付款合同 ${no} 额度不足：本次需 ¥${use[no].toLocaleString()}，剩余 ¥${left.toLocaleString()}`})});
  const rowBad=sel.map(x=>({x,iss:rowIssues(x.c,x.p)})).filter(o=>o.iss.length);
  const nbad=g.filter(x=>!x.ok).length+rowBad.reduce((n,o)=>n+o.iss.length,0);
  return {rows,sel,g,rowBad,nbad};
}

    const c=cardFromSched(SCHEDS[1]);c.from='2026-11-09';c.to='2026-11-09';c.owner='华东一部';
    fill(c,'L002','授课费',6000,'FK-2026-0381');fill(c,'A001','线下助教费',400);
    c.rows.L002.other='500';c.rows.L002.otherNote='往返交通费（实报实销）';
    S.cards=[c];
  }else if(v==='risk'){
    const c=cardFromSched(SCHEDS[1]);c.from='2026-11-09';c.to='2026-11-10';c.owner='华东一部';
    c.trainDates=['2026-11-23','2026-11-24','2026-11-25','2026-12-28'];c.daysManual='5';
    fill(c,'L002','授课费',6000,'FK-2026-0381');fill(c,'A001','线下助教费',400);
    S.cards=[c];S.evalDone=true;
  }else if(v==='edit'){
    const c=cardFromSched(SCHEDS[0]);c.from='2026-11-09';c.to='2026-11-12';c.owner='华东一部';
    addPerson(c,'ast','A001','pick');
    fill(c,'L001','授课费',1000);c.rows.L001.status='待提交';
    fill(c,'L002','授课费',2000,'FK-2026-0381');c.rows.L002.status='审批中';c.rows.L002.qty=String(personDays(c,'L002'));
    fill(c,'A002','线下助教费',500);c.rows.A002.status='账期中';c.rows.A002.qty=String(personDays(c,'A002'));
    fill(c,'A001','线下助教费',400);c.rows.A001.status='待提交';
    S.cards=[c];
  }else{
    /* 合同下有几个未用过的排期，就自动生成几张执行单 */
    freeScheds().forEach(s=>S.cards.push(cardFromSched(s)));
  }
  $('curUser').textContent=USERS[S.user].name+' ('+USERS[S.user].id+')';
  renderAll();
}
setDemo('new');
</script>
