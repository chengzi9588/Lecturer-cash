<style>

  if(!state.accUI)resetAccUI('list');
  const f=state.accUI;
  const kindEl=document.getElementById('acc-kind'),nameEl=document.getElementById('acc-name'),numEl=document.getElementById('acc-number'),bankEl=document.getElementById('acc-bank');
  if(kindEl)f.kind=kindEl.value;

function validateAccForm(){
  const f=state.accUI,kind=f.kind,name=f.name.trim(),number=f.number.trim(),bank=f.bank.trim();
  const needBank=kind==='银行卡'||kind==='对公账户';
  if(!name)return '请填写收款户名全称';
  if(!number)return '请填写收款账号';
  if(needBank&&!bank)return '请填写开户行全称';
  if(kind==='银行卡'){
    const digits=number.replace(/\s/g,'');
    if(!/^\d{12,22}$/.test(digits))return '银行卡号一般为 12~22 位数字，请核对';
  }
  if(kind==='支付宝'){
    const ok=/^1\d{10}$/.test(number)||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(number);
    if(!ok)return '支付宝账号请填写手机号或邮箱';
  }
  if(kind==='对公账户'){
    if(state.orgName&&name!==state.orgName)return '对公户名须与机构全称一致：'+state.orgName;
    const digits=number.replace(/\s|\*/g,'');
    if(digits.length<8)return '请填写完整对公账号';
  }
  const dup=state.accounts.some(a=>a.id!==f.id&&a.number.replace(/\s/g,'')===number.replace(/\s/g,''));
  if(dup)return '该收款账号已存在，请勿重复添加';
  return '';
}

function aiWelcome(){
  return {role:'bot',text:'你好，我是51C结算 AI 客服。可先问提现规则、提现方式、账户与常见状态问题。\n答不了或要查具体单据时，请联系对接的项目经理。',quick:true};
}
function ensureChat(){
  if(!Array.isArray(state.chatMsgs)||!state.chatMsgs.length)state.chatMsgs=[aiWelcome()];
}
function aiAnswer(q){
  const s=String(q||'').trim();
  if(!s)return {text:'请输入你想咨询的问题。',fail:false};
  const hit=AI_FAQ.find(x=>x.keys.some(k=>s.includes(k)));
  if(hit&&hit.fail)return {text:'这个问题需要人工核对（如具体提现单、改账户资料、投诉等）。请联系对接的项目经理处理。',fail:true};
  if(hit)return {text:hit.a+'\n\n以上为规则说明，仅供参考；具体以系统展示为准。',fail:false};
  return {text:'我暂时无法准确回答这个问题。你可以换个问法；若有疑问，请联系对接的项目经理。',fail:true};
}
function servicePage(){
  ensureChat();
  const msgs=state.chatMsgs.map(m=>{
    if(m.role==='user')return `<div class="ai-msg user"><div class="ai-avatar">我</div><div class="ai-bubble">${esc(m.text)}</div></div>`;
    const actions=m.fail?`<div class="ai-actions"><span style="font-size:12px;color:var(--brand);font-weight:600">若有疑问，请联系对接的项目经理</span></div>`:'';
    const quick=m.quick?`<div class="ai-chips">${AI_QUICK.map(x=>`<button data-action="ai-quick" data-q="${escAttr(x)}">${esc(x)}</button>`).join('')}</div>`:'';
    return `<div class="ai-msg bot"><div class="ai-avatar">AI</div><div class="ai-bubble">${esc(m.text)}${quick}${actions}<div class="ai-note">AI 回复仅供参考，以系统展示为准</div></div></div>`;
  }).join('');
  return `<section class="screen ai-screen">${nav('AI 客服',true)}
    <div class="ai-page">
      <div class="ai-body" id="aiBody">
        <div class="ai-hi">
          <b>结算提现助手</b>
          <p>可输入提问，或点下方快捷问题。查单、改资料、投诉等若有疑问，请联系对接的项目经理。</p>
        </div>
        ${msgs}
      </div>
      <div class="ai-composer">
        <div class="ai-composer-bar">
          <textarea id="aiInput" rows="1" placeholder="输入问题，例如：提现窗口什么时候开放"></textarea>
          <button class="ai-send" data-action="ai-send">发送</button>
        </div>
      </div>
    </div>
    ${tabs('service')}
  </section>`;
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escAttr(s){return esc(s).replace(/'/g,'&#39;')}
function pushAi(q){
  const text=String(q||'').trim();if(!text){toast('请输入问题');return}
  ensureChat();
  state.chatMsgs.push({role:'user',text});
  const ans=aiAnswer(text);
  state.chatMsgs.push({role:'bot',text:ans.text,fail:!!ans.fail});
  render();
  const body=document.getElementById('aiBody');if(body)body.scrollTop=body.scrollHeight;
}

function annoKey(p){
  if(p==='/invite'||p==='/')return 'invite';
  if(p==='/login-mismatch')return 'mismatch';
  if(p==='/wallet')return 'wallet';
  if(p==='/income')return 'income';
  if(p.startsWith('/income/'))return 'incomeDetail';
  if(p==='/withdraw')return 'withdraw';
  if(p==='/withdraw/confirm')return 'confirm';
  if(p==='/withdraw/password')return 'password';
  if(p==='/withdraw/success')return 'success';
  if(p==='/password/manage')return 'pwdManage';
  if(p.startsWith('/password/'))return 'pwdFlow';
  if(p==='/account')return 'account';
  if(p==='/org-teachers')return 'orgTeachers';
  if(p==='/records')return 'records';
  if(p.startsWith('/record/'))return 'record';
  if(p==='/profile')return 'profile';
  if(p==='/service')return 'service';
  if(p==='/rebind')return 'rebind';
  return '';
}
function renderAnno(){
  const el=document.getElementById('anno');if(!el)return;
  const k=annoKey(route()),pg=ANNO_PAGES[k];
  const ov=Object.keys(ANNO_OVERLAY).find(x=>state[x]);
  const sec=(name,items)=>`<div class="an-sec"><h4>${name}</h4><dl>${items.map(i=>`<div class="an-row"><dt>${i[0]}</dt><dd>${i[1]}</dd></div>`).join('')}</dl></div>`;
  let h='<div class="an-head"><span>页面说明</span><em>随手机页面自动切换</em></div>';
  if(ov)h+=`<div class="an-ov"><b>${ANNO_OVERLAY[ov][0]}</b><p>${ANNO_OVERLAY[ov][1]}</p></div>`;
  if(pg){
    h+=`<h3 class="an-title">${pg.t}</h3><p class="an-desc">${pg.d}</p>`;
    h+=pg.s.map(s=>sec(s[0],s[1])).join('');
    if(['wallet','income','incomeDetail','records','record'].includes(k))h+=sec(ANNO_STATUS[0],ANNO_STATUS[1]);
    if(['wallet','profile','service'].includes(k))h+=sec(ANNO_COMMON[0],ANNO_COMMON[1]);
  }else h+='<p class="an-desc">该页面暂无说明</p>';
  el.innerHTML=h;
}
function render(){
  const p=route();let html;
  if(p==='/invite'||p==='/')html=invite();
  else if(p==='/login-mismatch')html=mismatch();
  else if(p==='/wallet')html=wallet();
  else if(p==='/income')html=income();
  else if(p.startsWith('/income/'))html=incomeDetail(p.split('/')[2]);
  else if(p==='/withdraw')html=withdraw();
  else if(p==='/withdraw/confirm')html=confirmPage();
  else if(p==='/withdraw/password')html=passwordVerify();
  else if(p==='/withdraw/success')html=successPage();
  else if(p==='/password/setup')html=passwordSetup();
  else if(p==='/password/manage')html=passwordManage();
  else if(p==='/password/change')html=passwordChange();
  else if(p==='/password/forgot')html=passwordForgot();
  else if(p==='/account')html=accountPage();
  else if(p==='/org-teachers')html=orgTeachersPage();
  else if(p==='/records')html=records();
  else if(p.startsWith('/record/'))html=recordDetail(p.split('/')[2]);
  else if(p==='/profile')html=profile();
  else if(p==='/service')html=servicePage();
  else if(p==='/rebind')html=rebind();
  else html=notFound();
  app.innerHTML=html;
  const pin=document.getElementById('pin');
  if(pin){pin.focus();pin.setSelectionRange(pin.value.length,pin.value.length)}
  const aiBody=document.getElementById('aiBody');if(aiBody)aiBody.scrollTop=aiBody.scrollHeight;
  document.querySelector('.phone')?.classList.toggle('hide-scenario', p==='/account');
  if(p==='/account'){if(!state.accUI)resetAccUI('list');syncAccountFilled()}
  if((p==='/login-mismatch'||p==='/rebind')&&!app.querySelector('.sticky')){
    const sticky=document.createElement('div');sticky.className='sticky';
    if(p==='/login-mismatch')sticky.innerHTML='<button class="btn" data-go="/invite">重新授权</button>';
    else if(p==='/rebind')sticky.innerHTML=`<button class="btn" data-action="rebind">${state.oldPhoneInvalid?'授权新手机号并绑定':'模拟手机号已修改'}</button>`;
    app.querySelector('.screen').appendChild(sticky);
  }
  renderOverlay();
}

    const x=BAL_INFO[state.balInfo];
    overlay.innerHTML=`<div class="mask" data-action="close-bal-info"><div class="sheet" data-stop><div class="handle"></div><h3>${x.h}</h3>
      <div style="margin:10px 0 16px;font-size:13px;line-height:1.75;color:#3b4457;max-height:56vh;overflow-y:auto">${x.s.map(i=>`<div style="margin:0 0 12px"><b style="display:block;color:#1f2d3d;font-size:13.5px;margin-bottom:2px">${i.t}</b>${i.d}</div>`).join('')}</div>
      <button class="btn secondary" data-action="close-bal-info">我知道了</button></div></div>`;
    return;
  }
  if(state.showOrgInfo){
    overlay.innerHTML=`<div class="mask" data-action="close-org-info"><div class="sheet" data-stop><div class="handle"></div><h3>机构账户说明</h3><p>当前登录人为机构对接人（${state.orgRep}）</p>
      <div class="card" style="margin:0 0 12px"><dl class="kv">
        <div class="kv-row"><dt>结算款归属</dt><dd>${state.orgName}</dd></div>
        <div class="kv-row"><dt>提现人</dt><dd>仅机构对接人，授课老师无个人提现入口</dd></div>
        <div class="kv-row"><dt>提现方式</dt><dd>开发票 + 对公收款</dd></div>
        <div class="kv-row"><dt>个税</dt><dd>不代扣个税</dd></div>
        <div class="kv-row"><dt>收款账户</dt><dd>对公账户户名须为机构全称</dd></div>
      </dl></div>
      <button class="btn secondary" data-action="close-org-info">我知道了</button></div></div>`;
    return;
  }
  if(state.showAccDelete){
    const a=state.accounts.find(x=>x.id===state.accDeleteId);
    overlay.innerHTML=`<div class="mask" data-action="close-acc-delete"><div class="sheet" data-stop>
      <div class="handle"></div>
      <h3>确认删除收款账户</h3>
      <p>删除后不可恢复；仅影响后续新提现，历史提现单保留账户快照。</p>
      <div class="card" style="margin:0 0 12px"><dl class="kv">
        <div class="kv-row"><dt>类型</dt><dd>${a?a.kind:'—'}</dd></div>
        <div class="kv-row"><dt>户名</dt><dd>${a?a.name:'—'}</dd></div>
        <div class="kv-row"><dt>账号</dt><dd>${a?a.number:'—'}</dd></div>
      </dl></div>
      ${state.accounts.length<=1?`<div class="notice danger">${icons.info}<div>这是你当前唯一的收款账户，删除后将无法发起提现，需重新新增。</div></div>`:''}
      <button class="btn danger" data-action="confirm-delete-account">确认删除</button>
      <button class="btn secondary" style="margin-top:10px" data-action="close-acc-delete">取消</button>
    </div></div>`;
    return;
  }
  if(state.mp){
    const m=state.mp,F=m.from,T=m.to||m.from;
    const q=(a,b)=>m.from===a&&m.to===b;
    const quick=[['本月',CUR_MONTH,CUR_MONTH],['近3个月','2026-08',CUR_MONTH],['今年','2026-01',CUR_MONTH],['全部','','']];
    const cells=Array.from({length:12},(_,i)=>{
      const v=m.year+'-'+String(i+1).padStart(2,'0');
      let c='mp-cell';
      if(F&&T&&v>=F&&v<=T){c+=' in';if(v===F)c+=' l s';else if(v===T)c+=' r s';if(v===F&&v===T)c='mp-cell s'}
      if(F&&T&&v>F&&v<T)c='mp-cell in';
      return `<button class="${c}" data-action="mp-month" data-v="${v}">${i+1} 月</button>`;
    }).join('');
    const tip=!F?'点选起始月份；再点一个月份可选区间':(!m.to?`已选起点 <b>${fmtYM(F)}</b>，再点一个月份选区间，或直接确定仅查该月`:`已选 <b>${F===T?fmtYM(F):fmtYM(F)+' – '+fmtYM(T)}</b>`);
    overlay.innerHTML=`<div class="mask" data-action="close-mp"><div class="mp-sheet" data-stop>
      <div class="handle"></div>
      <h3>选择月份</h3>
      <div class="mp-quick">${quick.map(x=>`<button class="${q(x[1],x[2])||(!m.from&&!m.to&&x[0]==='全部')?'on':''}" data-action="mp-quick" data-f="${x[1]}" data-t="${x[2]}">${x[0]}</button>`).join('')}</div>
      <div class="mp-year"><button data-action="mp-year" data-d="-1">‹</button><b>${m.year} 年</b><button data-action="mp-year" data-d="1">›</button></div>
      <div class="mp-grid">${cells}</div>
      <div class="mp-tip">${tip}</div>
      <div class="mp-ops"><button class="btn secondary" data-action="close-mp">取消</button><button class="btn" data-action="mp-ok">确定</button></div>
    </div></div>`;
    return;
  }
  if(state.showInvUpload){
    const rest=Math.max(Number(state.draft.amount||0)-invSum(state.draft.invoices),0);
    overlay.innerHTML=`<div class="mask" data-action="close-inv-upload"><div class="inv-preview-sheet" data-stop>
      <div class="handle"></div>
      <h3>上传电子发票</h3>
      <p>原型模拟：选择文件后识别发票金额。发票统一开具，张数自行确定，合计须等于提现金额 ${fmt(state.draft.amount)}。</p>
      <div class="card form-card" style="box-shadow:none"><div class="field"><label>识别到的发票金额</label><div class="amount-input"><b>¥</b><input id="invAmtInput" inputmode="decimal" autocomplete="off" value="${rest>0?rest.toFixed(2):''}" placeholder="0.00"></div></div></div>
      <button class="btn" style="margin-top:16px" data-action="confirm-inv-upload">确认上传</button>
      <button class="btn secondary" style="margin-top:10px" data-action="close-inv-upload">取消</button>
    </div></div>`;
    return;
  }
  if(state.showInvoicePreview&&(state.draft.invoices||[])[state.invPreviewIdx]){
    const cur=state.draft.invoices[state.invPreviewIdx];
    overlay.innerHTML=`<div class="mask" data-action="close-preview"><div class="inv-preview-sheet" data-stop>
      <div class="handle"></div>
      <h3>发票预览</h3>
      <p>${cur.name} · 金额 ${fmt(cur.amt)}</p>
      <div class="inv-paper">
        <div class="ph m"></div><div class="ph"></div><div class="ph s"></div>
        <div class="ph"></div><div class="ph m"></div><div class="ph s"></div>
        <div style="display:flex;justify-content:space-between;margin-top:16px;font-size:12px;color:#667085"><span>价税合计</span><b style="color:var(--ink)">${fmt(cur.amt)}</b></div>
        <div class="stamp">发票专用章</div>
      </div>
      <button class="btn" style="margin-top:16px" data-action="close-preview">关闭预览</button>
    </div></div>`;
    return;
  }
  if(state.showRules){
    overlay.innerHTML=`<div class="mask" data-action="close-rules"><div class="sheet" data-stop><div class="handle"></div><h3>提现规则说明</h3><p>请在提现前了解以下规则</p>
      <div class="card" style="margin:0 0 12px"><dl class="kv">
        <div class="kv-row"><dt>提现窗口</dt><dd>每月 ${WIN[0]}~${WIN[1]} 日开放；窗口外订单归入未到可提现日</dd></div>
        <div class="kv-row"><dt>提现方式</dt><dd>按订单整笔提现，金额自动计算</dd></div>
        <div class="kv-row"><dt>未到可提现日</dt><dd>到期后进入可提现</dd></div>
        <div class="kv-row"><dt>提交后</dt><dd>不可撤销，进入提现中</dd></div>
        <div class="kv-row"><dt>预计到账</dt><dd>一般订单当月月底前；随时可提现订单 3 个工作日内</dd></div>
        <div class="kv-row"><dt>收款账户</dt><dd>提现时自行勾选确认</dd></div>
      </dl></div>
      <div class="notice">${icons.info}<div>具体规则以系统展示为准。</div></div>
      <button class="btn secondary" style="margin-top:8px" data-action="close-rules">我知道了</button>
    </div></div>`;
    return;
  }
  if(!state.showScenario){overlay.innerHTML='';return}
  overlay.innerHTML=`<div class="mask" data-action="close-scenario"><div class="sheet" data-stop><div class="handle"></div><h3>演示场景</h3><p>切换后可立即体验不同业务状态</p>
    <div class="scenario-row"><div><b>机构账户视角</b><span>开启后以机构对接人登录：仅可开发票、对公收款、不代扣个税</span></div><button class="switch ${state.orgMode?'on':''}" data-action="switch-org"></button></div>
    <div class="scenario-row"><div><b>提现窗口期</b><span>关闭后已到可提现日的订单也归入“未到可提现日”</span></div><button class="switch ${state.inWindow?'on':''}" data-toggle="inWindow"></button></div>
    <div class="scenario-row"><div><b>已填写收款账户</b><span>关闭后发起提现会引导填写账户</span></div><button class="switch ${state.accountFilled?'on':''}" data-toggle="accountFilled"></button></div>
    <div class="scenario-row"><div><b>已设提现密码</b><span>关闭后登录/提现会引导设置；开启后演示密码 123456</span></div><button class="switch ${state.pwdSet?'on':''}" data-action="toggle-pwd-set"></button></div>
    <div class="scenario-row"><div><b>手机号修改后失效</b><span>开启后需用新手机号重新绑定，余额与记录不变</span></div><button class="switch ${state.oldPhoneInvalid?'on':''}" data-toggle="oldPhoneInvalid"></button></div>
    <div class="scenario-row"><div><b>恢复初始演示数据</b><span>重置余额、提现记录及账户状态</span></div><button class="link" data-action="reset">恢复</button></div>
    <button class="btn secondary" style="margin-top:14px" data-action="close-scenario">完成</button>
  </div></div>`;
}
document.addEventListener('click',e=>{
  const stop=e.target.closest('[data-stop]');if(stop&&e.target===stop)return;
  const goEl=e.target.closest('[data-go]');if(goEl){go(goEl.dataset.go);return}
  const toggle=e.target.closest('[data-toggle]');if(toggle){const k=toggle.dataset.toggle;state[k]=!state[k];render();return}
  const el=e.target.closest('[data-action]');if(!el)return;
  if(stop&&stop.contains(e.target)&&!stop.contains(el))return; /* 点弹层内空白处不触发遮罩关闭 */
  const a=el.dataset.action;
  if(a==='back'){history.length>1?history.back():go('/wallet')}
  else if(a==='toggle-money'){state.hideMoney=!state.hideMoney;const c=document.querySelector('.content'),top=c?c.scrollTop:0;render();const n=document.querySelector('.content');if(n)n.scrollTop=top}
  else if(a==='wallet-jump'){
    const isInc=el.dataset.tab==='income';
    state.ui[isInc?'incomeFilter':'recordFilter']=el.dataset.filter;
    state.ui[isInc?'incomeFrom':'recordFrom']='';state.ui[isInc?'incomeTo':'recordTo']='';
    go(el.dataset.tab==='income'?'/income':'/records');
  }
  else if(a==='wallet-filter'){
    const c=document.querySelector('.content'),top=c?c.scrollTop:0;
    state.ui[el.dataset.kind==='income'?'incomeFilter':'recordFilter']=el.dataset.value;
    render();const n=document.querySelector('.content');if(n)n.scrollTop=top;
  }
  else if(a==='switch-org'){const m=!state.orgMode;state=JSON.parse(JSON.stringify(m?initialOrg:initial));state.showScenario=true;state.hideMoney=false;go('/wallet');render();toast(m?'已切换为机构账户视角':'已切换为个人账户视角')}
  else if(a==='scenario'){state.showRules=false;state.showServiceQr=false;state.showAccDelete=false;state.showScenario=true;renderOverlay()}
  else if(a==='close-scenario'){state.showScenario=false;renderOverlay()}
  else if(a==='open-rules'){state.showScenario=false;state.showServiceQr=false;state.showRules=true;renderOverlay()}
  else if(a==='open-year'){state.showYear=true;renderOverlay()}
  else if(a==='close-year'){state.showYear=false;renderOverlay()}
  else if(a==='pick-year'){state.ui.year=el.dataset.y;state.showYear=false;render();renderOverlay()}
  else if(a==='open-bal-info'){state.balInfo=el.dataset.t;renderOverlay()}
  else if(a==='close-bal-info'){state.balInfo='';renderOverlay()}
  else if(a==='open-org-info'){state.showOrgInfo=true;renderOverlay()}
  else if(a==='close-org-info'){state.showOrgInfo=false;renderOverlay()}
  else if(a==='close-rules'){state.showRules=false;renderOverlay()}
  else if(a==='open-service'){state.showScenario=false;state.showRules=false;state.showServiceQr=false;state.showInvoicePreview=false;ensureChat();go('/service')}
  else if(a==='ai-send'){const inp=document.getElementById('aiInput');pushAi(inp?inp.value:'')}
  else if(a==='ai-quick'){pushAi(el.dataset.q||'')}
  else if(a==='open-mp'){
    const k=el.dataset.kind==='income'?'income':'record';
    const f=state.ui[k+'From'],to=state.ui[k+'To'];
    state.mp={kind:el.dataset.kind,from:f,to:to,year:Number((f||CUR_MONTH).slice(0,4))};renderOverlay();
  }
  else if(a==='close-mp'){state.mp=null;renderOverlay()}
  else if(a==='mp-year'){state.mp.year+=Number(el.dataset.d);renderOverlay()}
  else if(a==='mp-month'){
    const v=el.dataset.v,m=state.mp;
    if(!m.from||(m.from&&m.to)){m.from=v;m.to=''}
    else if(v<m.from){m.to=m.from;m.from=v}
    else m.to=v;
    renderOverlay()
  }
  else if(a==='mp-quick'){
    const m=state.mp;m.from=el.dataset.f;m.to=el.dataset.t;if(m.from)m.year=Number(m.from.slice(0,4));renderOverlay()
  }
  else if(a==='mp-ok'){
    const m=state.mp,k=m.kind==='income'?'income':'record';
    state.ui[k+'From']=m.from||'';state.ui[k+'To']=m.from?(m.to||m.from):'';
    state.mp=null;render();renderOverlay()
  }
  else if(a==='clear-date'){
    if(el.dataset.kind==='income'){state.ui.incomeFrom='';state.ui.incomeTo=''}
    else{state.ui.recordFrom='';state.ui.recordTo=''}
    render();
  }
  else if(a==='reset'){state=JSON.parse(JSON.stringify(state.orgMode?initialOrg:initial));state.showScenario=true;state.showRules=false;state.showServiceQr=false;render();toast('演示数据已恢复')}
  else if(a==='authorize'){
    state.bound=true;
    if(!state.pwdSet){toast('手机号匹配成功，请设置提现密码');resetPwdDraft('setup','enter');setTimeout(()=>go('/password/setup'),450)}
    else{toast('手机号匹配成功，已绑定结算账户');setTimeout(()=>go('/wallet'),450)}
  }
  else if(a==='go-withdraw-list'){state.ui.incomeFilter='可提现';state.ui.incomeFrom='';state.ui.incomeTo='';go('/income')}
  else if(a==='edit-orders'){state.ui.pickSel=[...(state.draft.sel||[])];state.ui.incomeFilter='可提现';go('/income')}
  else if(a==='toggle-pick'||a==='pick-all'){
    const c=document.querySelector('.content'),top=c?c.scrollTop:0,ps=state.ui.pickSel=state.ui.pickSel||[];
    if(a==='toggle-pick'){const id=el.dataset.id,i=ps.indexOf(id);if(i>=0)ps.splice(i,1);else ps.push(id)}
    else{
      const f=state.ui.incomeFilter,vis=state.incomes.filter(x=>ost(x)==='可提现'&&(f==='全部'||f==='可提现')&&inDateRange(x.dateStart||x.credited,state.ui.incomeFrom,state.ui.incomeTo));
      if(vis.every(x=>ps.includes(x.id)))state.ui.pickSel=ps.filter(id=>!vis.some(x=>x.id===id));
      else vis.forEach(x=>{if(!ps.includes(x.id))ps.push(x.id)});
    }
    render();const n=document.querySelector('.content');if(n)n.scrollTop=top;
  }
  else if(a==='start-withdraw'||a==='withdraw-selected'){
    const pre=a==='withdraw-selected'?(state.ui.pickSel||[]).filter(id=>withdrawable().some(x=>x.id===id)):[];
    if(a==='withdraw-selected'&&!pre.length){toast('请先选择要提现的订单');return}
    if(state.oldPhoneInvalid){toast('手机号已修改，请先重新绑定');setTimeout(()=>go('/rebind'),500);return}
    if(!state.bound){toast('请先完成微信手机号绑定');go('/invite');return}
    if(!state.accountFilled||!state.accounts.length){toast('请先填写收款账户');state.draft.flow=true;state.draft.sel=pre;resetAccUI(state.accounts.length?'list':'add');setTimeout(()=>go('/account'),450);return}
    if(!state.pwdSet){toast('请先设置提现密码');state.draft.flow=true;state.draft.sel=pre;resetPwdDraft('setup','enter');setTimeout(()=>go('/password/setup'),450);return}
    state.draft={flow:true,sel:pre,amount:'',method:state.orgMode?'invoice':'',accountId:state.draft.accountId||state.defaultAccountId||(state.accounts[0]&&state.accounts[0].id)||'',invoices:[]};go('/withdraw');
  }
  else if(a==='toggle-pwd-set'){
    state.pwdSet=!state.pwdSet;
    if(state.pwdSet){state.pwd=DEMO_PWD;state.pwdFail=0;toast('已设提现密码，演示密码 123456')}
    else{state.pwd='';state.pwdFail=0;toast('已清除提现密码，提现前需重新设置')}
    render();
  }
  else if(a==='start-setup-pwd'){resetPwdDraft('setup','enter');go('/password/setup')}
  else if(a==='start-change-pwd'){resetPwdDraft('change','old');go('/password/change')}
  else if(a==='send-sms-code'){toast('验证码已发送（演示可用 000000）')}
  else if(a==='go-verify-pwd'){
    if(!state.pwdSet){toast('请先设置提现密码');resetPwdDraft('setup','enter');go('/password/setup');return}
    resetPwdDraft('verify','');state.pwdDraft.value='';go('/withdraw/password');
  }
  else if(a==='toggle-order'){
    const c=document.querySelector('.content'),top=c?c.scrollTop:0,d=state.draft,id=el.dataset.id;
    d.sel=d.sel||[];const i=d.sel.indexOf(id);if(i>=0)d.sel.splice(i,1);else d.sel.push(id);
    render();const n=document.querySelector('.content');if(n)n.scrollTop=top;
  }
  else if(a==='select-all-orders'){
    const c=document.querySelector('.content'),top=c?c.scrollTop:0,d=state.draft,pk=pickable();
    d.sel=pk.every(x=>(d.sel||[]).includes(x.id))?[]:pk.map(x=>x.id);
    render();const n=document.querySelector('.content');if(n)n.scrollTop=top;
  }
  else if(a==='amount-next'){
    const d=state.draft,sel=draftOrders();
    if(!sel.length){toast('请选择要提现的订单');return}
    if(!d.method){toast('请选择提现方式');return}
    const n=sumAmt(sel);
    if(d.method==='invoice'){
      const invs=d.invoices||[];
      if(!invs.length){toast('请先上传电子发票');return}
      if(Math.abs(invSum(invs)-n)>0.005){toast('发票合计 '+fmt(invSum(invs))+' 与提现金额 '+fmt(n)+' 不一致，请补传或删除后重传');return}
    }
    d.amount=n.toFixed(2);go('/withdraw/confirm');
  }
  else if(a==='choose-method'){
    const c=document.querySelector('.content'),top=c?c.scrollTop:0;
    if(state.draft.method!==el.dataset.method){state.draft.invoices=[]}
    state.draft.method=el.dataset.method;render();
    const n=document.querySelector('.content');if(n)n.scrollTop=top;
  }
  else if(a==='start-add-account'){
    resetAccUI('add');render();
  }
  else if(a==='edit-account'){
    const acc=state.accounts.find(x=>x.id===el.dataset.id);if(!acc)return;
    resetAccUI('edit',acc);render();
  }
  else if(a==='cancel-acc-form'){resetAccUI('list');render()}
  else if(a==='set-default-account'){
    state.defaultAccountId=el.dataset.id;state.draft.accountId=el.dataset.id;toast('已设为默认收款账户');render();
  }
  else if(a==='ask-delete-account'){
    state.accDeleteId=el.dataset.id;state.showAccDelete=true;state.showScenario=false;renderOverlay();
  }
  else if(a==='close-acc-delete'){state.showAccDelete=false;state.accDeleteId='';renderOverlay()}
  else if(a==='confirm-delete-account'){
    const id=state.accDeleteId;
    state.accounts=state.accounts.filter(x=>x.id!==id);
    syncAccountFilled();
    state.showAccDelete=false;state.accDeleteId='';
    if(state.accUI.mode==='edit'&&state.accUI.id===id)resetAccUI('list');
    toast(state.accounts.length?'账户已删除':'账户已删除，请重新新增后才能提现');render();
  }
  else if(a==='save-account'){
    readAccForm();
    const err=validateAccForm();if(err){toast(err);return}
    const f=state.accUI,needBank=f.kind==='银行卡'||f.kind==='对公账户';
    const payload={kind:f.kind,name:f.name.trim(),number:f.number.trim(),bank:needBank?f.bank.trim():''};
    const fromWithdraw=!!state.draft.flow;
    if(f.mode==='edit'){
      const acc=state.accounts.find(x=>x.id===f.id);if(!acc){toast('账户不存在');return}
      Object.assign(acc,payload);toast('账户已更新');
    }else{
      const id=(state.orgMode?'o':'a')+Date.now();
      state.accounts.push(Object.assign({id},payload));
      if(!state.defaultAccountId)state.defaultAccountId=id;
      state.draft.accountId=id;toast('新账户已保存');
    }
    syncAccountFilled();resetAccUI('list');
    if(fromWithdraw&&state.accounts.length){
      setTimeout(()=>{
        if(!state.pwdSet){resetPwdDraft('setup','enter');go('/password/setup');return}
        if(state.draft.amount)go('/withdraw/confirm');
        else go('/withdraw');
      },450);
    }else render();
  }
  else if(a==='choose-account'){state.draft.accountId=el.dataset.id;render()}
  else if(a==='copy-invoice'){navigator.clipboard?.writeText(INVOICE_COPY).catch(()=>{});toast('开票信息已复制')}
  else if(a==='upload-invoice'){
    if(!(Number(state.draft.amount)>0)){toast('请先选择提现订单');return}
    state.showInvUpload=true;renderOverlay();
  }
  else if(a==='close-inv-upload'){state.showInvUpload=false;renderOverlay()}
  else if(a==='confirm-inv-upload'){
    const x=Number((document.getElementById('invAmtInput')||{}).value);
    if(!(x>0)){toast('请输入发票金额');return}
    const list=state.draft.invoices=state.draft.invoices||[];
    list.push({name:'结算发票_'+(list.length+1)+'_'+x.toFixed(2).replace('.','')+'.pdf',amt:Math.round(x*100)/100});
    state.showInvUpload=false;toast('发票上传成功');render();renderOverlay()
  }
  else if(a==='remove-invoice'){
    state.draft.invoices.splice(Number(el.dataset.idx),1);toast('已删除该发票');render()
  }
  else if(a==='preview-invoice'){
    const i=Number(el.dataset.idx||0);
    if(!(state.draft.invoices||[])[i]){toast('请先上传电子发票');return}
    state.invPreviewIdx=i;state.showInvoicePreview=true;renderOverlay();
  }
  else if(a==='close-preview'){state.showInvoicePreview=false;renderOverlay()}
  else if(a==='rebind'){
    if(state.oldPhoneInvalid){state.oldPhoneInvalid=false;state.bound=true;toast('新手机号已绑定原结算账户');setTimeout(()=>go('/profile'),500)}
    else{state.oldPhoneInvalid=true;state.bound=false;render();toast('旧绑定已失效，余额与历史保持不变')}
  }
});
function doSubmitWithdraw(){
  const a=curAcc(),sel=draftOrders();
  if(!state.accountFilled){toast('请先填写收款账户');go('/account');return}
  if(!state.pwdSet){toast('请先设置提现密码');resetPwdDraft('setup','enter');go('/password/setup');return}
  if(!sel.length||sel.length!==(state.draft.sel||[]).length){toast('订单状态发生变化，请重新选择');go('/withdraw');return}
  state.pwdFail=0;
  const now=new Date(),stamp=String(now.getTime()).slice(-6);
  const mask=String(a.number||'').replace(/(\d{4})\d+(\d{4})/,'$1 **** $2');
  const sp=splitInfo(sel),ids=[];
  /* 拆单：普通批次与后台标记批次各生成一张提现单，便于财务分别付款；发票统一开具不拆分 */
  [[sp.nor,'TX',false],[sp.emg,'TX',true]].forEach(([g,pre,em],k)=>{
    if(!g.length)return;
    const id=pre+'20261103'+stamp+(sp.n>1?String(k+1):'');
    g.forEach(o=>{o.status='提现中';o.wid=id});
    state.records.unshift({id,type:em?'urgent':'normal',amount:sumAmt(g),method:methodName(state.draft.method),submit:'2026-11-03 19:16',eta:em?ETA_E:ETA_N,status:'提现中',note:'',kind:'processing',orders:g.map(o=>o.id),account:{kind:a.kind,name:a.name,number:mask||a.number,bank:a.bank||''}});
    ids.push(id);
  });
  state.lastIds=ids;state.ui.pickSel=[];
  Object.assign(state.draft,{flow:false,sel:[],amount:'',invoices:[]});
  resetPwdDraft('','');
  go('/withdraw/success');
}
function onPinInput(raw){
  const v=String(raw||'').replace(/\D/g,'').slice(0,6);
  const mode=state.pwdDraft.mode,step=state.pwdDraft.step;
  if(mode==='setup'){
    if(step==='enter'||!step){state.pwdDraft.step='enter';state.pwdDraft.value=v;render();if(v.length===6){state.pwdDraft.step='confirm';state.pwdDraft.confirm='';render();toast('请再次输入以确认')}return}
    state.pwdDraft.confirm=v;render();
    if(v.length===6){
      if(v!==state.pwdDraft.value){toast('两次密码不一致，请重新设置');resetPwdDraft('setup','enter');render();return}
      state.pwdSet=true;state.pwd=v;state.pwdFail=0;toast('提现密码设置成功');
      setTimeout(afterPwdSetup,450);
    }
    return;
  }
  if(mode==='verify'){
    state.pwdDraft.value=v;render();
    if(v.length===6){
      if(v===state.pwd){doSubmitWithdraw()}
      else{state.pwdFail=(state.pwdFail||0)+1;state.pwdDraft.value='';toast('提现密码错误');render()}
    }
    return;
  }
  if(mode==='change'){
    if(step==='old'){
      state.pwdDraft.old=v;render();
      if(v.length===6){
        if(v!==state.pwd){state.pwdDraft.old='';toast('原密码错误');render();return}
        state.pwdDraft.step='enter';state.pwdDraft.value='';render();toast('请设置新密码');
      }
      return;
    }
    if(step==='enter'){
      state.pwdDraft.value=v;render();
      if(v.length===6){state.pwdDraft.step='confirm';state.pwdDraft.confirm='';render();toast('请再次输入新密码')}
      return;
    }
    state.pwdDraft.confirm=v;render();
    if(v.length===6){
      if(v!==state.pwdDraft.value){toast('两次新密码不一致');state.pwdDraft.step='enter';state.pwdDraft.value='';state.pwdDraft.confirm='';render();return}
      state.pwd=v;state.pwdFail=0;toast('提现密码已修改');resetPwdDraft('','');setTimeout(()=>go('/password/manage'),450);
    }
    return;
  }
  if(mode==='forgot'){
    if(step==='sms'){
      state.pwdDraft.code=v;render();
      if(v.length===6){state.pwdDraft.step='enter';state.pwdDraft.value='';render();toast('验证通过，请设置新密码')}
      return;
    }
    if(step==='enter'){
      state.pwdDraft.value=v;render();
      if(v.length===6){state.pwdDraft.step='confirm';state.pwdDraft.confirm='';render();toast('请再次输入新密码')}
      return;
    }
    state.pwdDraft.confirm=v;render();
    if(v.length===6){
      if(v!==state.pwdDraft.value){toast('两次密码不一致');state.pwdDraft.step='enter';state.pwdDraft.value='';state.pwdDraft.confirm='';render();return}
      state.pwdSet=true;state.pwd=v;state.pwdFail=0;toast('提现密码已重置');resetPwdDraft('','');
      setTimeout(()=>{if(state.draft.amount)go('/withdraw/password');else go('/password/manage')},450);
    }
  }
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey)return;
  if(e.target&&e.target.id==='aiInput'){e.preventDefault();pushAi(e.target.value)}
});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='pin')onPinInput(e.target.value);
});
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='acc-kind'){
    readAccForm();state.accUI.kind=e.target.value;if(state.accUI.kind==='支付宝')state.accUI.bank='';render();return
  }
  const el=e.target.closest('[data-date]');if(!el)return;
  const k=el.dataset.date;
  const [kind,end]=k.split('-'),pre=kind==='income'?'income':'record';
  state.ui[pre+(end==='from'?'From':'To')]=el.value;
  const F=state.ui[pre+'From'],T=state.ui[pre+'To'];
  if(F&&T&&F>T){if(end==='from')state.ui[pre+'To']=F;else state.ui[pre+'From']=T}
  render();
});
window.addEventListener('hashchange',()=>{
  const p=route();
  if(p==='/password/setup')resetPwdDraft('setup','enter');
  else if(p==='/password/change')resetPwdDraft('change','old');
  else if(p==='/password/forgot')resetPwdDraft('forgot','sms');
  else if(p==='/withdraw/password'){resetPwdDraft('verify','');state.pwdDraft.value=''}
  render();
});
render();
</script>
