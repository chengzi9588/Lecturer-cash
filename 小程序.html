/** 劳务费个税预估（财务公式）：=MAX((劳务费-IF(劳务费<4000,800,劳务费*0.2))*10%*{2,3,4}-1000*{0,2,7},0)
 *  即取 20% / 30% / 40% 三档（速算扣除 0 / 2000 / 7000）中的最大值，且不小于 0。
 *  单月多笔劳务费：计税基础累加，本笔个税 = 累计应缴 − 此前已计应缴。 */
function laborTaxRaw(base){
  const taxable=base-(base<4000?800:base*0.2);
  return Math.max(taxable*0.2,taxable*0.3-2000,taxable*0.4-7000,0);
}
function estimateLaborTax(amt,prior){
  if(prior==null)prior=(state.records||[]).filter(r=>r.method==='劳务费代扣个税'&&String(r.submit).startsWith(CUR_MONTH)&&r.kind!=='failed'&&r.kind!=='delay').reduce((s,r)=>s+r.amount,0);
  const a=Number(amt||0),pr=Number(prior||0);
  return Math.round((laborTaxRaw(a+pr)-(pr>0?laborTaxRaw(pr):0))*100)/100;
}

function validateAccForm(){
  const f=state.accUI,kind=f.kind,name=f.name.trim(),number=f.number.trim(),bank=f.bank.trim();
  const needBank=kind==='银行卡'||kind==='对公账户';

  if(!number)return '请填写收款账号';
  if(needBank&&!bank)return '请填写开户行全称';
  if(kind==='银行卡'){
    const digits=number.replace(/\s/g,'');
    if(!/^\d{12,22}$/.test(digits))return '银行卡号一般为 12~22 位数字，请核对';
  }
  if(kind==='支付宝'){
    const ok=/^1\d{10}$/.test(number)||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(number);
    if(!ok)return '支付宝账号请填写手机号或邮箱';
  }
  if(kind==='对公账户'){
    if(state.orgName&&name!==state.orgName)return '对公户名须与机构全称一致：'+state.orgName;
    const digits=number.replace(/\s|\*/g,'');

  const dup=state.accounts.some(a=>a.id!==f.id&&a.number.replace(/\s/g,'')===number.replace(/\s/g,''));
  if(dup)return '该收款账号已存在，请勿重复添加';
  return '';
}

  return {text:'我暂时无法准确回答这个问题。你可以换个问法，或添加企微客服由人工协助。',fail:true};
}

function validateAmount(type){
  const input=document.getElementById('amount'),raw=(input?.value||'').trim(),n=Number(raw),max=type==='urgent'?state.balances.urgent:state.balances.normal;
  if(!raw||!Number.isFinite(n)||n<=0){toast('请输入有效的提现金额');return null}
  if(!/^\d+(\.\d{1,2})?$/.test(raw)){toast('提现金额最多保留两位小数');return null}
  if(n>max){toast(`提现金额不能超过可提现余额 ${fmt(max)}`);return null}
  return n;
}

function doSubmitWithdraw(){
  const n=Number(state.draft.amount),urgent=state.draft.type==='urgent',key=urgent?'urgent':'normal',a=curAcc();
  if(!state.accountFilled){toast('请先填写收款账户');go('/account');return}
  if(!state.pwdSet){toast('请先设置提现密码');resetPwdDraft('setup','enter');go('/password/setup');return}
  if(n<=0||n>state.balances[key]){toast('余额发生变化，请返回重新输入');return}
  state.balances[key]-=n;state.balances.processing+=n;state.pwdFail=0;
  const now=new Date(),stamp=String(now.getTime()).slice(-6);
  const mask=String(a.number||'').replace(/(\d{4})\d+(\d{4})/,'$1 **** $2');
  state.records.unshift({id:(urgent?'JTX':'TX')+'20261103'+stamp,type:urgent?'urgent':'normal',amount:n,method:methodName(state.draft.method),submit:'2026-11-03 19:16',eta:urgent?'以紧急付款进度为准':'当月月底前到账',status:'提现中',note:'',kind:'processing',account:{kind:a.kind,name:a.name,number:mask||a.number,bank:a.bank||''}});
  resetPwdDraft('','');
  go('/withdraw/success');
}
function onPinInput(raw){
  const v=String(raw||'').replace(/\D/g,'').slice(0,6);
  const mode=state.pwdDraft.mode,step=state.pwdDraft.step;
  if(mode==='setup'){
    if(step==='enter'||!step){state.pwdDraft.step='enter';state.pwdDraft.value=v;render();if(v.length===6){state.pwdDraft.step='confirm';state.pwdDraft.confirm='';render();toast('请再次输入以确认')}return}
    state.pwdDraft.confirm=v;render();
    if(v.length===6){
      if(v!==state.pwdDraft.value){toast('两次密码不一致，请重新设置');resetPwdDraft('setup','enter');render();return}
      state.pwdSet=true;state.pwd=v;state.pwdFail=0;toast('提现密码设置成功');
      setTimeout(afterPwdSetup,450);
    }
    return;
  }
  if(mode==='verify'){
    state.pwdDraft.value=v;render();
    if(v.length===6){
      if(v===state.pwd){doSubmitWithdraw()}
      else{state.pwdFail=(state.pwdFail||0)+1;state.pwdDraft.value='';toast('提现密码错误');render()}
    }
    return;
  }
  if(mode==='change'){
    if(step==='old'){
      state.pwdDraft.old=v;render();
      if(v.length===6){
        if(v!==state.pwd){state.pwdDraft.old='';toast('原密码错误');render();return}
        state.pwdDraft.step='enter';state.pwdDraft.value='';render();toast('请设置新密码');
      }
      return;
    }
    if(step==='enter'){
      state.pwdDraft.value=v;render();
      if(v.length===6){state.pwdDraft.step='confirm';state.pwdDraft.confirm='';render();toast('请再次输入新密码')}
      return;
    }
    state.pwdDraft.confirm=v;render();
    if(v.length===6){
      if(v!==state.pwdDraft.value){toast('两次新密码不一致');state.pwdDraft.step='enter';state.pwdDraft.value='';state.pwdDraft.confirm='';render();return}
      state.pwd=v;state.pwdFail=0;toast('提现密码已修改');resetPwdDraft('','');setTimeout(()=>go('/password/manage'),450);
    }
    return;
  }
  if(mode==='forgot'){
    if(step==='sms'){
      state.pwdDraft.code=v;render();
      if(v.length===6){state.pwdDraft.step='enter';state.pwdDraft.value='';render();toast('验证通过，请设置新密码')}
      return;
    }
    if(step==='enter'){
      state.pwdDraft.value=v;render();
      if(v.length===6){state.pwdDraft.step='confirm';state.pwdDraft.confirm='';render();toast('请再次输入新密码')}
      return;
    }
    state.pwdDraft.confirm=v;render();
    if(v.length===6){
      if(v!==state.pwdDraft.value){toast('两次密码不一致');state.pwdDraft.step='enter';state.pwdDraft.value='';state.pwdDraft.confirm='';render();return}
      state.pwdSet=true;state.pwd=v;state.pwdFail=0;toast('提现密码已重置');resetPwdDraft('','');
      setTimeout(()=>{if(state.draft.amount)go('/withdraw/password');else go('/password/manage')},450);
    }
  }
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey)return;
  if(e.target&&e.target.id==='aiInput'){e.preventDefault();pushAi(e.target.value)}
});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='pin')onPinInput(e.target.value);
});
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='acc-kind'){
    readAccForm();state.accUI.kind=e.target.value;if(state.accUI.kind==='支付宝')state.accUI.bank='';render();return
  }
  const el=e.target.closest('[data-date]');if(!el)return;
  const k=el.dataset.date;
  const [kind,end]=k.split('-'),pre=kind==='income'?'income':'record';
  state.ui[pre+(end==='from'?'From':'To')]=el.value;
  const F=state.ui[pre+'From'],T=state.ui[pre+'To'];
  if(F&&T&&F>T){if(end==='from')state.ui[pre+'To']=F;else state.ui[pre+'From']=T}
  render();
});
window.addEventListener('hashchange',()=>{
  const p=route();
  if(p==='/password/setup')resetPwdDraft('setup','enter');
  else if(p==='/password/change')resetPwdDraft('change','old');
  else if(p==='/password/forgot')resetPwdDraft('forgot','sms');
  else if(p==='/withdraw/password'){resetPwdDraft('verify','');state.pwdDraft.value=''}
  render();
});
render();
</script>
