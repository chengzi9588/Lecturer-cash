const monthKey=t=>t.slice(0,4)+' 年 '+Number(t.slice(5,7))+' 月';
function groupByMonth(list,timeOf,rowFn){
  const sorted=[...list].sort((x,y)=>timeOf(y).localeCompare(timeOf(x)));
  const groups=[];sorted.forEach(x=>{const k=monthKey(timeOf(x));let g=groups.find(i=>i.k===k);if(!g){g={k,items:[]};groups.push(g)}g.items.push(x)});
  return groups.map(g=>`<div class="month-title">${g.k}<span>${g.items.length} 笔</span></div><div class="card list-card">${g.items.map(rowFn).join('')}</div>`).join('');
}

function validateAmount(type){
  const input=document.getElementById('amount'),raw=(input?.value||'').trim(),n=Number(raw),max=type==='urgent'?state.balances.urgent:state.balances.normal;
  if(!raw||!Number.isFinite(n)||n<=0){toast('请输入有效的提现金额');return null}
  if(!/^\d+(\.\d{1,2})?$/.test(raw)){toast('提现金额最多保留两位小数');return null}
  if(n>max){toast(`提现金额不能超过可提现余额 ${fmt(max)}`);return null}
  return n;
}
document.addEventListener('click',e=>{
  const stop=e.target.closest('[data-stop]');if(stop&&e.target===stop)return;
  const goEl=e.target.closest('[data-go]');if(goEl){go(goEl.dataset.go);return}
  const toggle=e.target.closest('[data-toggle]');if(toggle){const k=toggle.dataset.toggle;state[k]=!state[k];render();return}
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action;
  if(a==='back'){history.length>1?history.back():go('/wallet')}
  else if(a==='toggle-money'){state.hideMoney=!state.hideMoney;const c=document.querySelector('.content'),top=c?c.scrollTop:0;render();const n=document.querySelector('.content');if(n)n.scrollTop=top}
  else if(a==='wallet-jump'){
    state.ui[el.dataset.tab==='income'?'incomeFilter':'recordFilter']=el.dataset.filter;
    go(el.dataset.tab==='income'?'/income':'/records');
  }
  else if(a==='wallet-filter'){
    const c=document.querySelector('.content'),top=c?c.scrollTop:0;
    state.ui[el.dataset.kind==='income'?'incomeFilter':'recordFilter']=el.dataset.value;
    render();const n=document.querySelector('.content');if(n)n.scrollTop=top;
  }
  else if(a==='switch-org'){const m=!state.orgMode;state=JSON.parse(JSON.stringify(m?initialOrg:initial));state.showScenario=true;state.hideMoney=false;go('/wallet');render();toast(m?'已切换为机构账户视角':'已切换为个人账户视角')}
  else if(a==='scenario'){state.showScenario=true;renderOverlay()}
  else if(a==='close-scenario'){state.showScenario=false;renderOverlay()}
  else if(a==='reset'){state=JSON.parse(JSON.stringify(state.orgMode?initialOrg:initial));state.showScenario=true;render();toast('演示数据已恢复')}
  else if(a==='authorize'){state.bound=true;toast('手机号匹配成功，已绑定结算账户');setTimeout(()=>go('/wallet'),450)}
  else if(a==='start-withdraw'){
    const type=el.dataset.type;
    if(state.oldPhoneInvalid){toast('手机号已修改，请先重新绑定');setTimeout(()=>go('/rebind'),500);return}
    if(!state.bound){toast('请先完成微信手机号绑定');go('/invite');return}
    if(!state.accountFilled){toast('请先填写收款账户');state.draft.type=type;setTimeout(()=>go('/account'),450);return}
    state.draft={type,amount:'',method:state.orgMode?'invoice':''};go(type==='urgent'?'/withdraw/emergency':'/withdraw/normal');
  }
  else if(a==='all-amount'){const type=el.dataset.type,n=type==='urgent'?state.balances.urgent:state.balances.normal;document.getElementById('amount').value=n.toFixed(2)}
  else if(a==='amount-next'){
    const type=el.dataset.type,n=validateAmount(type);if(n===null)return;
    if(!state.draft.method||state.draft.type!==type){toast('请选择提现方式');return}
    if(state.draft.method==='invoice'){
      if(!state.draft.invoice){toast('请先上传等额电子发票');return}
      if(Math.abs(state.draft.invoiceAmt-n)>0.005){state.draft.invoice=false;toast('发票金额与提现金额不一致，请重新上传');render();return}
    }
    state.draft.type=type;state.draft.amount=n.toFixed(2);go('/withdraw/confirm');
  }
  else if(a==='choose-method'){
    const c=document.querySelector('.content'),top=c?c.scrollTop:0,inp=document.getElementById('amount');
    const type=el.dataset.type;
    if(state.draft.type!==type){state.draft={type,amount:'',method:state.orgMode?'invoice':''}}
    if(inp)state.draft.amount=inp.value;
    if(state.draft.method!==el.dataset.method){state.draft.invoice=false;state.draft.invoiceAmt=0}
    state.draft.method=el.dataset.method;render();
    const n=document.querySelector('.content');if(n)n.scrollTop=top;
  }
  else if(a==='save-account'){
    const kind=document.getElementById('acc-kind').value,name=document.getElementById('acc-name').value.trim(),number=document.getElementById('acc-number').value.trim(),bank=document.getElementById('acc-bank').value.trim();
    const needBank=kind==='银行卡'||kind==='对公账户';
    if(!name||!number||(needBank&&!bank)){toast(needBank?'请完整填写户名、账号和开户行':'请完整填写户名和账号');return}
    const id='a'+Date.now();state.accounts.push({id,kind,name,number,bank:needBank?bank:''});state.draft.accountId=id;state.accountFilled=true;toast('收款账户已保存，提现时可选择此账户');
    setTimeout(()=>{if(state.draft.type&&state.draft.amount)go('/withdraw/confirm');else if(state.draft.type)go(state.draft.type==='urgent'?'/withdraw/emergency':'/withdraw/normal');else go('/profile')},450);
  }
  else if(a==='delete-account'){state.accounts=state.accounts.filter(x=>x.id!==el.dataset.id);if(state.draft.accountId===el.dataset.id)state.draft.accountId='';toast('账户已删除');render()}
  else if(a==='choose-account'){state.draft.accountId=el.dataset.id;render()}
  else if(a==='copy-invoice'){toast('开票信息已复制')}
  else if(a==='upload-invoice'){
    const inp=document.getElementById('amount'),v=Number(inp&&inp.value);
    if(!(v>0)){toast('请先输入提现金额');return}
    state.draft.amount=inp.value;state.draft.invoice=true;state.draft.invoiceAmt=v;toast('发票上传成功，金额校验通过');render()
  }
  else if(a==='submit-withdraw'){
    const n=Number(state.draft.amount),urgent=state.draft.type==='urgent',key=urgent?'urgent':'normal';
    if(!state.accountFilled){toast('请先填写收款账户');go('/account');return}
    if(n<=0||n>state.balances[key]){toast('余额发生变化，请返回重新输入');return}
    state.balances[key]-=n;state.balances.processing+=n;
    const now=new Date(),stamp=String(now.getTime()).slice(-6);
    state.records.unshift({id:(urgent?'JTX':'TX')+'20261103'+stamp,type:urgent?'urgent':'normal',amount:n,method:methodName(state.draft.method),submit:'2026-11-03 19:16',eta:urgent?'以紧急付款进度为准':'当月月底前到账',status:'提现中',note:'',kind:'processing'});
    go('/withdraw/success');
  }
  else if(a==='rebind'){
    if(state.oldPhoneInvalid){state.oldPhoneInvalid=false;state.bound=true;toast('新手机号已绑定原结算账户');setTimeout(()=>go('/profile'),500)}
    else{state.oldPhoneInvalid=true;state.bound=false;render();toast('旧绑定已失效，余额与历史保持不变')}
  }
});
window.addEventListener('hashchange',render);
render();
</script>
